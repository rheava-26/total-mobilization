<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NAVAL DOMINANCE</title>
<style>
  /* ===== reset / base ===== */
  :root{
    --ink:#dfeaf2; --dim:#8ba0b0; --panel:rgba(10,18,26,.82); --panel2:rgba(14,26,36,.9);
    --line:rgba(120,160,190,.22); --accent:#57b8ff; --good:#54e08a; --bad:#ff5d5d; --warn:#ffcf5d;
    --ui:1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; background:#05080c; color:var(--ink);
    font-family:"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif; user-select:none}
  #bg{position:fixed; inset:0; z-index:0; display:block; width:100%; height:100%; touch-action:none; cursor:crosshair}
  /* ===== HUD overlay: none by default, children opt back in ===== */
  #hud{position:fixed; inset:0; z-index:4; pointer-events:none; font-size:calc(14px*var(--ui))}
  #hud>*{pointer-events:auto}
  .topbar{position:absolute; top:10px; left:12px; right:12px; display:flex; align-items:center; gap:10px}
  .brand{font-weight:800; letter-spacing:2px; font-size:16px; color:#eaf4ff; text-shadow:0 2px 10px #000}
  .brand small{display:block; font-weight:600; letter-spacing:3px; font-size:9px; color:var(--dim)}
  .spacer{flex:1}
  .btn{pointer-events:auto; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:7px 11px; border-radius:8px; font-size:12px; cursor:pointer; backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--accent); color:#fff}
  .btn.on{border-color:var(--good); color:var(--good)}
  /* selection info panel */
  .info{position:absolute; left:12px; bottom:12px; width:250px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:12px 13px; backdrop-filter:blur(8px); box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:none}
  .info.show{display:block}
  .info h3{margin:0 0 2px; font-size:14px; letter-spacing:1px}
  .info .cls{color:var(--dim); font-size:11px; letter-spacing:1px; margin-bottom:9px}
  .bar{height:8px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; margin:5px 0}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--good),#9fe)}
  .kv{display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin:3px 0}
  .kv b{color:var(--ink); font-weight:600}
  /* hint / help */
  .hint{position:absolute; right:12px; bottom:12px; width:230px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; font-size:11px; color:var(--dim); backdrop-filter:blur(8px); line-height:1.6}
  .hint b{color:var(--ink)}
  .hint kbd{background:rgba(255,255,255,.09); border:1px solid var(--line); border-radius:4px; padding:0 5px; color:var(--ink)}
  /* now playing */
  #nowPlaying{position:absolute; top:52px; right:12px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:11px; opacity:0; transform:translateY(-6px); transition:.4s; max-width:280px}
  #nowPlaying.show{opacity:1; transform:none}
  #nowPlaying .npq{display:block; color:var(--accent); letter-spacing:2px; font-size:9px}
  #nowPlaying .npt{display:block; font-weight:700; color:#fff}
  #nowPlaying .npa{display:block; color:var(--dim)}
  /* toast + tooltip */
  #toast{position:absolute; left:50%; top:64px; transform:translateX(-50%); background:var(--panel2);
    border:1px solid var(--line); border-radius:9px; padding:8px 14px; font-size:12px; opacity:0; transition:.3s; letter-spacing:1px}
  #toast.show{opacity:1}
  #tip{position:fixed; z-index:30; pointer-events:none; background:#0b1620; border:1px solid var(--line);
    border-radius:7px; padding:5px 9px; font-size:11px; color:var(--ink); opacity:0; transition:.12s; max-width:240px}
  #tip.show{opacity:1}
  /* boot / loading */
  #boot{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(60% 60% at 50% 40%,#0a1622,#05080c); gap:14px}
  #boot .b1{font-weight:800; letter-spacing:6px; font-size:26px; color:#eaf4ff}
  #boot .b2{color:var(--dim); letter-spacing:3px; font-size:11px}
  #boot.hide{opacity:0; pointer-events:none; transition:.6s}
  .selbox{position:absolute; border:1px solid var(--accent); background:rgba(87,184,255,.12); display:none; z-index:3}
  #reticle{position:absolute; left:50%; top:50%; width:36px; height:36px; margin:-18px 0 0 -18px; pointer-events:none; display:none; z-index:3}
  #reticle.show{display:block}
  #reticle::before,#reticle::after{content:''; position:absolute; background:var(--recCol,#ff5d5d)}
  #reticle::before{left:50%; top:-8px; bottom:-8px; width:2px; margin-left:-1px}
  #reticle::after{top:50%; left:-8px; right:-8px; height:2px; margin-top:-1px}
  #reticle .ring{position:absolute; inset:0; border:2px solid var(--recCol,#ff5d5d); border-radius:50%; opacity:.9}
  #possBar{position:absolute; left:50%; top:70px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 14px; font-size:12px; letter-spacing:1px; display:none; color:var(--good)}
  #possBar.show{display:block}
  #prompt{position:absolute; left:50%; bottom:78px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:7px 16px; font-size:12px; color:var(--ink); display:none; letter-spacing:1px; backdrop-filter:blur(6px)}
  #prompt.show{display:block}
  #endBanner{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:22px 44px; display:none; box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #endBanner.show{display:block}
  #endBanner h2{margin:0 0 5px; font-size:30px; letter-spacing:4px}
  #endBanner p{margin:0; color:var(--dim); font-size:12px}
  #endBanner.win h2{color:var(--good)} #endBanner.lose h2{color:var(--bad)}
  /* ===== CAMPAIGN overlay (strategic map) ===== */
  #campaign{position:fixed; inset:0; z-index:6; display:none; overflow:hidden; color:var(--ink);
    background:radial-gradient(70% 70% at 50% 38%,#0a1826,#05080c)}
  #campaign.show{display:block}
  .camptop{position:absolute; top:10px; left:12px; right:12px; display:flex; align-items:center; gap:10px; z-index:2}
  .camptop .brand{font-weight:800; letter-spacing:2px; font-size:16px; color:#eaf4ff; text-shadow:0 2px 10px #000}
  .camptop .stat{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:12px; letter-spacing:1px; backdrop-filter:blur(6px)}
  .camptop .stat b{color:var(--accent); font-weight:700}
  #campsvg{position:absolute; inset:0; width:100%; height:100%; z-index:1}
  .zlink{stroke:rgba(120,160,190,.28); stroke-width:2}
  .znode{cursor:pointer}
  .znode circle{stroke:#0a0f14; stroke-width:2; transition:.15s}
  .znode:hover circle{stroke:var(--accent)}
  .znode.sel circle{stroke:#fff; stroke-width:3}
  .znode.atk circle{stroke:var(--warn); stroke-width:3; stroke-dasharray:5 3}
  .znode text{fill:var(--ink); text-anchor:middle; pointer-events:none; font-family:inherit; text-shadow:0 1px 4px #000}
  .znode .zs{font-size:13px; font-weight:800}
  .znode .zn{font-size:11px; fill:var(--dim)}
  #camppanel{position:absolute; left:12px; bottom:12px; width:252px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:12px 13px; backdrop-filter:blur(8px); box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:2}
  #camppanel h3{margin:0 0 6px; font-size:14px; letter-spacing:1px}
  #camppanel .kv{display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin:3px 0; gap:8px}
  #camppanel .kv b{color:var(--ink); font-weight:600}
  #camphint{position:absolute; right:12px; bottom:12px; width:236px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; font-size:11px; color:var(--dim); line-height:1.6; backdrop-filter:blur(8px); z-index:2}
  #camphint b{color:var(--ink)}
  #campchoice{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); background:var(--panel2);
    border:1px solid var(--line); border-radius:14px; padding:18px 22px; text-align:center; z-index:5;
    box-shadow:0 20px 60px rgba(0,0,0,.5); display:none}
  #campchoice.show{display:block}
  #campchoice h4{margin:0 0 10px; letter-spacing:1px; font-size:15px}
  #campchoice .btn{margin:4px}
</style>

<canvas id="bg"></canvas>
<div id="hud">
  <div class="topbar">
    <div class="brand">NAVAL DOMINANCE<small>PHASE 0 · FOUNDATION</small></div>
    <div class="spacer"></div>
    <button class="btn" id="btnDmg" data-action="dmg" data-tip="Weapon damage (difficulty)">DMG: NORMAL</button>
    <button class="btn on" id="btnAim" data-action="aim" data-tip="Aim assist (auto-lock) vs manual gun elevation">AIM: ASSIST</button>
    <button class="btn on" id="btnMus" data-action="mus" data-tip="Toggle soundtrack (M)">♫ MUSIC</button>
    <button class="btn" id="btnPlaylist" data-action="playlist" data-tip="Edit playlists">≣</button>
  </div>

    <b>DRAG</b> pan · <b>RIGHT-DRAG</b> orbit · <b>WHEEL</b> zoom map↔deck<br>
    <b>CLICK</b> a ship to select · watch the small boat rock harder than the destroyer.

<div id="boot"><div class="b1">NAVAL DOMINANCE</div><div class="b2" id="bootMsg">LOADING ENGINE…</div></div>

<script type="module">
/* =====================================================================
   NAVAL DOMINANCE — single-file 3D engine (Phase 0: Foundation)
   One 3D world; the camera is the UI. Sim state (G) is pure JSON-clean
   data; all Three.js objects live in the parallel RENDER registry so
   campaign saves stay trivial. Engine skeleton (loop, music, tm_* saves,
   G-architecture) is ported from Total Mobilization (title.html).
   ===================================================================== */

/* ---------- how Three.js loads (see FRAMEWORK_PLAN / plan) ------------
   Three.js is ESM-only. DEV imports from a CDN so we don't re-paste
   ~600KB per edit; the SHIP build will inline three.module.min.js as a
   blob (offline-safe). Toggle DEV=false + set THREE_INLINE for release. */
const DEV = true;
// Three.js (ESM) is vendored as a sibling file so the game works offline, on GitHub Pages,
// and with no CDN dependency. Ship-time option: inline it as a blob for a true single file.
const THREE_URL = './three.module.js';
let THREE = null;

/* ============================ §B CORE ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, DEG=Math.PI/180;
const el=id=>document.getElementById(id);
function logErr(e){ if(DEV) console.error(e); }
function toast(m){ const t=el('toast'); if(!t) return; t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
// namespaced localStorage (title.html tm_* convention)
function lsGet(k,def){ try{ const s=localStorage.getItem(k); if(s) return JSON.parse(s); }catch(e){} return def; }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
// difficulty (DESIGN §7): weapon-damage scale + aim-assist(auto-lock) vs manual gun elevation
const DIFF=Object.assign({dmg:1, assist:true}, lsGet('tm_nd_diff',{}));
function saveDiff(){ lsSet('tm_nd_diff',{dmg:DIFF.dmg,assist:DIFF.assist}); }

// event bus — gameplay systems EMIT; juice/hud subscribe. Decoupling seam.
const BUS=(()=>{ const m=new Map();
  return { on(t,fn){ (m.get(t)||m.set(t,[]).get(t)).push(fn); },
    emit(t,p){ const a=m.get(t); if(a) for(const fn of a){ try{ fn(p); }catch(e){ logErr(e); } } } };
})();

/* ============================ §C MUSIC ============================
   Streamed from YouTube (no audio files bundled). Ported verbatim from
   title.html; two phase playlists (prep -> combat) with a software
   crossfade ticked each frame. Editable in-game; persists to tm_nd_pl. */
const YT_DEFAULT={
  prep:[
    {id:'iMPEY9q7iAQ', t:'Third Degree', a:'WARNO OST'},
    {id:'hiqzO9KRBug', t:'Timelessness', a:'Weightlessness'},
    {id:'BL2Q8p2iZo4', t:'Mysteries', a:'Richard Lacy'},
  ],
  combat:[
    {id:'bAFFhW73xRU', t:'Hostile Fleet Detected', a:'Andreas Waldetoft'},
    {id:'4T9rxNNpyIc', t:'Get Together', a:'WARNO OST'},
  ],
};
function loadPlaylists(){ const p=lsGet('tm_nd_pl',null); if(p&&Array.isArray(p.prep)&&Array.isArray(p.combat)) return p; return JSON.parse(JSON.stringify(YT_DEFAULT)); }
function savePlaylists(){ lsSet('tm_nd_pl',MUSIC); }
function ytId(u){ u=(u||'').trim(); if(!u) return null; const m=u.match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/|music\.youtube\.com\/watch\?v=)([\w-]{11})/); if(m) return m[1]; if(/^[\w-]{11}$/.test(u)) return u; return null; }
let MUSIC=loadPlaylists();
const MUS={on:true,vol:52,phase:null,idx:{prep:0,combat:0},yt:null,ready:false,started:false,curVol:0,fade:null,pending:false,track:null,apiAsked:false,warned:false,fails:0};
function loadYTApi(){ if(MUS.apiAsked) return; MUS.apiAsked=true;
  const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>{ if(!MUS.warned){ MUS.warned=true; toast('♫ could not reach YouTube'); } };
  document.head.appendChild(s); }
window.onYouTubeIframeAPIReady=function(){
  try{
    MUS.yt=new YT.Player('ytplayer',{ height:'1',width:'1',
      playerVars:Object.assign({autoplay:0,controls:0,disablekb:1,playsinline:1,fs:0},/^https?:/.test(location.origin||'')?{origin:location.origin}:{}),
      events:{
        onReady:()=>{ MUS.ready=true; try{ MUS.yt.setVolume(0); }catch(e){} if(MUS.pending){ MUS.pending=false; musPlay(MUS.phase||'prep',2.5); } },
        onStateChange:(e)=>{ if(e.data===YT.PlayerState.ENDED) musNext(); else if(e.data===YT.PlayerState.PLAYING){ MUS.fails=0; let title=null; try{ const vd=MUS.yt.getVideoData(); title=vd&&vd.title; }catch(x){} musBanner(MUS.track,title); } },
        onError:()=>musSkip(),
      } });
  }catch(e){ logErr(e); }
};
function musBanner(track,realTitle){ const b=el('nowPlaying'); if(!b) return;
  const t=(realTitle&&realTitle.trim())||(track&&track.t)||'Unknown', a=(track&&track.a)||'YouTube';
  b.innerHTML=`<span class="npq">♫ NOW PLAYING</span><span class="npt">${t}</span><span class="npa">${a}</span>`;
  b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('show'),5200); }
function musPlay(phase,fadeDur){ if(!MUS.on) return; MUS.phase=phase;
  const list=MUSIC[phase]; if(!list||!list.length) return;
  const track=list[MUS.idx[phase]%list.length]; MUS.track=track;
  if(!MUS.ready||!MUS.yt){ MUS.pending=true; loadYTApi(); return; }
  try{ MUS.yt.loadVideoById(track.id); MUS.yt.setVolume(0); MUS.curVol=0; MUS.yt.playVideo(); }catch(e){}
  MUS.started=true; MUS.fade={to:MUS.vol,dur:fadeDur||2.5}; }
function musNext(){ const ph=MUS.phase; if(!ph||!MUSIC[ph]||!MUSIC[ph].length) return; MUS.idx[ph]=(MUS.idx[ph]+1)%MUSIC[ph].length; musPlay(ph,1.2); }
function musSkip(){ MUS.fails++; if(MUS.fails>((MUSIC[MUS.phase]||[]).length+1)){ if(!MUS.warned){ MUS.warned=true; toast('♫ playlist empty/unplayable — add links via ≣'); } return; } musNext(); }
function musDuck(){ if(MUS.started) MUS.fade={to:MUS.vol*.28,dur:9}; }
function musStop(){ MUS.fade=null; MUS.curVol=0; MUS.started=false; MUS.phase=null; if(MUS.yt) try{ MUS.yt.pauseVideo(); MUS.yt.setVolume(0); }catch(e){} }
function musToggle(){ MUS.on=!MUS.on; const mb=el('btnMus'); if(mb) mb.classList.toggle('on',MUS.on);
  if(!MUS.on) musStop(); else { MUS.fails=0; musPlay('prep',1.5); } toast(MUS.on?'♫ SOUNDTRACK ON':'♫ SOUNDTRACK OFF'); }
function musKick(){ if(MUS.on&&MUS.started&&MUS.yt&&MUS.ready){ try{ const st=MUS.yt.getPlayerState(); if(st!==1&&st!==3) MUS.yt.playVideo(); }catch(e){} } }
function musTick(dt){ if(!MUS.yt||!MUS.fade) return;
  const f=MUS.fade, diff=f.to-MUS.curVol, mv=(100/Math.max(.2,f.dur))*dt;
  if(Math.abs(diff)<=mv){ MUS.curVol=f.to; MUS.fade=null; if(f.to===0){ try{ MUS.yt.pauseVideo(); }catch(e){} } }
  else MUS.curVol+=Math.sign(diff)*mv;
  try{ MUS.yt.setVolume(Math.max(0,Math.min(100,MUS.curVol))); }catch(e){} }

/* ============================ §D SOUND ============================
   Policy (OPERATION §1): layered CC0 SAMPLES, never synthesized. Real
   gunfire = transient crack + sub-bass body + tail, decoded once. Drop a
   pack into SND.buf via SND.load(name,url). Until a pack is wired we keep a
   clearly-marked WebAudio PLACEHOLDER so the feel loop is audible — the user
   prefers real samples, so this is scaffolding to be swapped, not the goal. */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const SND={ ctx:null, buf:{}, master:null, ready:false, placeholder:true,
  init(){ if(this.ctx||!AudioCtx) return; this.ctx=new AudioCtx(); this.master=this.ctx.createGain(); this.master.gain.value=.75; this.master.connect(this.ctx.destination); this.ready=true; },
  unlock(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  async load(name,url){ this.init(); try{ const r=await fetch(url); const a=await r.arrayBuffer(); this.buf[name]=await this.ctx.decodeAudioData(a); }catch(e){ logErr(e); } },
  play(name,{gain=1,rate=1,delay=0}={}){ if(!this.ready) return; const b=this.buf[name]; if(!b) return;
    const s=this.ctx.createBufferSource(); s.buffer=b; s.playbackRate.value=rate; const g=this.ctx.createGain(); g.gain.value=gain; s.connect(g).connect(this.master); s.start(this.ctx.currentTime+delay); },
  gunshot(cal){ this.init(); if(!this.ready) return;
    if(this.buf.gun){ const r=cal==='small'?1.5:cal==='medium'?1:.82; this.play('gun',{rate:r}); if(this.buf.gunBody) this.play('gunBody',{rate:r*.9,gain:.9}); return; }
    if(this.placeholder) this._ph(cal); },
  impact(){ this.init(); if(!this.ready) return; if(this.buf.impact){ this.play('impact'); return; } if(this.placeholder) this._ph('hit'); },
  // ---- PLACEHOLDER ONLY — replace with a CC0 sample pack ----
  _ph(kind){ const c=this.ctx,t=c.currentTime, big=kind!=='small'&&kind!=='hit';
    const len=Math.floor(c.sampleRate*(big?.34:.13)); const ab=c.createBuffer(1,len,c.sampleRate); const d=ab.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,big?2.2:3.4);
    const n=c.createBufferSource(); n.buffer=ab; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=kind==='hit'?2800:big?900:2000;
    const g=c.createGain(); g.gain.value=big?.85:.5; n.connect(lp).connect(g).connect(this.master); n.start(t);
    if(big){ const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+.26);
      const og=c.createGain(); og.gain.setValueAtTime(.9,t); og.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(og).connect(this.master); o.start(t); o.stop(t+.32); } },
};

/* ============================ §E DATA ============================
   Content = data. A unit is a bag of attributes (DESIGN §11). Numbers
   are placeholder-for-tuning. Models are procedural (MODELS[def.model]). */
const WEAPON_DEFS={
  mainGun:{ name:'127mm Main Gun', kind:'gun', reload:2.4, muzzle:520, dmg:26, spread:.010, caliber:'medium', rangeMax:1600 },
  aaGun:{ name:'40mm AA', kind:'aa', reload:.12, muzzle:900, dmg:5, spread:.028, caliber:'small', rangeMax:820 },
  lightMG:{ name:'Light MG', kind:'mg', reload:.10, muzzle:700, dmg:3.2, spread:.045, caliber:'small', rangeMax:560 },
  rocket:{ name:'Rocket Pod', kind:'rocket', reload:1.6, muzzle:340, dmg:14, spread:.02, caliber:'medium', rangeMax:900 },
  autocannon:{ name:'Autocannon', kind:'autocannon', reload:.22, muzzle:820, dmg:7, spread:.03, caliber:'small', rangeMax:700 },
};
const UNIT_DEFS={
  // Light craft first (per design). Turret pos = local [x(side), y(up from deck~0), z(fore+)].
  patrolboat:{ name:'PT-9 Patrol Boat', cls:'PATROL BOAT', model:'patrol', domain:'sea',
    len:22, beam:5, mass:70, hp:80,
    turrets:[ {w:'lightMG', pos:[0,0.6,5], barrel:1.8}, {w:'lightMG', pos:[0,0.6,-6], barrel:1.8, scale:0.9} ] },
  corvette:{ name:'K-14 Corvette', cls:'CORVETTE', model:'corvette', domain:'sea',
    len:34, beam:6, mass:900, hp:150,
    turrets:[
      {w:'mainGun', pos:[0,0.7,11], barrel:4.4},
      {w:'aaGun',   pos:[0,2.7,-2], barrel:2.4, scale:0.9, twin:true},
      {w:'lightMG', pos:[0,0.7,-12], barrel:1.8, scale:0.8} ] },

/* ---------- RENDER registry: all THREE objects, keyed by id, NEVER in G ---------- */
const RENDER=new Map();   // id -> {group, turrets:[{pivot,barrel,muzzle}], pick}
const PICKABLE=[];        // invisible colliders for raycast selection
function buildRenderRec(e){
  const d=UNIT_DEFS[e.def];
  const rec=MODELS[d.model](d);      // {group, turrets, pick}
  rec.group.userData.entId=e.id;
  if(rec.pick){ rec.pick.userData={entId:e.id, weaponIdx:null}; PICKABLE.push(rec.pick); }
  // per-turret pick spheres (child of pivot) so turrets are individually take-overable
  rec.turrets.forEach((tg,i)=>{ if(!e.weapons[i]||!e.weapons[i].takeoverable) return;
    const s=new THREE.Mesh(new THREE.SphereGeometry(2.2,8,8), new THREE.MeshBasicMaterial({visible:false}));
    s.position.y=1.0; s.userData={entId:e.id, weaponIdx:i}; tg.pivot.add(s); PICKABLE.push(s); });
  scene.add(rec.group);
  RENDER.set(e.id, rec);
}

function hullShape(L,B){ const s=new THREE.Shape(), hb=B/2;   // sleeker: fine bow, tapered transom
  s.moveTo(-hb*0.5,-L*0.5); s.lineTo(-hb*0.98,-L*0.36); s.lineTo(-hb,L*0.05);
  s.quadraticCurveTo(-hb*0.92,L*0.36, -hb*0.32,L*0.48);
  s.quadraticCurveTo(0,L*0.54, 0,L*0.54);
  s.quadraticCurveTo(hb*0.32,L*0.48, hb*0.92,L*0.36);
  s.lineTo(hb,L*0.05); s.lineTo(hb*0.98,-L*0.36); s.lineTo(hb*0.5,-L*0.5); s.closePath(); return s; }
function hullMesh(L,B,H,mat){ const g=new THREE.ExtrudeGeometry(hullShape(L,B),{depth:H,bevelEnabled:true,bevelThickness:H*0.35,bevelSize:B*0.16,bevelSegments:2,steps:1}); g.rotateX(Math.PI/2); return new THREE.Mesh(g,mat); }
function deckMesh(L,B){ const g=new THREE.ExtrudeGeometry(hullShape(L*0.97,B*0.9),{depth:0.35,bevelEnabled:false}); g.rotateX(Math.PI/2); const m=new THREE.Mesh(g,MAT.deck); m.position.y=0.12; return m; }
function rails(L,B){ const g=new THREE.Group(), h=0.5; [-1,1].forEach(s=>g.add(box(0.07,h,L*0.72,MAT.rail, s*B*0.42, 0.12+h/2, 0))); return g; }
function buildHull(d){ const g=new THREE.Group(), L=d.len, B=d.beam;
  const low=hullMesh(L*0.99,B*0.99,B*0.42,MAT.hullLo); low.position.y=-B*0.18; g.add(low);
  g.add(hullMesh(L,B,B*0.34,MAT.hull)); g.add(deckMesh(L,B));
  // dark sheer strake along the hull sides + raised forecastle deck forward (two-level look)
  [-1,1].forEach(s=> g.add(box(0.1,0.3,L*0.72, MAT.dark, s*B*0.49, 0.06, 0)));
  g.add(box(B*0.7,0.45,L*0.3, MAT.deck, 0, 0.34, L*0.26));
  g.add(rails(L,B)); return g; }
function finishShip(g,d){ const turrets=d.turrets.map(t=>{ const tg=turretGroup(t); g.add(tg.pivot); return tg; });
  const pick=new THREE.Mesh(new THREE.BoxGeometry(d.beam*1.5, Math.max(4,d.beam*1.2), d.len*1.02), new THREE.MeshBasicMaterial({visible:false})); pick.position.y=1.0; g.add(pick);
  return {group:g,turrets,pick}; }
function turretGroup(t){
  const pivot=new THREE.Group(); pivot.position.set(t.pos[0],t.pos[1],t.pos[2]); pivot.scale.setScalar(t.scale||1);
  const base=cyl(0.9,1.15,0.5,MAT.steel,16); base.position.y=-0.1; pivot.add(base);
  const house=box(1.9,1.0,2.1,MAT.supHi,0,0.5,0); pivot.add(house);
  const slope=box(1.9,1.0,0.7,MAT.supHi,0,0.5,1.25); slope.rotation.x=-0.32; pivot.add(slope);
  const barrel=new THREE.Group(); barrel.position.set(0,0.7,0.9); pivot.add(barrel);
  const bl=t.barrel||4; const mk=x=>{ const tb=cyl(0.13,0.17,bl,MAT.dark,10); tb.rotation.x=Math.PI/2; tb.position.set(x,0,bl/2); barrel.add(tb); };
  if(t.twin){ mk(-0.22); mk(0.22); } else mk(0);
  const muzzle=new THREE.Object3D(); muzzle.position.set(0,0,bl); barrel.add(muzzle);
  return {pivot,barrel,muzzle};
}

/* ============================ §H OCEAN ============================
   Sum-of-sines wave field. The SAME 3 waves live in the shader (visual)
   and in oceanSample() (physics: ships rock from the local slope). */
const WAVES=[  // dir normalized, amp, len, spd
  {dx:0.95,dz:0.31,amp:0.75,len:55,spd:0.8},
  {dx:-0.51,dz:0.86,amp:0.5,len:34,spd:1.15},
  {dx:0.2,dz:-0.98,amp:0.32,len:20,spd:1.7},
];
function oceanSample(x,z,t){ // returns {h, sx, sz} height + slope
  let h=0,sx=0,sz=0;
  for(const w of WAVES){ const k=TAU/w.len; const ph=(w.dx*x+w.dz*z)*k + t*w.spd; const s=Math.sin(ph), c=Math.cos(ph);
    h+=w.amp*s; sx+=w.amp*k*w.dx*c; sz+=w.amp*k*w.dz*c; }
  return {h,sx,sz};
}
let ocean=null;
function buildOcean(){
  const geo=new THREE.PlaneGeometry(2400,2400,300,300); geo.rotateX(-Math.PI/2);
  // unroll each wave into plain GLSL (GLSL ES 1.00 safe — no array constructors)
  const waveGLSL=WAVES.map(w=>{ const k=(TAU/w.len);
    return `{ float ph=(${w.dx.toFixed(4)}*wx+${w.dz.toFixed(4)}*wz)*${k.toFixed(5)}+uTime*${w.spd.toFixed(3)};
      h+=${w.amp.toFixed(3)}*sin(ph); float c=cos(ph);
      sx+=${w.amp.toFixed(3)}*${k.toFixed(5)}*${w.dx.toFixed(4)}*c; sz+=${w.amp.toFixed(3)}*${k.toFixed(5)}*${w.dz.toFixed(4)}*c; }`;
  }).join('\n');
  const mat=new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0} },
    vertexShader:`
      uniform float uTime; varying vec3 vN; varying vec3 vW; varying float vFog;
      void main(){
        vec3 p=position; float wx=p.x, wz=p.z; float h=0.0,sx=0.0,sz=0.0;
        ${waveGLSL}
        p.y+=h; vN=normalize(vec3(-sx,1.0,-sz));
        vec4 world=modelMatrix*vec4(p,1.0); vW=world.xyz;
        vFog=clamp(length(world.xyz-cameraPosition)/1600.0,0.0,1.0);
        gl_Position=projectionMatrix*viewMatrix*world;
      }`,
    fragmentShader:`
      varying vec3 vN; varying vec3 vW; varying float vFog;
      void main(){
        vec3 sun=normalize(vec3(0.55,0.8,0.28));
        vec3 V=normalize(cameraPosition-vW);
        float diff=max(dot(vN,sun),0.0);
        float fres=pow(1.0-max(dot(vN,V),0.0),3.0);
        vec3 R=reflect(-sun,vN); float spec=pow(max(dot(R,V),0.0),80.0);
        vec3 deep=vec3(0.015,0.07,0.13), shallow=vec3(0.05,0.20,0.30), sky=vec3(0.55,0.68,0.82);
        vec3 col=mix(deep,shallow,diff)+fres*sky*0.7+spec*vec3(1.0,0.96,0.85)*0.9;
        col=mix(col,sky,vFog);
        gl_FragColor=vec4(col,1.0);
      }`,
  });
  ocean=new THREE.Mesh(geo,mat); scene.add(ocean);
}

const SYSTEMS=[];

// ---- camera rig: reads G.cam ; zoom 1 = strategic top-down, 0 = deck ----
const SYS_camera={ update(){}, render(){
  const c=G.cam;
  // possession gun-cam: over-the-barrel view (Gunnery asks Camera; Camera owns the move)
  if(G.possess){ const e=G.ents.find(x=>x.id===G.possess.entId);
    if(e&&e.alive){ const tg=RENDER.get(e.id).turrets[G.possess.weaponIdx];
      const mp=new THREE.Vector3(); tg.muzzle.getWorldPosition(mp);
      const q=tg.barrel.getWorldQuaternion(new THREE.Quaternion()); const fwd=new THREE.Vector3(0,0,1).applyQuaternion(q);
      const camPos=mp.clone().addScaledVector(fwd,-7); camPos.y+=4.2;
      camera.position.set(camPos.x+c.kick[0], camPos.y, camPos.z+c.kick[1]);
      camera.lookAt(mp.clone().addScaledVector(fwd,140).setY(mp.y+fwd.y*140-1.5));
      c.kick[0]*=0.8; c.kick[1]*=0.8; return;
    } else { exitPossess(); }
  }
  const tgt=c.target;
  const elev=lerp(0.18,1.28,c.zoom);           // radians above horizon
  const dist=lerp(24,760,Math.pow(c.zoom,1.45));
  const ch=Math.cos(elev)*dist, cy=Math.sin(elev)*dist;
  const px=tgt[0]+Math.sin(c.yaw)*ch, pz=tgt[2]+Math.cos(c.yaw)*ch, py=tgt[1]+cy;
  camera.position.set(px+c.kick[0], py, pz+c.kick[1]);
  camera.lookAt(tgt[0],tgt[1]+lerp(1.5,0,c.zoom),tgt[2]);
  c.kick[0]*=0.86; c.kick[1]*=0.86;
}};

// ---- movement: domain dispatch; ships get wave-rock scaled by 1/mass ----
const ROLL_K=1400, PITCH_K=900;
const SYS_movement={ update(dt){
  for(const e of G.ents){ if(!e.alive) continue;
    if(e.domain==='sea'){
      const s=oceanSample(e.pos[0],e.pos[2],G.ocean.t);
      e.pos[1]=lerp(e.pos[1], s.h*0.6, 0.15);                 // ride the surface
      const tr=clamp(-s.sx*ROLL_K/e.mass,-.5,.5);             // bigger mass => less roll (locked req)
      const tp=clamp( s.sz*PITCH_K/e.mass,-.4,.4);
      e.roll=lerp(e.roll,tr,0.08); e.pitchAng=lerp(e.pitchAng,tp,0.08);
    } else if(e.domain==='air'){
      e.pos[1]=lerp(e.pos[1], 34+Math.sin(G.ocean.t*1.3+e.id)*1.2, 0.05);  // hover bob
      e.roll=lerp(e.roll,Math.sin(G.ocean.t*0.7+e.id)*0.08,0.05);
    }
  }
}, render(){} };

// ---- render sync: G (data) -> THREE meshes ----
function syncRender(){
  for(const e of G.ents){ const rec=RENDER.get(e.id); if(!rec) continue;
    rec.group.position.set(e.pos[0],e.pos[1],e.pos[2]);
    rec.group.rotation.set(e.pitchAng, e.heading, e.roll);
    if(rec.group.userData.rotor) rec.group.userData.rotor.rotation.y+=0.6;
    for(let i=0;i<rec.turrets.length;i++){ const w=e.weapons[i], tg=rec.turrets[i]; if(!w||!tg) continue;
      tg.pivot.rotation.y=w.yaw; tg.barrel.rotation.x=-w.pitch; tg.barrel.position.z=1.0 - (w.recoil||0); }
  }
}

    } else { info.classList.remove('show'); G.selected=[]; }
  } else info.classList.remove('show');
  // possession reticle + banner (red -> green when a valid enemy is under the crosshair)
  const ret=el('reticle'), pb=el('possBar');

  } else { ret.classList.remove('show'); pb.classList.remove('show'); }
  const pr=el('prompt');

}};

/* ---- FX assets (built after THREE loads) ---- */
let FX=null, TEX_GLOW=null, TEX_STREAK=null, TRACER_GEO=null, TRACER_MAT=null, FLASH_MAT=null, UP=null;
const PROJVIS=new Map(); const FXLIST=[];
function canvasTex(w,h,paint){ const c=document.createElement('canvas'); c.width=w; c.height=h; paint(c.getContext('2d')); return new THREE.CanvasTexture(c); }
function initFX(){
  UP=new THREE.Vector3(0,1,0); FX=new THREE.Group(); scene.add(FX);
  TEX_GLOW=canvasTex(64,64,x=>{ const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,228,168,.85)'); g.addColorStop(1,'rgba(255,170,70,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); });
  TEX_STREAK=canvasTex(16,64,x=>{ const g=x.createLinearGradient(0,0,0,64); g.addColorStop(0,'rgba(255,240,205,0)'); g.addColorStop(.5,'rgba(255,244,210,1)'); g.addColorStop(1,'rgba(255,176,90,0)'); x.fillStyle=g; x.fillRect(0,0,16,64); });
  TRACER_GEO=new THREE.PlaneGeometry(1,1);
  TRACER_MAT=new THREE.MeshBasicMaterial({map:TEX_STREAK,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  FLASH_MAT=new THREE.SpriteMaterial({map:TEX_GLOW,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,color:0xffd9a0});
  // gameplay systems EMIT; juice OWNS all fx + sound (decoupling seam)
  BUS.on('fire',e=>{ SND.gunshot(e.caliber); addFlash(e.pos, e.caliber==='medium'?4.2:2.4, 0xffe0a0);
    if(G.possess){ G.cam.kick[0]+=(Math.random()-.5)*1.4; G.cam.kick[1]+=(Math.random()-.5)*1.4; } });
  BUS.on('hit',e=>{ SND.impact(); addSpark(e.pos); G.hitStop=Math.max(G.hitStop,0.065); });
  BUS.on('kill',e=>{ const ent=G.ents.find(x=>x.id===e.entId); if(ent) addFlash(ent.pos,8,0xff8a3a); });
  BUS.on('splash',e=>{ addFlash([e.pos[0],0.2,e.pos[2]],3,0x9fc2d6); });
}
function addFlash(pos,scale,color){ if(!FX) return; const m=new THREE.Sprite(FLASH_MAT.clone()); if(color) m.material.color.setHex(color);
  m.position.set(pos[0],pos[1],pos[2]); m.scale.setScalar(scale); FX.add(m); FXLIST.push({mesh:m,life:.10,max:.10,kind:'flash'}); }
function addSpark(pos){ addFlash(pos,3.2,0xfff2c0); for(let i=0;i<7;i++){ const m=new THREE.Sprite(FLASH_MAT.clone()); m.position.set(pos[0],pos[1],pos[2]); m.scale.setScalar(1.1); FX.add(m);
  FXLIST.push({mesh:m,life:.34,max:.34,kind:'spark',vel:[(Math.random()-.5)*26,Math.random()*20,(Math.random()-.5)*26]}); } }

/* ---- Combat Math (shared): one applyDamage; two hit modes (ballistic live, statistical stub) ---- */
const CMBT={
  modifiers(shooterId,target,weapon,cond){ return 1; },        // armor/vuln/fort/terrain/supply (Phase 2)
  applyDamage(target,amount,hitPos){ if(!target||!target.alive) return; target.hp-=amount;
    BUS.emit('hit',{pos:hitPos,targetId:target.id,dmg:amount});
    if(target.hp<=0){ target.alive=false; BUS.emit('kill',{entId:target.id}); } },
  resolveBallisticHit(p,target){ this.applyDamage(target, p.dmg*this.modifiers(p.srcId,target,p.w)*DIFF.dmg, p.pos.slice()); },
  hitChance(shooter,target,weapon,cond){ return 0; },          // Phase 2
  resolveStatistical(shooterId,targetId,weaponId,cond){ return null; }, // Phase 2
};

/* ---- vector/angle helpers + targeting + enemy AI ---- */
function dist(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]); }
function angDiff(a,b){ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function angLerp(a,b,t){ return a+angDiff(a,b)*t; }
function nearestFoe(e){ let best=null,bd=1e9; for(const t of G.ents){ if(!t.alive||t.side===e.side) continue; const d=dist(e.pos,t.pos); if(d<bd){bd=d;best=t;} } return best; }
const TGT={ // final signatures; LOS/radar/fog come in Phase 2
  visibleTargets(e){ const out=[]; for(const t of G.ents){ if(!t.alive||t.side===e.side) continue; out.push({t,d:dist(e.pos,t.pos)}); } out.sort((a,b)=>a.d-b.d); return out; },
  canEngage(shooter,weapon,target){ return dist(shooter.pos,target.pos) < (WEAPON_DEFS[weapon.w].rangeMax||1200); },
};
// enemy heli AI: approach -> strafe -> evade, emitting heading+move (Phase 2: damage-reservation/threat-priority)
const SYS_ai={ update(dt){ for(const e of G.ents){ if(!e.alive||e.side!=='enemy'||e.domain!=='air') continue;
    const foe=nearestFoe(e); if(!foe) continue; const d=dist(e.pos,foe.pos);
    if(!e.ai) e.ai={state:'approach',t:0}; e.ai.t-=dt;
    if(e.ai.state==='approach'&&d<170){ e.ai.state='strafe'; e.ai.t=3.2; }
    else if(e.ai.state==='strafe'&&e.ai.t<=0){ e.ai.state='evade'; e.ai.t=2.4; }
    else if(e.ai.state==='evade'&&e.ai.t<=0){ e.ai.state='approach'; }
    const dx=foe.pos[0]-e.pos[0], dz=foe.pos[2]-e.pos[2]; let want=Math.atan2(dx,dz), spd=24;
    if(e.ai.state==='evade'){ want+=Math.PI*0.72; spd=32; }
    else if(e.ai.state==='strafe'){ want+=Math.PI*0.5*Math.sin(G.t*1.4+e.id); spd=27; }
    e.heading=angLerp(e.heading,want,0.035);
    e.vel[0]=Math.sin(e.heading)*spd; e.vel[2]=Math.cos(e.heading)*spd;
    e.pos[0]+=e.vel[0]*dt; e.pos[2]+=e.vel[2]*dt;
  } }, render(){} };

/* ---- gunnery / projectiles ---- */
function segSphere(a,b,c,r){ const bx=b[0]-a[0],by=b[1]-a[1],bz=b[2]-a[2]; const cx=c[0]-a[0],cy=c[1]-a[1],cz=c[2]-a[2];
  const L2=bx*bx+by*by+bz*bz||1e-6; let t=clamp((cx*bx+cy*by+cz*bz)/L2,0,1);
  const dx=cx-bx*t,dy=cy-by*t,dz=cz-bz*t; return dx*dx+dy*dy+dz*dz<=r*r; }
function tryFire(e,wi){ const w=e.weapons[wi]; if(!w||w.cooldown>0||!e.alive) return; const wd=WEAPON_DEFS[w.w];
  const tg=RENDER.get(e.id).turrets[wi]; const mp=new THREE.Vector3(); tg.muzzle.getWorldPosition(mp);
  const q=tg.barrel.getWorldQuaternion(new THREE.Quaternion()); const dir=new THREE.Vector3(0,0,1).applyQuaternion(q).normalize();
  dir.x+=(Math.random()-.5)*wd.spread; dir.y+=(Math.random()-.5)*wd.spread; dir.z+=(Math.random()-.5)*wd.spread; dir.normalize();
  const id='p'+(G.nextId++);
  G.projectiles.push({ id, w:w.w, srcId:e.id, side:e.side, pos:[mp.x,mp.y,mp.z], prev:[mp.x,mp.y,mp.z],
    vel:[dir.x*wd.muzzle,dir.y*wd.muzzle,dir.z*wd.muzzle], life:3.2, dmg:wd.dmg, caliber:wd.caliber, grav:9.8 });
  w.cooldown=wd.reload; w.recoil=wd.caliber==='medium'?0.85:0.35;
  BUS.emit('fire',{pos:[mp.x,mp.y,mp.z],caliber:wd.caliber});
}
// gunnery: AI turrets auto-aim+fire; a possessed turret is driven by the player (same fire path)
const SYS_gunnery={ update(dt){ for(const e of G.ents){ if(!e.alive) continue;
  const targets=TGT.visibleTargets(e);
  for(let wi=0; wi<e.weapons.length; wi++){ const w=e.weapons[wi];
    if(w.cooldown>0) w.cooldown-=dt; w.recoil=lerp(w.recoil,0,0.16);
    const possessedHere = G.possess && G.possess.entId===e.id && G.possess.weaponIdx===wi;
    if(possessedHere && !DIFF.assist) continue;                    // full-manual: player aims + fires
    const wd=WEAPON_DEFS[w.w]; let tgt=null;
    for(const o of targets){ if(o.d<wd.rangeMax){ tgt=o.t; break; } }
    if(!tgt){ w.targetId=null; continue; } w.targetId=tgt.id;
    const tof=dist(e.pos,tgt.pos)/wd.muzzle;                       // lead the target
    const px=tgt.pos[0]+tgt.vel[0]*tof, py=tgt.pos[1]+tgt.vel[1]*tof, pz=tgt.pos[2]+tgt.vel[2]*tof;
    const tg=RENDER.get(e.id).turrets[wi]; const mp=new THREE.Vector3(); tg.muzzle.getWorldPosition(mp);
    const dx=px-mp.x, dy=py-mp.y, dz=pz-mp.z; const horiz=Math.hypot(dx,dz);
    const wantYaw=Math.atan2(dx,dz)-e.heading, wantPitch=clamp(Math.atan2(dy,horiz),-0.15,1.0);
    w.yaw=angLerp(w.yaw,wantYaw,0.14); w.pitch=lerp(w.pitch,wantPitch,0.14);   // assist auto-aims; player still fires
    if(!possessedHere && w.cooldown<=0 && Math.abs(angDiff(w.yaw,wantYaw))<0.07 && Math.abs(w.pitch-wantPitch)<0.07) tryFire(e,wi);
  } } }, render(){} };
const SYS_projectiles={ update(dt){ const arr=G.projectiles;
  for(let i=arr.length-1;i>=0;i--){ const p=arr[i]; p.prev=[p.pos[0],p.pos[1],p.pos[2]];
    p.vel[1]-=p.grav*dt; p.pos[0]+=p.vel[0]*dt; p.pos[1]+=p.vel[1]*dt; p.pos[2]+=p.vel[2]*dt; p.life-=dt;
    let hit=null; for(const e of G.ents){ if(!e.alive||e.side===p.side) continue; if(segSphere(p.prev,p.pos,e.pos,e.hit.r)){ hit=e; break; } }
    if(hit){ CMBT.resolveBallisticHit(p,hit); arr.splice(i,1); continue; }
    if(p.pos[1]<0){ BUS.emit('splash',{pos:[p.pos[0],0,p.pos[2]]}); arr.splice(i,1); continue; }
    if(p.life<=0) arr.splice(i,1); } }, render(){} };

/* ---- dead-entity cleanup (deferred; keeps G tidy) ---- */
const pendingRemove=[];
function removeEnt(id){ const idx=G.ents.findIndex(e=>e.id===id); if(idx<0) return; const rec=RENDER.get(id);
  if(rec){ scene.remove(rec.group); }
  for(let i=PICKABLE.length-1;i>=0;i--){ if(PICKABLE[i].userData&&PICKABLE[i].userData.entId===id) PICKABLE.splice(i,1); }
  RENDER.delete(id); G.ents.splice(idx,1);
  G.selected=G.selected.filter(s=>s!==id); if(G.possess&&G.possess.entId===id) exitPossess(); }
function processRemovals(){ while(pendingRemove.length) removeEnt(pendingRemove.shift()); }
BUS.on('kill',e=>{ if(!pendingRemove.includes(e.entId)) pendingRemove.push(e.entId); });

/* ---- juice render: tracers (stretched trails, never boxes) + transient fx ---- */
const SYS_juice={ update(){}, render(dt){
  for(const p of G.projectiles){ let m=PROJVIS.get(p.id); if(!m){ m=new THREE.Mesh(TRACER_GEO,TRACER_MAT); m.matrixAutoUpdate=false; FX.add(m); PROJVIS.set(p.id,m); }
    const bx=p.pos[0],by=p.pos[1],bz=p.pos[2]; const dx=bx-p.prev[0],dy=by-p.prev[1],dz=bz-p.prev[2]; const seg=Math.hypot(dx,dy,dz)||1;
    const yA=new THREE.Vector3(dx/seg,dy/seg,dz/seg);                                   // long axis = velocity
    const toCam=new THREE.Vector3(camera.position.x-bx,camera.position.y-by,camera.position.z-bz).normalize();
    let xA=new THREE.Vector3().crossVectors(yA,toCam); if(xA.lengthSq()<1e-5) xA.set(1,0,0); xA.normalize();
    const zA=new THREE.Vector3().crossVectors(xA,yA).normalize();                       // face the camera
    const len=Math.max(12,seg*4);
    m.matrix.makeBasis(xA.multiplyScalar(1.15), yA.multiplyScalar(len), zA); m.matrix.setPosition(bx,by,bz); }
  const live=new Set(G.projectiles.map(p=>p.id)); for(const [id,m] of PROJVIS){ if(!live.has(id)){ FX.remove(m); PROJVIS.delete(id); } }
  for(let i=FXLIST.length-1;i>=0;i--){ const f=FXLIST[i]; f.life-=dt;
    if(f.vel){ f.mesh.position.x+=f.vel[0]*dt; f.mesh.position.y+=f.vel[1]*dt; f.mesh.position.z+=f.vel[2]*dt; f.vel[1]-=32*dt; }
    f.mesh.material.opacity=Math.max(0,f.life/f.max); if(f.kind==='flash') f.mesh.scale.multiplyScalar(1+dt*5);
    if(f.life<=0){ FX.remove(f.mesh); FXLIST.splice(i,1); } }
}};

SYSTEMS.push(SYS_ai, SYS_movement, SYS_gunnery, SYS_projectiles, SYS_camera, SYS_juice, SYS_hud);

/* ============================ §H INPUT (arbiter + mode stack) ============================ */
let RAY=null, drag=null, _mx=0, _my=0, boxSel=null;
function screenNDC(px,py){ return {x:(px/innerWidth)*2-1, y:-(py/innerHeight)*2+1}; }
function pickAt(px,py){ if(!RAY) RAY=new THREE.Raycaster(); const n=screenNDC(px,py);
  RAY.setFromCamera(n,camera); const hits=RAY.intersectObjects(PICKABLE,false);
  return hits.length? hits[0].object.userData : null; }   // {entId, weaponIdx} | null
function enterPossess(entId,wi){ G.possess={entId,weaponIdx:wi}; if(G.modeStack[G.modeStack.length-1]!=='possess') G.modeStack.push('possess'); }
function exitPossess(){ G.possess=null; const i=G.modeStack.lastIndexOf('possess'); if(i>0) G.modeStack.splice(i,1); }
function oceanPointAt(px,py){ if(!RAY) RAY=new THREE.Raycaster(); const n=screenNDC(px,py); RAY.setFromCamera(n,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0); const p=new THREE.Vector3();
  return RAY.ray.intersectPlane(plane,p)? p : null; }

function bindInput(){
  const cv=el('bg');
  cv.addEventListener('pointerdown',e=>{ musKick(); SND.init(); SND.unlock();
    if(!MUS.started&&MUS.on) musPlay('prep',2.0);
    if(G.possess){ if(e.button===2) exitPossess(); else { const pe=G.ents.find(x=>x.id===G.possess.entId); if(pe) tryFire(pe,G.possess.weaponIdx); } return; }
    if(e.button===0 && e.shiftKey){ boxSel={x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY}; return; }   // shift-drag = box-select
    drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,btn:e.button,moved:false}; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',e=>{
    if(boxSel){ boxSel.x1=e.clientX; boxSel.y1=e.clientY; const sb=el('selbox');
      sb.style.display='block'; sb.style.left=Math.min(boxSel.x0,boxSel.x1)+'px'; sb.style.top=Math.min(boxSel.y0,boxSel.y1)+'px';
      sb.style.width=Math.abs(boxSel.x1-boxSel.x0)+'px'; sb.style.height=Math.abs(boxSel.y1-boxSel.y0)+'px'; return; }
    if(G.possess){ const pe=G.ents.find(x=>x.id===G.possess.entId);
      if(pe){ const w=pe.weapons[G.possess.weaponIdx]; const dx=e.clientX-_mx, dy=e.clientY-_my;
        if(!DIFF.assist && Math.abs(dx)<80&&Math.abs(dy)<80){ w.yaw-=dx*0.004; w.pitch=clamp(w.pitch-dy*0.003,-0.15,0.95); } }
      _mx=e.clientX; _my=e.clientY; return; }
    _mx=e.clientX; _my=e.clientY; if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>4) drag.moved=true;
    if(drag.btn===2){ G.cam.yaw+=dx*0.005; }                          // right-drag orbit
    else { const sc=lerp(0.02,0.9,G.cam.zoom); const a=G.cam.yaw;      // left-drag pan (screen-aligned)
      G.cam.target[0]-= (dx*Math.cos(a)+dy*Math.sin(a))*sc;
      G.cam.target[2]-= (-dx*Math.sin(a)+dy*Math.cos(a))*sc; }
  });
  cv.addEventListener('pointerup',e=>{
    if(boxSel){ const x0=Math.min(boxSel.x0,boxSel.x1),x1=Math.max(boxSel.x0,boxSel.x1),y0=Math.min(boxSel.y0,boxSel.y1),y1=Math.max(boxSel.y0,boxSel.y1);
      const sel=[], v=new THREE.Vector3();
      for(const en of G.ents){ if(en.side!=='player'||!en.alive) continue; v.set(en.pos[0],en.pos[1],en.pos[2]).project(camera);
        const sx=(v.x*.5+.5)*innerWidth, sy=(-v.y*.5+.5)*innerHeight;
        if(v.z<1 && sx>=x0&&sx<=x1&&sy>=y0&&sy<=y1) sel.push(en.id); }
      G.selected=sel; el('selbox').style.display='none'; boxSel=null; return; }
    if(drag&&!drag.moved){ const h=pickAt(e.clientX,e.clientY);
      if(h && h.weaponIdx!=null) enterPossess(h.entId,h.weaponIdx);
      else G.selected = h? [h.entId] : []; } drag=null; });
  cv.addEventListener('wheel',e=>{ e.preventDefault();
    const before=oceanPointAt(e.clientX,e.clientY);
    G.cam.zoom=clamp(G.cam.zoom + Math.sign(e.deltaY)*0.06, 0, 1);
    // gentle zoom-toward-cursor
    if(before && e.deltaY<0){ G.cam.target[0]=lerp(G.cam.target[0],before.x,0.18); G.cam.target[2]=lerp(G.cam.target[2],before.z,0.18); }
  },{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
    if(k==='m') musToggle();
    if(k==='escape'){ if(G.possess) exitPossess(); else G.selected=[]; }
    if(k===' '){ e.preventDefault(); if(G.possess){ const pe=G.ents.find(x=>x.id===G.possess.entId); if(pe) tryFire(pe,G.possess.weaponIdx); } else G.paused=!G.paused; }
  });
  // simple touch: one-finger pan, pinch zoom
  let tch=null;
  cv.addEventListener('touchstart',e=>{ musKick(); if(!MUS.started&&MUS.on) musPlay('prep',2.0);
    if(e.touches.length===1){ tch={x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false,x0:e.touches[0].clientX,y0:e.touches[0].clientY}; }
    else if(e.touches.length===2){ tch={pinch:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}; }
  },{passive:false});
  cv.addEventListener('touchmove',e=>{ e.preventDefault(); if(!tch) return;
    if(e.touches.length===1&&tch.x!=null){ const dx=e.touches[0].clientX-tch.x, dy=e.touches[0].clientY-tch.y; tch.x=e.touches[0].clientX; tch.y=e.touches[0].clientY;
      if(Math.abs(e.touches[0].clientX-tch.x0)+Math.abs(e.touches[0].clientY-tch.y0)>6) tch.moved=true;
      const sc=lerp(0.02,0.9,G.cam.zoom); const a=G.cam.yaw;
      G.cam.target[0]-=(dx*Math.cos(a)+dy*Math.sin(a))*sc; G.cam.target[2]-=(-dx*Math.sin(a)+dy*Math.cos(a))*sc; }
    else if(e.touches.length===2&&tch.pinch!=null){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      G.cam.zoom=clamp(G.cam.zoom-(d-tch.pinch)*0.002,0,1); tch.pinch=d; }
  },{passive:false});
  cv.addEventListener('touchend',e=>{ if(tch&&tch.moved===false&&tch.x0!=null){
      if(G.possess){ const pe=G.ents.find(x=>x.id===G.possess.entId); if(pe) tryFire(pe,G.possess.weaponIdx); }
      else { const h=pickAt(tch.x0,tch.y0); if(h&&h.weaponIdx!=null) enterPossess(h.entId,h.weaponIdx); else G.selected=h?[h.entId]:[]; } }
    tch=null; },{passive:false});
}

/* ============================ §I LOOP ============================ */
let last=performance.now(), acc=0, animClock=0; const STEP=1/60;
function endBattle(r){ G.over=r; if(G.possess) exitPossess();
  const b=el('endBanner'); if(b){ b.className='show '+r;
    b.innerHTML = r==='win' ? '<h2>VICTORY</h2><p>Hostile aircraft downed — sector clear.</p>'
                            : '<h2>SHIP LOST</h2><p>The destroyer went down.</p>';
    // campaign-launched battles get a return-to-map button (capture-on-win applied there)
    if(CAMP && CAMP.launched){ b.innerHTML += '<div style="margin-top:14px"><button class="btn" data-action="camp-return">◂ RETURN TO MAP</button></div>'; }
  }
  try{ musDuck(); }catch(e){} }
function stepSim(dt){ G.t+=dt; G.ocean.t+=dt;
  for(const s of SYSTEMS) if(s.update) s.update(dt);
  processRemovals();
  if(!G.over){ const en=G.ents.some(e=>e.side==='enemy'&&e.alive), pl=G.ents.some(e=>e.side==='player'&&e.domain==='sea'&&e.alive);
    if(!pl){ endBattle('lose'); }
    else if(en){ G.waveTimer=2.5; }                                   // foes remain — hold the countdown
    else if(G.wave < ENEMY_WAVES.length){ G.waveTimer-=dt; if(G.waveTimer<=0) spawnWave(G.wave++); }  // sector clear — next wave after a short pause
    else { endBattle('win'); }                                        // all waves cleared
  }
}
function frame(now){
  let dt=Math.min(.05,(now-last)/1000); last=now;
  try{
    if(!(G && G.paused) && SCREEN==='battle'){   // campaign screen freezes the sim (3D idles underneath)
      animClock+=dt*1000;
      if(G.hitStop>0){ G.hitStop=Math.max(0,G.hitStop-dt); }
      else { acc+=dt*G.speed; let guard=0; while(acc>=STEP && guard++<6){ stepSim(STEP); acc-=STEP; } }
    }
    if(ocean) ocean.material.uniforms.uTime.value=G.ocean.t;
    for(const s of SYSTEMS) if(s.render) s.render(dt);
    syncRender();
    renderer.render(scene,camera);
    musTick(dt);
  }catch(e){ logErr(e); }
  finally{ requestAnimationFrame(frame); }
}

/* ============================ §J HUD wiring (data-action, no inline onclick) ============================ */
function initHUD(){
  document.querySelectorAll('[data-action]').forEach(n=>{
    n.addEventListener('click',()=>{ const a=n.dataset.action;
      if(a==='mus') musToggle();
      if(a==='playlist') toast('playlist editor lands with the campaign build');
      if(a==='dmg'){ DIFF.dmg = DIFF.dmg<0.8?1.0 : (DIFF.dmg<1.3?1.6:0.6); n.textContent='DMG: '+(DIFF.dmg<0.8?'LOW':DIFF.dmg<1.3?'NORMAL':'HIGH'); saveDiff(); }
      if(a==='aim'){ DIFF.assist=!DIFF.assist; n.classList.toggle('on',DIFF.assist); n.textContent='AIM: '+(DIFF.assist?'ASSIST':'MANUAL'); if(!DIFF.assist) toast('MANUAL AIM — you control gun elevation'); saveDiff(); }
    });
  });
  // reflect saved difficulty on the buttons
  const bd=el('btnDmg'); if(bd) bd.textContent='DMG: '+(DIFF.dmg<0.8?'LOW':DIFF.dmg<1.3?'NORMAL':'HIGH');
  const ba=el('btnAim'); if(ba){ ba.classList.toggle('on',DIFF.assist); ba.textContent='AIM: '+(DIFF.assist?'ASSIST':'MANUAL'); }
  // data-tip tooltips (delegated)
  const tip=el('tip');
  addEventListener('mousemove',e=>{ const t=e.target.closest&&e.target.closest('[data-tip]');
    if(!t){ tip.classList.remove('show'); return; }
    tip.textContent=t.dataset.tip; tip.classList.add('show');
    let x=e.clientX+14,y=e.clientY+14; if(x+tip.offsetWidth>innerWidth-8) x=e.clientX-tip.offsetWidth-14;
    tip.style.left=x+'px'; tip.style.top=y+'px'; });
}

/* ============================ §CAMP CAMPAIGN (additive strategic layer) ============================
   A turn-based map over the existing battle. State (CAMP) is pure data — zones, owners, garrison
   strength, IC economy — with NO Three.js in it. The map is an HTML/SVG overlay rebuilt on every
   state change (renderCampaign). Battles launch from here and return via endBattle's hook. */

// screen switch: show/hide the campaign overlay; the 3D canvas stays under it.
function setScreen(s){ SCREEN=s; const c=el('campaign'); if(c) c.classList.toggle('show', s==='campaign'); }

// re-usable battle setup (mirrors boot's original spawns) so campaign can (re)launch fights.
function setupBattleScene(){
  if(G && G.ents){ for(const e of G.ents.slice()) removeEnt(e.id); }   // clear prior battle meshes on relaunch
  newBattle();
  addEnt('corvette','player',[0,0,0],0.15);
  addEnt('patrolboat','player',[20,0,-6],-0.2);
  spawnWave(0); G.wave=1;                 // first wave in; the wave system drives the rest
  G.cam.target=[4,1,10]; G.selected=[1];
}

// ~11 zones with %-layout + an adjacency graph. Player owns 2 (bottom), enemy owns 2 (top).
function genZones(){
  const defs=[   // name, x%, y%, owner
    ['Ironmouth',   25,12,'enemy'],  ['Blackreef',   70,14,'enemy'],
    ['Cold Harbor', 48,25,'neutral'],['Gale Point',  17,36,'neutral'],
    ['Kraken Deep', 82,37,'neutral'],['Siren Bay',   50,49,'neutral'],
    ['Storm Isle',  29,60,'neutral'],['Mist Channel',73,61,'neutral'],
    ['Reef Pass',   51,73,'neutral'],['Port Haven',  26,86,'player'],
    ['Fort Tide',   74,87,'player'],
  ];
  const edges=[[0,2],[0,3],[1,2],[1,4],[2,5],[3,5],[3,6],[4,5],[4,7],[5,6],[5,7],[6,8],[6,9],[7,8],[7,10],[8,9],[8,10],[9,10]];
  const zones=defs.map((d,i)=>({ id:i, name:d[0], x:d[1], y:d[2], owner:d[3],
    strength: d[3]==='player'?9 : d[3]==='enemy'?8 : 4+Math.floor(Math.random()*4),
    income:   d[3]==='neutral'?2:3, adj:[] }));
  for(const [a,b] of edges){ zones[a].adj.push(b); zones[b].adj.push(a); }
  return zones;
}

// ---- simple strength combat (parallels the battle's Combat Math, kept purely numeric here) ----
function autoResolve(atk,def){
  const ap=atk.strength*(0.70+Math.random()*0.60), dp=def.strength*(0.70+Math.random()*0.60);
  if(ap>dp){ def.owner='player'; const half=Math.max(1,Math.round(atk.strength/2));
    atk.strength=Math.max(1,atk.strength-half); def.strength=half; toast('AUTO-RESOLVE · CAPTURED '+def.name); }
  else { atk.strength=Math.max(1,Math.round(atk.strength*0.60)); toast('AUTO-RESOLVE · REPELLED at '+def.name); }
}

// launch the 3D battle for a chosen attack; endBattle's hook returns us to the map.
function launchBattle(atk,def){ CAMP.pending={atk:atk.id, def:def.id}; CAMP.launched=true;
  setupBattleScene(); setScreen('battle'); el('endBanner').classList.remove('show'); toast('BATTLE FOR '+def.name); }

// come back from a launched battle; apply capture-on-win to the target zone.
function returnFromBattle(){
  const b=el('endBanner'); if(b){ b.classList.remove('show'); b.className=''; }
  const a=CAMP.pending?CAMP.zones[CAMP.pending.atk]:null, d=CAMP.pending?CAMP.zones[CAMP.pending.def]:null;
  if(G.over==='win' && d){ d.owner='player'; const half=Math.max(1,Math.round((a?a.strength:6)/2));
      if(a) a.strength=Math.max(1,a.strength-half); d.strength=half; toast('CAPTURED '+d.name); }
  else { if(a) a.strength=Math.max(1,Math.round(a.strength*0.60)); toast('ASSAULT FAILED'); }
  CAMP.launched=false; CAMP.pending=null;
  setScreen('campaign'); checkCampEnd(); renderCampaign();
}

// END TURN: player income + garrison growth, then a light enemy AI turn.
function endTurn(){ if(CAMP.over) return;
  for(const z of CAMP.zones) if(z.owner==='player'){ CAMP.ic+=z.income; z.strength+=2; }
  enemyTurn();
  CAMP.turn++; checkCampEnd(); renderCampaign(); if(!CAMP.over) toast('TURN '+CAMP.turn);
}
function enemyTurn(){
  for(const z of CAMP.zones) if(z.owner==='enemy') z.strength+=1;                 // reinforce a little
  for(const z of CAMP.zones){ if(z.owner!=='enemy') continue;
    for(const nid of z.adj){ const n=CAMP.zones[nid];
      if(n.owner==='player' && z.strength > n.strength+1){                        // attack a weaker neighbor
        const ap=z.strength*(0.70+Math.random()*0.50), dp=n.strength*(0.80+Math.random()*0.50);
        if(ap>dp){ n.owner='enemy'; const half=Math.max(1,Math.round(z.strength/2));
            z.strength=Math.max(1,z.strength-half); n.strength=half; toast('ENEMY TOOK '+n.name); }
        else z.strength=Math.max(1,Math.round(z.strength*0.70));
        break;   // one assault per enemy zone per turn
      }
    }
  }
}
function reinforce(){ const z=CAMP.sel!=null?CAMP.zones[CAMP.sel]:null; if(!z||z.owner!=='player') return;
  const cost=5; if(CAMP.ic<cost){ toast('NOT ENOUGH IC'); return; }
  CAMP.ic-=cost; z.strength+=3; toast('REINFORCED '+z.name); renderCampaign(); }
function checkCampEnd(){ const pl=CAMP.zones.filter(z=>z.owner==='player').length, tot=CAMP.zones.length;
  if(pl===tot){ CAMP.over='win'; toast('CAMPAIGN WON'); } else if(pl===0){ CAMP.over='lose'; toast('CAMPAIGN LOST'); } }

// click arbiter for the map
function onZoneClick(id){ if(CAMP.over) return; const z=CAMP.zones[id];
  if(z.owner==='player'){ CAMP.sel=id; CAMP.choice=null; renderCampaign(); return; }
  const sel=CAMP.sel!=null?CAMP.zones[CAMP.sel]:null;
  if(sel && sel.owner==='player' && sel.adj.includes(id)){ CAMP.choice={def:id}; renderCampaign(); }   // attack an adjacent foe/neutral
}

// rebuild the whole SVG/HTML overlay from CAMP (called on every state change)
function renderCampaign(){ const host=el('campaign'); if(!host||!CAMP) return;
  const col=o=>o==='player'?'var(--good)':o==='enemy'?'var(--bad)':'#6b7884';
  const sel=CAMP.sel!=null?CAMP.zones[CAMP.sel]:null;
  const atk=new Set(); if(sel&&sel.owner==='player') for(const nid of sel.adj){ if(CAMP.zones[nid].owner!=='player') atk.add(nid); }
  // adjacency lines (dedup)
  let lines='', seen=new Set();
  for(const z of CAMP.zones) for(const nid of z.adj){ const k=z.id<nid?z.id+'_'+nid:nid+'_'+z.id; if(seen.has(k)) continue; seen.add(k);
    const n=CAMP.zones[nid]; lines+=`<line class="zlink" x1="${z.x}%" y1="${z.y}%" x2="${n.x}%" y2="${n.y}%"/>`; }
  // zone nodes
  let nodes='';
  for(const z of CAMP.zones){ const cls='znode'+(CAMP.sel===z.id?' sel':'')+(atk.has(z.id)?' atk':'');
    nodes+=`<g class="${cls}" data-action="zone" data-zone="${z.id}">`+
      `<circle cx="${z.x}%" cy="${z.y}%" r="20" fill="${col(z.owner)}" fill-opacity="0.88"/>`+
      `<text class="zs" x="${z.x}%" y="${z.y}%" dy="0.35em">${z.strength}</text>`+
      `<text class="zn" x="${z.x}%" y="${z.y}%" dy="2.9em">${z.name}</text></g>`; }
  // info panel
  let panel;
  if(CAMP.over){ panel=`<h3 style="color:${CAMP.over==='win'?'var(--good)':'var(--bad)'}">CAMPAIGN ${CAMP.over==='win'?'WON':'LOST'}</h3>`+
      `<div class="kv"><span>The war is decided.</span></div>`; }
  else if(sel){ panel=`<h3>${sel.name}</h3>`+
      `<div class="kv"><span>OWNER</span><b style="color:${col(sel.owner)}">${sel.owner.toUpperCase()}</b></div>`+
      `<div class="kv"><span>GARRISON</span><b>${sel.strength}</b></div>`+
      `<div class="kv"><span>INCOME</span><b>${sel.income} IC/turn</b></div>`+
      (sel.owner==='player'?`<button class="btn" data-action="reinforce" style="margin-top:8px; width:100%">REINFORCE (5 IC → +3)</button>`:``); }
  else panel=`<h3>NAVAL THEATER</h3><div class="kv"><span>Select one of your zones, then click an adjacent grey/red zone to attack it.</span></div>`;
  // attack choice popup
  let choice=`<div id="campchoice"></div>`;
  if(CAMP.choice){ const d=CAMP.zones[CAMP.choice.def], a=CAMP.zones[CAMP.sel];
    choice=`<div id="campchoice" class="show"><h4>ATTACK ${d.name.toUpperCase()}</h4>`+
      `<div class="kv" style="justify-content:center; color:var(--dim); font-size:12px; margin-bottom:10px">YOUR ${a.strength} &nbsp;vs&nbsp; DEF ${d.strength}</div>`+
      `<button class="btn" data-action="camp-auto">AUTO-RESOLVE</button>`+
      `<button class="btn" data-action="camp-fight">BATTLE</button>`+
      `<button class="btn" data-action="camp-cancel">CANCEL</button></div>`; }
  host.innerHTML=`
    <div class="camptop">
      <div class="brand">NAVAL DOMINANCE</div>
      <div class="stat">TURN <b>${CAMP.turn}</b></div>
      <div class="stat">IC <b>${CAMP.ic}</b></div>
      <div class="spacer"></div>
      <button class="btn" data-action="end-turn"${CAMP.over?' disabled':''}>END TURN ▸</button>
    </div>
    <svg id="campsvg" xmlns="http://www.w3.org/2000/svg">${lines}${nodes}</svg>
    <div id="camppanel">${panel}</div>
    <div id="camphint"><b>CAMPAIGN</b> · capture every zone to win.<br>Green = you · Red = enemy · Grey = neutral.<br>AUTO-RESOLVE settles by strength; BATTLE drops you into the 3D fight.</div>
    ${choice}`;
}

// one delegated click listener for all campaign + return actions (no inline onclick, per file convention)
function initCampaign(){
  CAMP={ turn:1, ic:20, sel:null, choice:null, over:null, launched:false, pending:null, zones:genZones() };
  document.addEventListener('click',e=>{
    const t=e.target.closest && e.target.closest('[data-action]'); if(!t) return;
    const a=t.getAttribute('data-action');
    if(a==='camp-return'){ returnFromBattle(); return; }
    if(SCREEN!=='campaign') return;
    if(a==='end-turn') endTurn();
    else if(a==='reinforce') reinforce();
    else if(a==='zone') onZoneClick(+t.getAttribute('data-zone'));
    else if(a==='camp-auto'){ if(CAMP.choice){ autoResolve(CAMP.zones[CAMP.sel],CAMP.zones[CAMP.choice.def]); CAMP.choice=null; checkCampEnd(); renderCampaign(); } }
    else if(a==='camp-fight'){ if(CAMP.choice){ const d=CAMP.zones[CAMP.choice.def]; CAMP.choice=null; launchBattle(CAMP.zones[CAMP.sel],d); } }
    else if(a==='camp-cancel'){ CAMP.choice=null; renderCampaign(); }
  });
}

/* ============================ §K ENTRY ============================ */
async function boot(){
  try{ el('bootMsg').textContent='LOADING RENDERER…'; THREE=await import(THREE_URL); }
  catch(err){ el('bootMsg').textContent='could not load Three.js (network). Check connection.'; logErr(err); return; }
  initThreeScene();
  setupBattleScene();                      // build the battle world once (campaign relaunches reuse it)
  bindInput(); initHUD();
  // campaign layer: generate the map and land the player on it first (battles launch from here)
  initCampaign(); setScreen('campaign'); renderCampaign();
  if(DEV) window.__nd={ G:()=>G, possess:(id,wi)=>enterPossess(id,wi), fire:(id,wi)=>{ const e=G.ents.find(x=>x.id===id); if(e) tryFire(e,wi); } };
  el('boot').classList.add('hide'); setTimeout(()=>{ const b=el('boot'); if(b) b.remove(); },700);
  if(MUS.on){ /* music starts on first user gesture (autoplay policy) */ }
  last=performance.now(); requestAnimationFrame(frame);
  if(DEV){ setInterval(()=>{ try{ JSON.stringify(G); }catch(e){ console.error('G NOT JSON-CLEAN — mesh leaked into G',e); } },1000); }
}
boot();
</script>
