<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levy Fight Viewer</title>
<style>
:root{--bg:#10141a;--panel:#171d26;--line:#2a3442;--ink:#d8e0ea;--dim:#8794a6;--player:#4cd964;--levy:#4aa3ff;--boss:#ff4d4d;--proj:#ff9f2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600}
header .meta{color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,label.btn{background:#222c3a;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer}
button:hover,label.btn:hover{background:#2b384a}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{position:relative;flex:1;min-height:0}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;background:#0b0e13}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:16px;pointer-events:none}
#stage.dragover{outline:2px dashed var(--levy);outline-offset:-6px}
#tip{position:absolute;pointer-events:none;background:#0d1117ee;border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px;white-space:pre;display:none;z-index:5}
#controls{padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px}
#row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#scrub{flex:1;min-width:200px}
#time{font-variant-numeric:tabular-nums;min-width:110px}
canvas#strip{width:100%;height:78px;display:block;background:#0b0e13;border:1px solid var(--line);border-radius:4px;cursor:pointer}
#legend{display:flex;gap:12px;color:var(--dim);flex-wrap:wrap;font-size:12px}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:14px 0 6px}
aside h2:first-child{margin-top:0}
table{border-collapse:collapse;width:100%}
td,th{padding:2px 4px;text-align:right;border-bottom:1px solid #202a37;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
.small{color:var(--dim);font-size:12px}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Levy Fight Viewer</h1>
  <span class="meta" id="meta">no recording loaded</span>
  <label class="btn">Open recording<input id="file" type="file" accept=".jsonl,.json,.txt"></label>
</header>
<div id="main">
  <div id="stage"><canvas id="view"></canvas><div id="drop">Drop a Levy fight recording here<br><span class="small">(.jsonl written by /levyrec)</span></div><div id="tip"></div></div>
  <div id="controls">
    <div id="row1">
      <button id="play">Play</button>
      <select id="speed"><option value="0.1">0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
      <input id="scrub" type="range" min="0" max="1000" value="0">
      <span id="time">0.00 / 0.00 s</span>
      <label>trail <select id="trail"><option value="0">off</option><option value="1">1 s</option><option value="3" selected>3 s</option><option value="8">8 s</option><option value="30">30 s</option><option value="9999">all</option></select></label>
      <label><input type="checkbox" id="follow"> follow player</label>
      <button id="fit">Fit</button>
    </div>
    <canvas id="strip" width="1200" height="78"></canvas>
    <div id="legend"><span><i style="background:var(--player)"></i>player</span><span><i style="background:var(--levy)"></i>levy</span><span><i style="background:var(--boss)"></i>boss / part</span><span><i style="background:var(--proj)"></i>hostile projectile</span><span class="small">wheel zoom, drag pan, click strip to seek, space play/pause</span></div>
  </div>
</div>
<aside id="side"><div class="small">Stats appear when a recording is loaded.</div></aside>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const TPS=60, TILE=16;
let D=null, playing=false, cur=0, last=0;
const cam={x:0,y:0,z:0.5};
let blips=[], arenaCanvas=null;

// ---------------------------------------------------------------- loading
function parseRec(text){
  const R={hdr:null,arena:null,frames:[],events:[],names:{items:{},npcs:{},projectiles:{},buffs:{},soldiers:{}},end:null};
  for(const line of text.split("\n")){
    const s=line.trim(); if(!s) continue;
    let o; try{o=JSON.parse(s);}catch(e){continue;}
    switch(o.k){case "hdr":R.hdr=o;break;case "arena":R.arena=o;break;case "f":R.frames.push(o);break;case "e":R.events.push(o);break;case "names":R.names=o;break;case "end":R.end=o;break;}
  }
  if(!R.frames.length) throw new Error("no frames in file");
  return R;
}
function build(R){
  // tracks for trails: [t,x,y]
  R.trP=R.frames.map(f=>[f.t,f.p[0],f.p[1]]);
  R.trL=new Map(); R.trB=new Map();
  for(const f of R.frames){
    for(const l of (f.l||[])){let a=R.trL.get(l[0]);if(!a)R.trL.set(l[0],a=[]);a.push([f.t,l[1],l[2]]);}
    for(const b of (f.b||[])){const k=b[1];let a=R.trB.get(k);if(!a)R.trB.set(k,a=[]);a.push([f.t,b[2],b[3]]);}
  }
  R.tmax=R.frames[R.frames.length-1].t; R.tmin=R.frames[0].t;
  // arena image
  const A=R.arena; arenaCanvas=null;
  if(A){
    const c=document.createElement("canvas"); c.width=A.w; c.height=A.h; const g=c.getContext("2d"); const im=g.createImageData(A.w,A.h);
    const col={0:[0,0,0,0],1:[150,160,175,255],2:[200,170,90,255],3:[40,90,170,160]};
    A.rows.forEach((row,y)=>{let x=0;for(let i=0;i+1<row.length;i+=2){const c4=col[row[i]]||col[0];for(let k=0;k<row[i+1];k++,x++){const o=(y*A.w+x)*4;im.data[o]=c4[0];im.data[o+1]=c4[1];im.data[o+2]=c4[2];im.data[o+3]=c4[3];}}});
    g.putImageData(im,0,0); arenaCanvas=c;
  }
}
function load(text,name){
  D=parseRec(text); build(D);
  const h=D.hdr||{};
  $("meta").textContent=`${name||""}  |  boss ${h.boss||"?"}  |  ${h.mode||"?"}  |  Levy ${h.levy||"?"}  |  ${D.frames.length} samples, ${((D.tmax-D.tmin)/TPS).toFixed(1)} s${D.end?"  |  ended: "+D.end.reason:""}`;
  $("drop").style.display="none";
  cur=D.tmin; fitView(); renderStats(); drawStrip(); draw(); syncUI();
}
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(t=>load(t,f.name));});
const stage=$("stage");
stage.addEventListener("dragover",e=>{e.preventDefault();stage.classList.add("dragover");});
stage.addEventListener("dragleave",()=>stage.classList.remove("dragover"));
stage.addEventListener("drop",e=>{e.preventDefault();stage.classList.remove("dragover");const f=e.dataTransfer.files[0];if(f)f.text().then(t=>load(t,f.name));});
window.addEventListener("dragover",e=>e.preventDefault()); window.addEventListener("drop",e=>e.preventDefault());

// ---------------------------------------------------------------- helpers
function frameIndex(t){let lo=0,hi=D.frames.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(D.frames[m].t<=t)lo=m;else hi=m-1;}return lo;}
function trackStart(tr,t){let lo=0,hi=tr.length;while(lo<hi){const m=(lo+hi)>>1;if(tr[m][0]<t)lo=m+1;else hi=m;}return lo;}
const nm=(tbl,id)=>(D.names[tbl]&&D.names[tbl][id])||("#"+id);
function canvasSize(){const c=$("view");const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*dpr)),h=Math.max(10,Math.round(r.height*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}return {w,h,dpr};}
function fitView(){
  const {w,h}=canvasSize(); let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
  const A=D.arena; if(A){x0=A.x0*TILE;y0=A.y0*TILE;x1=(A.x0+A.w)*TILE;y1=(A.y0+A.h)*TILE;}
  else for(const t of D.trP){x0=Math.min(x0,t[1]-400);x1=Math.max(x1,t[1]+400);y0=Math.min(y0,t[2]-400);y1=Math.max(y1,t[2]+400);}
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2; cam.z=Math.min(w/(x1-x0),h/(y1-y0))*0.96;
}
const w2s=(x,y,W,H)=>[(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2];

// ---------------------------------------------------------------- drawing
function draw(){
  const c=$("view"),g=c.getContext("2d"); const {w:W,h:H,dpr}=canvasSize();
  g.setTransform(1,0,0,1,0,0); g.fillStyle="#0b0e13"; g.fillRect(0,0,W,H); blips=[];
  if(!D){return;}
  const fi=frameIndex(cur), f=D.frames[fi];
  if($("follow").checked){cam.x=f.p[0];cam.y=f.p[1];}
  g.imageSmoothingEnabled=false;
  if(arenaCanvas){const A=D.arena;const [sx,sy]=w2s(A.x0*TILE,A.y0*TILE,W,H);g.drawImage(arenaCanvas,sx,sy,A.w*TILE*cam.z,A.h*TILE*cam.z);
    g.strokeStyle="#2a3442";g.lineWidth=1;g.strokeRect(sx+.5,sy+.5,A.w*TILE*cam.z,A.h*TILE*cam.z);}
  const trailTicks=parseFloat($("trail").value)*TPS;
  const trail=(tr,color,lw)=>{
    if(!trailTicks) return; const i1=trackStart(tr,f.t+1); const i0=trackStart(tr,f.t-trailTicks); if(i1-i0<2) return;
    g.lineWidth=lw*dpr; g.lineCap="round";
    for(let i=Math.max(i0,1);i<i1;i++){
      const a=tr[i-1],b=tr[i]; if(b[0]-a[0]>12) continue; // a gap: entity was out of view
      const age=(f.t-b[0])/Math.max(trailTicks,1); g.strokeStyle=color; g.globalAlpha=Math.max(0.08,1-age)*0.85;
      const p0=w2s(a[1],a[2],W,H),p1=w2s(b[1],b[2],W,H); g.beginPath(); g.moveTo(p0[0],p0[1]); g.lineTo(p1[0],p1[1]); g.stroke();
    }
    g.globalAlpha=1;
  };
  const dot=(x,y,r,color,info)=>{const [sx,sy]=w2s(x,y,W,H);g.fillStyle=color;g.beginPath();g.arc(sx,sy,r*dpr,0,6.2832);g.fill();blips.push({x:sx/dpr,y:sy/dpr,r:Math.max(r,6),info});return [sx,sy];};
  // trails
  for(const [id,tr] of D.trL) trail(tr,"#4aa3ff",1.5);
  for(const [id,tr] of D.trB) trail(tr,"#ff4d4d",1.5);
  trail(D.trP,"#4cd964",2.2);
  // projectiles
  for(const j of (f.j||[])) dot(j[1],j[2],2.2,"#ff9f2e",`projectile ${nm("projectiles",j[0])}\ndamage ${j[5]}\nvel ${j[3].toFixed(1)}, ${j[4].toFixed(1)} px/tick`);
  // levies
  const states=(D.hdr&&D.hdr.stateNames||"").split(",");
  for(const l of (f.l||[])){
    const sp=Math.hypot(l[3],l[4]);
    dot(l[1],l[2],4.2,"#4aa3ff",`levy ${nm("soldiers",l[0])}\nstate ${states[l[7]]||l[7]}  life ${l[6]}\nweapon ${l[8]?nm("items",l[8]):"-"}\nspeed ${(sp*60/16).toFixed(1)} tiles/s  ${(l[5]&1)?"grounded":"airborne"}${(l[5]&2)?" flying":""}${(l[5]&8)?" hooking":""}`);
  }
  // bosses
  for(const b of (f.b||[])){
    dot(b[2],b[3],b[13]?4:7,"#ff4d4d",`${nm("npcs",b[0])}${b[13]?" (part)":""}\nlife ${b[6]}/${b[7]}\nai ${b[8].toFixed(0)}, ${b[9].toFixed(0)}, ${b[10].toFixed(0)}, ${b[11].toFixed(0)}  target ${b[12]}\nspeed ${(Math.hypot(b[4],b[5])*60/16).toFixed(1)} tiles/s`);
  }
  // player (last, on top), with a heading tick
  const p=f.p, fl=p[5];
  const [px,py]=dot(p[0],p[1],6,"#4cd964",`PLAYER  life ${p[6]}  mana ${p[7]}\nheld ${p[11]?nm("items",p[11]):"-"}\nspeed ${(Math.hypot(p[2],p[3])*60/16).toFixed(1)} tiles/s  ${(fl&1)?"grounded":"airborne"}${(fl&2)?"  flying (wing "+p[9].toFixed(0)+" rocket "+p[10].toFixed(0)+")":""}${(fl&2048)?"  DASHING":""}\nimmune ${p[8]}${p[12]>=0?"  mount "+p[12]:""}`);
  g.strokeStyle="#4cd964";g.lineWidth=2*dpr;g.beginPath();g.moveTo(px,py);g.lineTo(px+p[4]*14*dpr,py);g.stroke();
  if(fl&2){g.strokeStyle="#c58cff";g.lineWidth=2*dpr;g.beginPath();g.arc(px,py,10*dpr,0,6.2832);g.stroke();}
  if(fl&2048){g.strokeStyle="#41e0e0";g.lineWidth=2*dpr;g.beginPath();g.arc(px,py,14*dpr,0,6.2832);g.stroke();}
  if(fl&8){const [hx,hy]=w2s(p[13],p[14],W,H);g.strokeStyle="#f2d94a";g.lineWidth=1.5*dpr;g.beginPath();g.moveTo(px,py);g.lineTo(hx,hy);g.stroke();}
  // grid-free scale bar (10 tiles)
  g.fillStyle="#8794a6";g.font=`${11*dpr}px system-ui`;const bw=10*TILE*cam.z;g.fillRect(12*dpr,H-18*dpr,bw,2*dpr);g.fillText("10 tiles",12*dpr,H-24*dpr);
}

// ---------------------------------------------------------------- event strip
const EV_ROWS=[["jump","#4cd964"],["xjump","#b6ff5a"],["dash","#41e0e0"],["hook","#f2d94a"],["use","#cfd6e0"],["hit","#ff4d4d"],["fly","#c58cff"]];
function drawStrip(){
  const c=$("strip"),g=c.getContext("2d"),W=c.width,H=c.height; g.clearRect(0,0,W,H); if(!D) return;
  const rh=H/EV_ROWS.length, span=Math.max(1,D.tmax-D.tmin);
  EV_ROWS.forEach((r,i)=>{g.fillStyle=i%2?"#0e1218":"#0b0e13";g.fillRect(0,i*rh,W,rh);g.fillStyle="#5b6778";g.font="10px system-ui";g.fillText(r[0],3,i*rh+10);});
  for(const e of D.events){
    const i=EV_ROWS.findIndex(r=>r[0]===e.e); if(i<0) continue; if(e.e==="fly"&&!e.on) continue; if(e.e==="hook"&&e.phase!=="launch") continue;
    const x=(e.t-D.tmin)/span*(W-2)+1; g.fillStyle=EV_ROWS[i][1]; g.fillRect(x-1,i*rh+2,2,rh-4);
  }
  const x=(cur-D.tmin)/span*(W-2)+1; g.fillStyle="#fff"; g.fillRect(x-1,0,2,H);
}
$("strip").addEventListener("click",e=>{if(!D)return;const r=e.target.getBoundingClientRect();cur=D.tmin+(e.clientX-r.left)/r.width*(D.tmax-D.tmin);syncUI();draw();drawStrip();});
$("strip").addEventListener("mousemove",e=>{if(!D)return;const r=e.target.getBoundingClientRect();const t=D.tmin+(e.clientX-r.left)/r.width*(D.tmax-D.tmin);
  let best=null,bd=1e9;for(const ev of D.events){if(ev.e==="buffs"||ev.e==="acc")continue;const d=Math.abs(ev.t-t);if(d<bd){bd=d;best=ev;}}
  const tip=$("tip");if(best&&bd<30){tip.style.display="block";tip.textContent=describeEvent(best);const sr=stage.getBoundingClientRect();tip.style.left="12px";tip.style.top="12px";}else tip.style.display="none";});
$("strip").addEventListener("mouseleave",()=>$("tip").style.display="none");
function describeEvent(e){
  const s=`${(e.t/TPS).toFixed(2)} s  ${e.e}`;
  if(e.e==="use")return s+"  "+nm("items",e.item);
  if(e.e==="hit")return s+`  ${e.dmg} dmg from ${e.npc>=0?nm("npcs",e.npc):e.proj>0?nm("projectiles",e.proj):"other"}`;
  if(e.e==="dash")return s+`  type ${e.type}/${e.dashType} dir ${e.dir}`;
  if(e.e==="xjump")return s+"  "+e.name;
  if(e.e==="hook")return s+"  "+e.phase;
  if(e.e==="fly")return s+(e.on?" start":" stop");
  return s;
}

// ---------------------------------------------------------------- stats
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function summarize(samples){ // samples: [{t,vx,vy,grounded,dx(distance to boss px or null)}]
  const n=samples.length; if(!n) return null;
  let air=0,still=0,sp=0,mx=0,jumps=0,dsum=0,dn=0,dmin=1e9;
  let prevG=true;
  for(const s of samples){
    const v=Math.hypot(s.vx,s.vy); sp+=v; mx=Math.max(mx,v); if(!s.grounded)air++; if(v<0.3)still++;
    if(prevG&&!s.grounded&&s.vy<-1.5)jumps++; prevG=s.grounded;
    if(s.d!=null){dsum+=s.d;dn++;dmin=Math.min(dmin,s.d);}
  }
  const secs=n*2/TPS;
  return {n,secs,air:100*air/n,still:100*still/n,avg:sp/n*60/16,max:mx*60/16,jumpsMin:jumps/secs*60,dist:dn?dsum/dn/16:null,distMin:dn?dmin/16:null};
}
function bossPos(f){let best=null;for(const b of (f.b||[])){if(!b[13]){return b;}if(!best)best=b;}return best;}
function computeStats(){
  const P=[],L=new Map();
  for(const f of D.frames){
    const b=bossPos(f);const p=f.p;
    P.push({t:f.t,vx:p[2],vy:p[3],grounded:!!(p[5]&1),d:b?dist(p[0],p[1],b[2],b[3]):null});
    for(const l of (f.l||[])){let a=L.get(l[0]);if(!a)L.set(l[0],a=[]);a.push({t:f.t,vx:l[3],vy:l[4],grounded:!!(l[5]&1),d:b?dist(l[1],l[2],b[2],b[3]):null});}
  }
  const ps=summarize(P), per=[...L.entries()].map(([id,s])=>({id,s:summarize(s)})).filter(x=>x.s&&x.s.secs>=1);
  const avg=k=>per.length?per.reduce((a,x)=>a+(x.s[k]||0),0)/per.length:null;
  const ls=per.length?{air:avg("air"),still:avg("still"),avg:avg("avg"),max:avg("max"),jumpsMin:avg("jumpsMin"),dist:avg("dist"),distMin:avg("distMin")}:null;
  // events
  const ev={jump:0,xjump:0,dash:0,hook:0,use:0,hit:0},hits=new Map(),uses=new Map(),xj=new Map(),dtype=new Map();
  for(const e of D.events){
    if(e.e==="hook"&&e.phase!=="launch")continue; if(e.e in ev)ev[e.e]++;
    if(e.e==="hit"){const k=e.npc>=0?nm("npcs",e.npc):e.proj>0?nm("projectiles",e.proj):"other";const h=hits.get(k)||{n:0,dmg:0};h.n++;h.dmg+=e.dmg;hits.set(k,h);}
    if(e.e==="use"){const k=nm("items",e.item);uses.set(k,(uses.get(k)||0)+1);}
    if(e.e==="xjump")xj.set(e.name,(xj.get(e.name)||0)+1);
    if(e.e==="dash")dtype.set(e.type+"/"+e.dashType,(dtype.get(e.type+"/"+e.dashType)||0)+1);
  }
  return {ps,ls,per,ev,hits,uses,xj,dtype,levyCount:per.length};
}
const f1=v=>v==null?"-":v.toFixed(1);
function renderStats(){
  const S=computeStats(), mins=Math.max(1/60,(D.tmax-D.tmin)/TPS/60);
  const row=(label,a,b)=>`<tr><td>${label}</td><td>${a}</td><td>${b}</td></tr>`;
  let h=`<h2>Player vs levy average (${S.levyCount} levies)</h2><table><tr><th></th><th>player</th><th>levies</th></tr>`;
  h+=row("airborne %",f1(S.ps.air),f1(S.ls&&S.ls.air))+row("standing still %",f1(S.ps.still),f1(S.ls&&S.ls.still))
   +row("avg speed (tiles/s)",f1(S.ps.avg),f1(S.ls&&S.ls.avg))+row("max speed (tiles/s)",f1(S.ps.max),f1(S.ls&&S.ls.max))
   +row("jumps / min (from motion)",f1(S.ps.jumpsMin),f1(S.ls&&S.ls.jumpsMin))
   +row("avg distance to boss (tiles)",f1(S.ps.dist),f1(S.ls&&S.ls.dist))+row("closest to boss (tiles)",f1(S.ps.distMin),f1(S.ls&&S.ls.distMin))+"</table>";
  h+=`<h2>Player actions (${mins.toFixed(2)} min)</h2><table><tr><th></th><th>count</th><th>per min</th></tr>`;
  for(const k of ["jump","xjump","dash","hook","use","hit"])h+=`<tr><td>${{jump:"jumps",xjump:"extra jumps",dash:"dashes",hook:"grapples",use:"item uses",hit:"hits taken"}[k]}</td><td>${S.ev[k]}</td><td>${(S.ev[k]/mins).toFixed(1)}</td></tr>`;
  h+="</table>";
  if(S.xj.size)h+=`<h2>Extra jumps</h2><table>${[...S.xj].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>`;
  if(S.dtype.size)h+=`<h2>Dash types (dash/dashType)</h2><table>${[...S.dtype].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>`;
  h+=`<h2>Hits taken by source</h2>`+(S.hits.size?`<table><tr><th></th><th>hits</th><th>damage</th></tr>${[...S.hits].sort((a,b)=>b[1].dmg-a[1].dmg).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${v.dmg}</td></tr>`).join("")}</table>`:`<div class="small">none</div>`);
  h+=`<h2>Items used</h2>`+(S.uses.size?`<table>${[...S.uses].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>`:`<div class="small">none</div>`);
  const accs=D.events.filter(e=>e.e==="acc");
  if(accs.length){const last=accs[accs.length-1];h+=`<h2>Equipped (last change at ${(last.t/TPS).toFixed(1)} s)</h2><div class="small">${last.slots.filter(Boolean).map(id=>nm("items",id)).join(", ")||"-"}</div><div class="small">${accs.length-1} change(s) during the fight</div>`;}
  if(S.per.length){h+=`<h2>Per levy</h2><table><tr><th></th><th>air%</th><th>still%</th><th>tiles/s</th><th>dist</th></tr>${S.per.map(x=>`<tr><td>${nm("soldiers",x.id)}</td><td>${f1(x.s.air)}</td><td>${f1(x.s.still)}</td><td>${f1(x.s.avg)}</td><td>${f1(x.s.dist)}</td></tr>`).join("")}</table>`;}
  h+=`<h2>Header</h2><div class="small">mods: ${(D.hdr&&D.hdr.mods||[]).map(m=>m[0]+" "+m[1]).join(", ")}<br>world: ${D.hdr&&D.hdr.world||"?"}</div>`;
  $("side").innerHTML=h; window.__stats=S;
}

// ---------------------------------------------------------------- controls
function syncUI(){
  if(!D)return; const span=D.tmax-D.tmin||1; $("scrub").value=Math.round((cur-D.tmin)/span*1000);
  $("time").textContent=`${((cur-D.tmin)/TPS).toFixed(2)} / ${(span/TPS).toFixed(2)} s`;
}
function setPlaying(v){playing=v;$("play").textContent=v?"Pause":"Play";last=performance.now();}
$("play").onclick=()=>{if(D){if(!playing&&cur>=D.tmax)cur=D.tmin;setPlaying(!playing);}};
$("scrub").oninput=e=>{if(!D)return;cur=D.tmin+e.target.value/1000*(D.tmax-D.tmin);draw();drawStrip();syncUI();};
$("trail").onchange=()=>draw(); $("follow").onchange=()=>draw(); $("fit").onclick=()=>{if(D){fitView();draw();}};
window.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="SELECT"&&e.target.tagName!=="INPUT"){e.preventDefault();$("play").click();}
  if(D&&e.code==="ArrowRight"){cur=Math.min(D.tmax,cur+2);draw();drawStrip();syncUI();} if(D&&e.code==="ArrowLeft"){cur=Math.max(D.tmin,cur-2);draw();drawStrip();syncUI();}});
const view=$("view");
let drag=null;
view.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY};});
window.addEventListener("mouseup",()=>drag=null);
view.addEventListener("mousemove",e=>{
  const r=view.getBoundingClientRect();
  if(drag&&D){cam.x-=(e.clientX-drag.x)/cam.z;cam.y-=(e.clientY-drag.y)/cam.z;drag={x:e.clientX,y:e.clientY};$("follow").checked=false;draw();return;}
  const mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;
  for(const b of blips){const d=Math.hypot(b.x-mx,b.y-my);if(d<b.r+4&&d<bd){bd=d;best=b;}}
  const tip=$("tip");if(best){tip.style.display="block";tip.textContent=best.info;tip.style.left=Math.min(mx+14,r.width-260)+"px";tip.style.top=Math.min(my+14,r.height-90)+"px";}else tip.style.display="none";
});
view.addEventListener("mouseleave",()=>$("tip").style.display="none");
view.addEventListener("wheel",e=>{if(!D)return;e.preventDefault();const r=view.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const mx=(e.clientX-r.left)*dpr-view.width/2,my=(e.clientY-r.top)*dpr-view.height/2;const wx=cam.x+mx/cam.z,wy=cam.y+my/cam.z;
  cam.z*=e.deltaY<0?1.15:1/1.15;cam.z=Math.max(0.02,Math.min(8,cam.z));cam.x=wx-mx/cam.z;cam.y=wy-my/cam.z;draw();},{passive:false});
window.addEventListener("resize",()=>{if(D){draw();}});
function frameLoop(now){
  if(playing&&D){const dt=(now-last)/1000;last=now;cur+=dt*TPS*parseFloat($("speed").value);if(cur>=D.tmax){cur=D.tmax;setPlaying(false);}syncUI();draw();drawStrip();}
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
window.__loadText=load; // used by automated checks
</script>
</body>
