<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOTAL MOBILIZATION — Topdown Slice</title>
<style>
  html, body { margin: 0; height: 100%; background: #060a12; overflow: hidden; }
  #view { display: block; width: 100%; height: 100%; cursor: grab; }
  #view.grabbing { cursor: grabbing; }
  /* TECH/PRODUCTION TREE VIEW (CONCEPT.md's settled "Interactive in-game
     tech/production tree" direction — game/techtree.js + game/techtreeview.js).
     A dedicated full-screen canvas, its own independent pan/zoom camera, kept
     hidden (display:none, toggled from JS not just a CSS class so it never
     eats pointer events while closed) until the G key opens it. z-index above
     every other HUD panel — it's meant to be a full, exclusive overlay, not
     one more corner widget. */
  #techTreeCanvas { display: none; position: fixed; inset: 0; width: 100%; height: 100%; z-index: 500; cursor: grab; }
  #techTreeCanvas.grabbing { cursor: grabbing; }
  /* max-width leaves room for #econHud's fixed top-right panel below, so a
     long flash message wraps onto its own line instead of running under it. */
  #hud { position: fixed; top: 10px; left: 10px; max-width: calc(100% - 240px); color: #bfe9ff; font: 12px Consolas, monospace; pointer-events: none; text-shadow: 0 1px 2px #000; }
  /* Economy readout (P3 — game/economy.js): compact, top-right, same family
     as #hud so it reads as one HUD system rather than a bolted-on panel. */
  #econHud {
    position: fixed; top: 10px; right: 10px; min-width: 208px;
    padding: 8px 12px; background: rgba(8,14,26,.82); border: 1px solid #2f5f9c;
    border-radius: 6px; color: #bfe9ff; font: 11px Consolas, monospace;
    line-height: 1.55; white-space: pre-line; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #econHud b { color: #6dffb0; }
  /* OBJECTIVE HUD (Playability v1 — CONCEPT.md's settled "Playability v1"
     section: "cities held vs lost, the capital marked and its status, and
     win progress"). Same compact-panel family as #econHud, bottom-left so
     it never collides with #econHud (top-right), #phaseHud/#guidancePanel
     (top-center), #buildbar (bottom-center), or #directorBubble
     (bottom-right). Hidden outside COMBAT — see main.js's
     updateObjectiveHud. */
  #objectiveHud {
    display: none; position: fixed; left: 10px; bottom: 10px; min-width: 210px;
    padding: 8px 12px; background: rgba(8,14,26,.82); border: 1px solid #6a3030;
    border-radius: 6px; color: #ffd9d9; font: 11px Consolas, monospace;
    line-height: 1.55; white-space: pre-line; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #objectiveHud.show { display: block; }
  #objectiveHud b { color: #ff8a8a; }
  #card {
    position: fixed; display: none; padding: 10px 14px; min-width: 150px;
    background: rgba(8,14,26,.94); border: 1px solid #2f5f9c; border-radius: 6px;
    color: #eaf2ff; font: 12px Consolas, monospace; pointer-events: none;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #card b { font-size: 13px; letter-spacing: .5px; color: #6dffb0; display: block; margin-bottom: 6px; }
  #card .row { display: flex; justify-content: space-between; gap: 16px; color: #9fb6c4; }
  #card .row span:last-child { color: #eaf2ff; }
  /* B-mode build strip (delegated construction, CONCEPT.md Pillar 1): a
     minimal DOM list of building types, hidden until B is pressed. */
  #buildbar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: none; gap: 8px; padding: 8px 10px;
    background: rgba(8,14,26,.94); border: 1px solid #2f5f9c; border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #buildbar.open { display: flex; }
  #buildbar button {
    background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff; border-radius: 5px;
    padding: 7px 12px; cursor: pointer; font: 12px Consolas, monospace;
  }
  #buildbar button:hover { background: #1c3a5e; }
  #buildbar button.selected { background: #2f5f9c; color: #fff; }
  /* P4 "choose what to produce" panel: pick a category, see its recipe,
     then confirm to arm B-mode with the matching facility preselected.
     Left side (buildbar owns bottom-center) so the two never overlap. */
  #prodPanel, #importPanel {
    position: fixed; left: 16px; top: 90px; width: 300px;
    display: none; flex-direction: column; gap: 8px; padding: 10px 12px;
    background: rgba(8,14,26,.94); border: 1px solid #2f5f9c; border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); color: #eaf2ff; font: 12px Consolas, monospace;
  }
  #prodPanel.open, #importPanel.open { display: flex; }
  #prodPanel .catRow, #importPanel .resRow { display: flex; gap: 6px; flex-wrap: wrap; }
  #prodPanel button, #importPanel button {
    background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff; border-radius: 5px;
    padding: 6px 10px; cursor: pointer; font: 12px Consolas, monospace;
  }
  #prodPanel button:hover, #importPanel button:hover { background: #1c3a5e; }
  #prodPanel button.selected { background: #2f5f9c; color: #fff; }
  #recipeInfo { white-space: pre-line; line-height: 1.5; color: #bfe9ff; }
  #recipeInfo b { color: #6dffb0; }
  /* RESEARCH PANEL (P4 follow-up — game/research.js): same panel chrome as
     #prodPanel/#importPanel (matching the task's "styled to match" ask),
     positioned at the SAME top-left anchor — those two panels already share
     one spot and are independently toggled (P/I don't exclude each other),
     so T joining that same spot is consistent with the existing convention
     rather than a special case. Taller/wider than the other two since it
     needs to list up to six techs' full gate text at once, not one recipe
     or one resource-button row. */
  #techPanel {
    position: fixed; left: 16px; top: 90px; width: 360px; max-height: 76vh;
    overflow-y: auto;
    display: none; flex-direction: column; gap: 8px; padding: 10px 12px;
    background: rgba(8,14,26,.94); border: 1px solid #2f5f9c; border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); color: #eaf2ff; font: 12px Consolas, monospace;
  }
  #techPanel.open { display: flex; }
  #techPanel > b { color: #6dffb0; }
  .techRow {
    display: flex; flex-direction: column; gap: 3px; padding: 8px 9px;
    background: #0e1c2f; border: 1px solid #234260; border-radius: 6px;
  }
  .techHeader { color: #eaf2ff; }
  .techHeader b { color: #6dffb0; }
  .techBlurb { color: #9fb6c4; font-size: 11px; }
  .techGate { color: #bfe9ff; font-size: 11px; white-space: pre-line; line-height: 1.4; }
  .techStatus { color: #ffcf5c; font-size: 11px; min-height: 14px; }
  .techRow button {
    align-self: flex-start; background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff;
    border-radius: 5px; padding: 5px 10px; cursor: pointer; font: 12px Consolas, monospace;
  }
  .techRow button:hover:not(:disabled) { background: #1c3a5e; }
  .techRow button:disabled { opacity: .45; cursor: not-allowed; }
  /* PHASE HUD (prep/combat, CONCEPT.md's settled "Phases" line): a small
     pill top-center so the current phase reads at a glance without hunting
     the corner panels — blue for prep, red once combat begins. */
  #phaseHud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    background: rgba(8,14,26,.88); border: 1px solid #2f5f9c; border-radius: 7px;
    color: #eaf2ff; font: 12px Consolas, monospace; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #phaseHud #phaseLabel { font-weight: bold; letter-spacing: 1px; color: #6dffb0; }
  #phaseHud.combat #phaseLabel { color: #ff8a8a; }
  #phaseHud #phaseHint { color: #9fb6c4; }
  #phaseHud button {
    background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff; border-radius: 5px;
    padding: 5px 10px; cursor: pointer; font: 11px Consolas, monospace;
  }
  #phaseHud button:hover { background: #1c3a5e; }
  /* Phase-transition announcement: a transient center-screen banner (e.g.
     "COMBAT PHASE BEGUN"), faded in/out by JS setting the .show class. */
  #announcement {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; background: rgba(20,6,6,.9); border: 1px solid #ff5a5a;
    border-radius: 7px; color: #ffdede; font: bold 15px Consolas, monospace;
    letter-spacing: 1px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .3s ease; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #announcement.show { opacity: 1; }
  /* GUIDANCE PANEL — now the DYNAMIC, goal-driven CHECKLIST (Part A —
     CONCEPT.md's settled "Onboarding / tutorial concept" paragraph: "an
     ordered step list shown at the TOP of the screen"). Still an offered,
     dismissable path, NOT a gate — every other panel/control on this page
     works identically whether this is open or hidden (see the "First-run /
     tutorial is OPEN, not dictated" paragraph). Repositioned from its old
     bottom-left spot to top-center per the task's explicit placement;
     #phaseHud already owns the very top-center strip (top:10px) so this
     sits just below it rather than overlapping. */
  #guidancePanel {
    position: fixed; left: 50%; top: 66px; transform: translateX(-50%);
    width: 400px; max-width: calc(100% - 24px); max-height: 42vh; overflow-y: auto;
    padding: 10px 12px; background: rgba(8,14,26,.94); border: 1px solid #2f5f9c;
    border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
    color: #eaf2ff; font: 12px Consolas, monospace;
  }
  #guidancePanel.hidden { display: none; }
  #guidancePanel .gHeader { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  #guidancePanel .gHeader b { color: #6dffb0; font-size: 12px; }
  #guidancePanel button.gClose {
    background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff; border-radius: 5px;
    padding: 1px 9px; cursor: pointer; font: 13px Consolas, monospace; line-height: 1.4;
  }
  #guidancePanel button.gClose:hover { background: #1c3a5e; }
  /* GOALS row — one pill per player-selected goal (game/tutorialplan.js
     goalState, set by clicking a unit/category in the tree view, G). Empty
     (and collapses to nothing, margin-wise) until at least one goal exists. */
  #guidanceGoals:not(:empty) { margin-bottom: 6px; }
  #guidancePanel .goalTag {
    display: inline-block; padding: 2px 9px; margin: 0 5px 4px 0; border-radius: 10px;
    background: #12233a; border: 1px solid #2f5f9c; color: #bfe9ff; font-size: 11px;
  }
  /* a satisfied goal (its whole reverse-planned chain is complete — the
     "we're making jets now" payoff) reads green/filled, same success-green
     vocabulary as the tech tree's own 'built' state. */
  #guidancePanel .goalTag.done { background: #123b2a; border-color: #3fae76; color: #6dffb0; }
  #guidancePanel ol { margin: 0; padding-left: 18px; line-height: 1.55; color: #bfe9ff; }
  /* "done" reflects LIVE game state (game/tutorialplan.js's per-step
     satisfied check) — cosmetic only, never a gate, so it deliberately looks
     like a checked-off suggestion, not an unlocked step. */
  #guidancePanel li.done { color: #6dffb0; text-decoration: line-through; opacity: .7; }
  /* "next" — the current/next ACTIONABLE step (task's explicit highlight
     requirement): the first not-yet-satisfied step in the reverse-planned
     order, called out in amber so the player always has one obvious next
     move even with a long merged plan. */
  #guidancePanel li.next { color: #ffcf5c; font-weight: bold; }
  #guidancePanel li.hint { list-style: none; margin-left: -18px; color: #9fb6c4; font-style: italic; }
  #guidancePanel .gFootnote { margin-top: 7px; padding-top: 7px; border-top: 1px solid #234260; color: #9fb6c4; font-size: 10.5px; line-height: 1.4; }
  /* DIRECTOR CORNER BUBBLE (Part B — CONCEPT.md's settled "Corner
     commentator" direction, part 1, the mechanic: "an event-driven corner
     speech-bubble ... quips as designer-written placeholder text"). No
     character art (deferred, per that paragraph) — just the bubble itself,
     bottom-right so it never fights #guidancePanel (top-center) or
     #buildbar (bottom-center) for space. Transient: main.js toggles the
     .show class the same way #announcement's .show class already works. */
  #directorBubble {
    position: fixed; right: 16px; bottom: 16px; max-width: 300px;
    padding: 10px 13px; background: rgba(8,14,26,.94); border: 1px solid #5b7fe6;
    border-radius: 11px 11px 2px 11px; color: #eaf2ff; font: 12px Consolas, monospace;
    line-height: 1.45; opacity: 0; transform: translateY(6px);
    transition: opacity .25s ease, transform .25s ease; pointer-events: none;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); z-index: 300;
  }
  #directorBubble.show { opacity: 1; transform: translateY(0); }
  /* SILLY-MODE SELF-SABOTAGE GAG CHAIN — the "are you five" confirm dialog
     and the two terminal screens (task point 6). Both are full-screen modal
     overlays, above even the tech tree view (#techTreeCanvas z-index 500)
     since they're meant to be an unmissable, deliberate escalation, not one
     more panel. */
  #areYouFiveDialog {
    display: none; position: fixed; inset: 0; z-index: 2000;
    align-items: center; justify-content: center; background: rgba(2,4,8,.72);
  }
  #areYouFiveDialog.open { display: flex; }
  #areYouFiveDialog .modalPanel {
    background: #0e1c2f; border: 1px solid #2f5f9c; border-radius: 10px;
    padding: 24px 28px; max-width: 380px; color: #eaf2ff; font: 13px Consolas, monospace;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  #areYouFiveDialog .modalRow { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  #areYouFiveDialog button {
    background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff; border-radius: 6px;
    padding: 8px 22px; cursor: pointer; font: 13px Consolas, monospace;
  }
  #areYouFiveDialog button:hover { background: #1c3a5e; }
  /* Mock "too young to play"/"fired" terminal takeover — approximates "the
     game instantly closes" (a web page cannot force-close its own tab; see
     main.js's window.close() bonus-attempt comment) with a black-screen
     takeover instead, which works everywhere. */
  #takeoverScreen {
    display: none; position: fixed; inset: 0; z-index: 2100;
    background: #000; align-items: center; justify-content: center;
  }
  #takeoverScreen.open { display: flex; }
  /* Deliberately flat/deadpan — no glow, muted plain text — so the line reads
     nonchalant rather than dramatic (designer note: "make it more nonchalant"). */
  #takeoverText {
    color: #9aa4ad; font: 15px Consolas, monospace; white-space: pre-line;
    text-align: center; line-height: 1.9;
  }
  /* MAIN MENU (scenario picker — CONCEPT.md "Design directions raised" /
     "Main-menu map/scenario picker" bullet; game/menu.js owns the content +
     click wiring). Shown BEFORE the game boots by default, covering the
     canvas full-screen so nothing underneath is interactive until a pick is
     made — main.js's game-init code (renderer, spawns, the frame loop)
     doesn't run until showMainMenu()'s promise resolves. Hidden by default
     (no `open` class); a deep link (?seed=/?map=) skips it entirely, per
     the task's "preserve deep-linking" requirement. z-index sits above
     every other fixed panel in this file since it must occlude the whole
     game, not just the canvas underneath it. */
  #mainMenu {
    display: none; position: fixed; inset: 0; z-index: 1000;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0d1826 0%, #05080e 100%);
  }
  #mainMenu.open { display: flex; }
  #mainMenuPanel {
    width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
    padding: 28px 30px; background: rgba(8,14,26,.92); border: 1px solid #2f5f9c;
    border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    color: #eaf2ff; font: 13px Consolas, monospace;
  }
  #menuTitle { margin: 0 0 4px; font-size: 22px; letter-spacing: 1px; color: #6dffb0; }
  #menuSubtitle { margin: 0 0 20px; color: #9fb6c4; }
  #menuScenarioList { display: flex; flex-direction: column; gap: 10px; }
  .menuScenarioRow {
    display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
    width: 100%; text-align: left; cursor: pointer; padding: 10px 14px;
    background: #12233a; border: 1px solid #2f5f9c; border-radius: 7px;
    color: #eaf2ff; font: 13px Consolas, monospace;
  }
  .menuScenarioRow:hover { background: #1c3a5e; border-color: #5fd0ff; }
  .menuScenarioRow .msLabel { font-weight: bold; color: #eaf2ff; }
  .menuScenarioRow .msDiff { font-size: 11px; color: #ffcf5c; }
  .menuScenarioRow .msBlurb { font-size: 11px; color: #9fb6c4; }
  #menuHint { margin-top: 16px; padding-top: 12px; border-top: 1px solid #234260; color: #9fb6c4; font-size: 10.5px; }
  /* VICTORY/DEFEAT END SCREEN (Playability v1 — CONCEPT.md's settled
     "Playability v1" section: "The run ENDS. A victory/defeat screen
     resolves it — the thing a sandbox never does."). Same full-screen
     modal-overlay shape as #areYouFiveDialog/#takeoverScreen/#mainMenu,
     z-index above all of them since this is the one overlay that can never
     be dismissed by a game-state change underneath it (game/objectives.js's
     evaluateOutcome only ever fires once per run — see main.js's
     gameOutcome). Shown by main.js's showOutcomeScreen(), never by CSS
     alone. */
  #outcomeScreen {
    display: none; position: fixed; inset: 0; z-index: 2200;
    align-items: center; justify-content: center; background: rgba(2,4,8,.86);
  }
  #outcomeScreen.open { display: flex; }
  #outcomePanel {
    width: min(460px, 92vw); padding: 34px 36px; text-align: center;
    background: rgba(8,14,26,.96); border: 1px solid #2f5f9c; border-radius: 12px;
    box-shadow: 0 24px 70px rgba(0,0,0,.65); color: #eaf2ff; font: 13px Consolas, monospace;
  }
  #outcomeTitle { margin: 0 0 10px; font-size: 30px; letter-spacing: 2px; }
  #outcomeScreen.victory #outcomeTitle { color: #6dffb0; }
  #outcomeScreen.defeat #outcomeTitle { color: #ff5a5a; }
  #outcomeScreen.victory #outcomePanel { border-color: #3fae76; }
  #outcomeScreen.defeat #outcomePanel { border-color: #a34040; }
  #outcomeSubtitle { margin: 0 0 18px; color: #9fb6c4; line-height: 1.5; }
  #outcomeStats {
    margin: 0 0 24px; padding: 12px 14px; background: #0e1c2f; border: 1px solid #234260;
    border-radius: 8px; line-height: 1.7; text-align: left; color: #bfe9ff;
  }
  .outcomeButtons { display: flex; gap: 12px; justify-content: center; }
  #outcomeScreen button {
    background: #12233a; border: 1px solid #2f5f9c; color: #eaf2ff; border-radius: 6px;
    padding: 9px 20px; cursor: pointer; font: 13px Consolas, monospace;
  }
  #outcomeScreen button:hover { background: #1c3a5e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="techTreeCanvas"></canvas>
<!-- MAIN MENU overlay — see the #mainMenu CSS comment above. Content
     (title/subtitle/hint/scenario rows) is filled in and the click handling
     wired by game/menu.js's showMainMenu(), same "static skeleton in HTML,
     content+behavior from JS" split #guidancePanel below already uses. -->
<div id="mainMenu">
  <div id="mainMenuPanel">
    <h1 id="menuTitle"></h1>
    <p id="menuSubtitle"></p>
    <div id="menuScenarioList"></div>
    <p id="menuHint"></p>
  </div>
</div>
<div id="hud"></div>
<div id="phaseHud">
  <span id="phaseLabel">PREPARATION</span>
  <span id="phaseHint"></span>
  <button id="beginCombatBtn">BEGIN COMBAT</button>
</div>
<div id="announcement"></div>
<div id="econHud"></div>
<!-- OBJECTIVE HUD (Playability v1) — filled in by main.js's
     updateObjectiveHud() every frame; hidden outside COMBAT. -->
<div id="objectiveHud"></div>
<div id="card"></div>
<div id="buildbar"></div>
<div id="prodPanel">
  <b>Choose what to produce (P)</b>
  <div class="catRow" id="prodCatRow"></div>
  <div id="recipeInfo">Pick a category to see its recipe.</div>
</div>
<div id="importPanel">
  <b>Import resources — spend influence + a bit of IC (I)</b>
  <div class="resRow" id="importResRow"></div>
</div>
<!-- RESEARCH PANEL — P4 follow-up (game/research.js), styled to match
     #prodPanel/#importPanel above. Title text comes from RESEARCH_COPY
     (game/research.js); the tech rows themselves are built entirely in
     main.js's RESEARCH PANEL section (one .techRow per TECH_DEFS entry). -->
<div id="techPanel">
  <b id="techPanelTitle"></b>
  <div id="techList"></div>
</div>
<!-- GUIDANCE PANEL — the dynamic, goal-driven CHECKLIST (Part A). Open by
     default, dismissable (× or H), never gates anything (see main.js's
     GUIDANCE PANEL section for the full rationale and CONCEPT.md's settled
     "First-run / tutorial is OPEN, not dictated" paragraph). Content
     (title/goals/steps/footnote) is filled in by main.js from
     game/tutorialplan.js's TUTORIAL_COPY + the live computePlan() output —
     #guidanceGoals lists the player's selected goals (pills, ✓ once each
     one's whole reverse-planned chain is satisfied); #guidanceSteps is the
     single merged/ordered/deduped step list itself. -->
<div id="guidancePanel">
  <div class="gHeader">
    <b id="guidanceTitle"></b>
    <button id="guidanceCloseBtn" class="gClose" title="Dismiss (H to toggle)">×</button>
  </div>
  <div id="guidanceGoals"></div>
  <ol id="guidanceSteps"></ol>
  <div class="gFootnote" id="guidanceFootnote"></div>
</div>
<!-- DIRECTOR CORNER BUBBLE — Part B's reactive-line surface (off-track
     acknowledgement + the gag chain's "confused, replaced" line). Content
     set every frame from main.js's DIRECTOR section. -->
<div id="directorBubble"></div>
<!-- "ARE YOU FIVE" DIALOG — silly-mode self-sabotage gag chain, stage 2.
     Hidden until game/director.js's handleBuildingSold reports the pity-
     building itself was sold. -->
<div id="areYouFiveDialog">
  <div class="modalPanel">
    <p id="areYouFiveText"></p>
    <div class="modalRow">
      <button id="areYouFiveYes"></button>
      <button id="areYouFiveNo"></button>
    </div>
  </div>
</div>
<!-- TAKEOVER / FIRED SCREEN — gag chain stage 3. Text set per-outcome
     (TAKEOVER_LINES for "Yes", FIRED_LINES for "No") by main.js. -->
<div id="takeoverScreen">
  <div id="takeoverText"></div>
</div>
<!-- VICTORY/DEFEAT END SCREEN (Playability v1) — shown once by main.js's
     showOutcomeScreen() when game/objectives.js's evaluateOutcome fires.
     Title/subtitle/stats content filled in per-outcome; button labels come
     from main.js's COPY.OUTCOME_RESTART_BUTTON/OUTCOME_MENU_BUTTON. -->
<div id="outcomeScreen">
