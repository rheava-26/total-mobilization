# Rogue levy (Statigel) on a dummy, 20 tiles away, 40 s window: forced throw policy per arm.
#  spam    = never hold a throw for stealth (every throw drains the bar, so no strikes)
#  wait    = the pre-policy behaviour (hold up to 130 ticks for the bar, else throw)
#  patient = always wait for the full bar (up to 900 ticks), strike, repeat
name: rogue_screen2
mods: calamity
arena: a3
seeds: 3
tipsy:
  dist: [20]
  motion: [static]
  size: [small]
  warm: 300
  win: 2400
  every: {rg: 1}
  arms: {spam: {pol: spam}, wait: {pol: wait}}
  weapons:
    - {name: CalamityMod/SpentFuelContainer, cls: R}
    - {name: CalamityMod/Equanimity, cls: R}
    - {name: CalamityMod/GraveGrimreaver, cls: R}
