<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Levy Fight Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
/* Dark-only design: every colour is a token here (the canvases draw with the same palette as literals), the body background is explicit and color-scheme is dark. */
:root{color-scheme:dark;--bg:#05090b;--panel:#0b1317;--panel2:#0f1a1f;--line:#1c2e33;--line2:#15252a;--ink:#cfe3df;--dim:#7e9a96;--grn:#3cff9a;--cyan:#4fe3ff;--red:#ff4d4d;--amb:#ffb020;--vio:#c77dff;--proj:#ff9f2e;
  --btn:#12222a;--btn-h:#18313b;--btn-a:#1d3b47;--btn-on:#16403a;--btn-on-line:#2c7a64;--stage:#03070a;--strip:#04090b;--strip2:#060d10;--chip:#0a1418;--track:#1a2a2e;--tipbg:#06100f;--warn:#ffd37a;
  --won:#3cff9a;--lost:#ff6b6b;--fled:#ffb020;--ended:#9bb0ad;--intr:#c77dff;--crash:#ff4d4d;--cut:#ffd37a;--gutl:max(16px,env(safe-area-inset-left));--gutr:max(16px,env(safe-area-inset-right))}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
body.drag::after{content:"Drop recordings or a folder to load them";position:fixed;inset:8px;border:2px dashed var(--grn);border-radius:12px;background:#05090bcc;color:var(--grn);display:flex;align-items:center;justify-content:center;font-size:18px;z-index:50;pointer-events:none;text-align:center;padding:20px}
header{position:sticky;top:0;z-index:20;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding:8px var(--gutr) 8px var(--gutl);background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.02em;white-space:nowrap;color:var(--grn)}
header .meta{color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
button,select,label.btn{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer;min-height:34px}
button:hover,label.btn:hover{background:var(--btn-h)}
button:active{background:var(--btn-a)}
button.on{background:var(--btn-on);border-color:var(--btn-on-line)}
button.mini{min-height:26px;padding:2px 8px;font-size:12px}
input[type=file]{display:none}
#body{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;align-items:start}
body.solo #body{grid-template-columns:minmax(0,1fr)}
body.solo #list,body.solo #listBtn{display:none}
#list{position:sticky;top:51px;max-height:calc(100vh - 51px);overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 8px 8px var(--gutl)}
#list .lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 4px 8px}
#list h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0}
#loadMsg:not(:empty){margin:0 4px 8px}
.card{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;color:var(--ink)}
.card.sel{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn) inset}
.card.bad{opacity:.75}
.card b{display:block;font-size:14px;overflow-wrap:anywhere}
.card .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .sub{color:var(--dim);font-size:12px;margin-top:1px;overflow-wrap:anywhere}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bd{font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:var(--chip);font-variant-numeric:tabular-nums}
.bd.l{color:#ff9a9a;border-color:#5a2a2a}.bd.p{color:#8eeaff;border-color:#1f5560}.bd.h{color:#ffd37a;border-color:#5a4513}.bd.d{color:#ff6b6b;border-color:#6a2626}.bd.c{color:var(--cut);border-color:#6a5a26}
.res{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;flex:none}
.res.won{color:var(--won)}.res.lost{color:var(--lost)}.res.fled{color:var(--fled)}.res.ended,.res.unknown{color:var(--ended)}.res.interrupted{color:var(--intr)}.res.crashed,.res.cut{color:var(--crash)}
main{min-width:0}
#stage{position:relative;height:clamp(300px,60vh,700px);background:var(--stage);border-bottom:1px solid var(--line);overflow:hidden}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:8px;right:10px;pointer-events:none;font-size:12.5px;text-shadow:0 0 4px #000,0 0 2px #000;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
#hud .l{display:flex;flex-direction:column;gap:3px}
#hud .tgt{font-weight:650}
#hud .bar{width:150px;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;background:var(--red)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:16px;padding:20px 16px}
#tip{position:absolute;pointer-events:none;background:var(--tipbg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;white-space:pre;display:none;z-index:5;max-width:calc(100% - 20px);overflow:hidden}
#controls{padding:8px var(--gutr) 10px var(--gutl);background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#scrub{flex:1;min-width:140px;accent-color:var(--grn);height:28px}
#time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:104px;text-align:right}
canvas#strip,canvas#fpsStrip{width:100%;height:92px;display:block;background:var(--strip);border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:pointer}
canvas#fpsStrip{height:72px}
#fpsWrap{display:flex;flex-direction:column;gap:6px}
#fpsWrap[hidden]{display:none}
#fpsInfo{min-height:18px;overflow-wrap:anywhere}
.legend{display:flex;gap:12px;color:var(--dim);flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.sq{border-radius:1px}
#info{padding:12px var(--gutr) 40px var(--gutl);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
#info section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
#info h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
table{border-collapse:collapse;width:100%}
td,th{padding:3px 5px;text-align:right;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;font-size:13px;overflow-wrap:anywhere}
td:first-child,th:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
.small{color:var(--dim);font-size:12px}
.tbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--track);margin:6px 0}
.tbar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv span{overflow-wrap:anywhere}
.kv span:nth-child(odd){color:var(--dim)}
details summary{cursor:pointer;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.warn{color:var(--warn)}
.sumhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.sumhead .bn{font-size:18px;font-weight:650;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:8px 0}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.tile b{display:block;font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{color:var(--dim);font-size:11.5px}
.sumcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.mbar{display:block;height:6px;border-radius:3px;background:var(--cyan);min-width:1px}
.mbar.w{background:var(--amb)}
.cutbox{border:1px solid #6a5a26;background:#1a1606;color:var(--cut);border-radius:6px;padding:6px 10px;margin:6px 0;font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));max-width:calc(100% - 32px);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;z-index:60;display:none;font-size:13px}
@media (max-width:820px){
  #body{grid-template-columns:minmax(0,1fr)}
  #list{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:none;padding-right:var(--gutr)}
  body.showlist #list{display:block}
  #list .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px}
  .card{margin:0}
  #stage{height:clamp(260px,64vw,460px)}
  header .meta{display:none}
  #time{min-width:90px}
  canvas#strip{height:84px}
}
@media (min-width:821px){#listBtn{display:none}}
</style>
</head>
<body class="solo">
<header>
  <h1>LEVY FIGHT VIEWER</h1>
  <span class="meta" id="meta">no recording loaded</span>
  <button id="listBtn">Fights</button>
  <label class="btn" id="openLbl">Open files<input id="file" type="file" multiple accept=".levyrec,.gz,.jsonl,.json,.txt"></label>
  <label class="btn" id="dirLbl" title="load every recording in a folder">Pick folder<input id="dir" type="file" webkitdirectory multiple></label>
</header>
<div id="body">
  <nav id="list"><div class="lh"><h2 id="listTitle">Recorded fights</h2><button class="mini" id="clearBtn">Clear</button></div><div id="loadMsg" class="small"></div><div class="cards" id="cards"></div></nav>
  <main>
    <div id="stage"><canvas id="view"></canvas><div id="hud"></div><div id="empty">Drop Levy fight recordings (.levyrec, .jsonl.gz, .jsonl) or a whole folder here,<br>or use Open files / Pick folder.</div><div id="tip"></div></div>
    <div id="controls">
      <div class="row">
        <button id="play" style="min-width:76px">Play</button>
        <button id="prevEv" title="previous hit or death">&#9664; hit</button>
        <button id="nextEv" title="next hit or death">hit &#9654;</button>
        <label class="small">speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option><option value="8">8x</option></select></label>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="seek">
        <span id="time">0.00 / 0.00 s</span>
      </div>
      <canvas id="strip" aria-label="timeline"></canvas>
      <div id="fpsWrap" hidden>
        <canvas id="fpsStrip" aria-label="frames per second over time"></canvas>
        <div class="small" id="fpsInfo"></div>
        <div class="row" id="fpsWorst"></div>
      </div>
      <div class="row">
        <button id="fit" title="show the whole arena">Fit</button>
        <button id="followBoss" title="camera follows the boss">Follow boss</button>
        <button id="tBoss" class="on" title="fading trails behind boss parts">Boss trails</button><button id="tLevy" class="on" title="fading trails behind levies">Levy trails</button><button id="tProj" class="on" title="streaks behind projectiles">Proj trails</button><button id="hitBtn" class="on" title="draw the real hitbox rectangles">Hitboxes</button>
        <button id="labelBtn" title="levy numbers">Labels</button>
        <div class="legend"><span><i style="background:var(--grn)"></i>levy (colour = HP)</span><span><i style="background:var(--red)"></i>boss / part</span><span><i style="background:var(--cyan)"></i>commander</span><span><i style="background:var(--proj)"></i>projectile</span><span><i class="sq" style="background:var(--red)"></i>boxes = real hitboxes</span><span>flash = hit &middot; X = death</span></div>
      </div>
    </div>
    <div id="info"></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script id="gallery-data" type="application/json">/*__GALLERY__*/null</script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const TPS=60, TILE=16;
const SRC_COL={body:"#ff4d4d",minion:"#ffb020",proj:"#c77dff",other:"#8a97a8"};
let D=null, playing=false, cur=0, last=0, camMode="fit", trBoss=true, trLevy=true, trProj=true, showHit=true, showLabels=false;
const cam={x:0,y:0,z:0.2};
let blips=[], arenaCanvas=null, gallery=null, galleryIdx=-1;

// ================================================================ parsing
function parseRec(text){
  const R={sdef:new Map(),hdr:null,arena:null,frames:[],events:[],names:{items:{},npcs:{},projectiles:{},buffs:{},soldiers:{}},end:null};
  for(const line of text.split("\n")){
    const s=line.trim(); if(!s) continue;
    let o; try{o=JSON.parse(s);}catch(e){continue;}
    switch(o.k){case "hdr":R.hdr=o;break;case "arena":(R.arenas||(R.arenas=[])).push(o);if(!R.arena)R.arena=o;break;case "f":if(o.s){const o2=[];for(const q of o.s){if(q.length>=8){R.sdef.set(q[1],q);o2.push(q);}else{const d=R.sdef.get(q[0]);if(d)o2.push([d[0],q[0],q[1],q[2],d[4],d[5],d[6],d[7]]);}}o.s=o2;}R.frames.push(o);break;case "e":R.events.push(o);break;case "names":R.names=o;break;case "end":R.end=o;break;}
  }
  if(!R.frames.length) throw new Error("no frames in file");
  return R;
}
const tkOf=b=>b.length>14?b[14]:((b[12]>=0&&b[12]<255)?1:0);
function mainBoss(f){const bs=f.b||[];for(const b of bs) if(!b[13]) return b; return bs[0]||null;}
function build(R){
  R.v=(R.hdr&&R.hdr.format)||1;
  R.hasTarget=R.frames.some(f=>(f.b||[]).some(b=>b.length>14));
  R.tmin=R.frames[0].t; R.tmax=R.frames[R.frames.length-1].t;
  R.dt=R.frames.length>1?R.frames[1].t-R.frames[0].t:2;
  R.events.sort((a,b)=>a.t-b.t);
  // per-entity tracks (trails) and max life per levy
  R.trL=new Map(); R.trB=new Map(); R.maxL=new Map(); R.trP=[];
  for(const f of R.frames){
    R.trP.push([f.t,f.p[0],f.p[1]]);
    for(const l of (f.l||[])){let a=R.trL.get(l[0]);if(!a)R.trL.set(l[0],a=[]);a.push([f.t,l[1],l[2]]);R.maxL.set(l[0],Math.max(R.maxL.get(l[0])||0,l[10]||l[6]));}
    for(const b of (f.b||[])){const k=b[1];let a=R.trB.get(k);if(!a)R.trB.set(k,a=[]);a.push([f.t,b[2],b[3]]);}
  }
  R.lhit=R.events.filter(e=>e.e==="lhit"); R.ldeath=R.events.filter(e=>e.e==="ldeath");
  R.cmdHit=R.events.filter(e=>e.e==="hit");
  // levy display order: by first appearance, so labels are stable (L1, L2 ...)
  R.order=[...R.trL.keys()]; R.lbl=new Map(R.order.map((id,i)=>[id,"L"+(i+1)]));
  // target tally of the main boss
  const tl={none:0,player:0,levy:0}; R.band=[]; let pk=-1,ps=0;
  for(const f of R.frames){const b=mainBoss(f); if(!b) continue; const k=tkOf(b); tl[k===2?"levy":k===1?"player":"none"]++;
    if(k!==pk){if(pk>=0)R.band.push([ps,f.t,pk]);pk=k;ps=f.t;}}
  if(pk>=0)R.band.push([ps,R.tmax+R.dt,pk]); R.tally=tl;
  // arena images: format 4+ writes several arena records (the start area, then strips as the fight moves); draw them all
  R.arenaImgs=[]; R.arenaBox=null;
  for(const A of (R.arenas||[])){
    const c=document.createElement("canvas"); c.width=A.w; c.height=A.h; const g=c.getContext("2d"); const im=g.createImageData(A.w,A.h);
    const grid=A.rows.map(row=>{const o=[];for(let i=0;i+1<row.length;i+=2)for(let k=0;k<row[i+1];k++)o.push(row[i]);return o;});
    const put=(x,y,r,gg,b,a)=>{const o=(y*A.w+x)*4;im.data[o]=r;im.data[o+1]=gg;im.data[o+2]=b;im.data[o+3]=a;};
    for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++){
      const c0=(grid[y]&&grid[y][x])||0; if(!c0) continue;
      if(c0===1){const top=y===0||!grid[y-1][x]||grid[y-1][x]===3; if(top)put(x,y,52,150,110,255); else put(x,y,13,36,31,255);}
      else if(c0===2) put(x,y,60,130,110,255);
      else put(x,y,16,60,95,170);
    }
    g.putImageData(im,0,0); R.arenaImgs.push({img:c,A});
    const b=R.arenaBox||(R.arenaBox={x0:A.x0,y0:A.y0,x1:A.x0+A.w,y1:A.y0+A.h});
    b.x0=Math.min(b.x0,A.x0);b.y0=Math.min(b.y0,A.y0);b.x1=Math.max(b.x1,A.x0+A.w);b.y1=Math.max(b.y1,A.y0+A.h);
  }
  return R;
}
function summary(R){
  const t=R.tally,n=Math.max(1,t.none+t.player+t.levy);
  const dmg=R.lhit.reduce((a,e)=>a+e.dmg,0);
  const h=R.hdr||{},m=h.meta||{};
  return {boss:m.bossName||(h.boss||"?").replace(/_/g," "),dur:(R.tmax-R.tmin)/TPS,pl:100*t.levy/n,pp:100*t.player/n,pn:100*t.none/n,hits:R.lhit.length,dmg,deaths:R.ldeath.length,meta:m,v:R.v,hasT:R.hasTarget};
}

// ================================================================ loading
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const fmtT=ticks=>{const s=Math.max(0,Math.round(ticks/TPS));return Math.floor(s/60)+":"+pad2(s%60);};
const fmtDur=sec=>{const s=Math.max(0,Math.round(sec));return Math.floor(s/60)+":"+pad2(s%60);};
const fmtN=n=>n==null||isNaN(n)?"-":Math.round(n).toLocaleString("en-US");
const fmtDate=ms=>{if(ms==null)return "";const d=new Date(ms);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;};
const RES_LABEL={won:"won",lost:"lost",fled:"fled",ended:"ended",interrupted:"interrupted",crashed:"crashed",cut:"cut short",unknown:"unknown"};
const resLabel=r=>RES_LABEL[r]||String(r);
let toastT=null;
function toast(msg,ms){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display="none";},ms||6000);}

function setRec(R,name){
  D=build(R);
  if(!R.card) R.card=computeCard(R,name,null);
  const h=D.hdr||{},m=h.meta||{},c=R.card;
  $("meta").textContent=[name,c.boss,resLabel(c.result),m.arena,m.target,h.mode,"format "+D.v,c.cut?"CUT SHORT":null].filter(Boolean).join("  |  ");
  $("empty").style.display="none"; playing=false; $("play").textContent="Play";
  cur=D.tmin; camMode="fit"; $("followBoss").classList.remove("on"); fitView(); renderInfo(); setupFps(); drawStrip(); draw(); syncUI();
}
function load(text,name){ setRec(parseRec(text),name); }

// ---- reading one file: .levyrec / .jsonl.gz (gzip, sniffed by its magic bytes whatever the name) or plain .jsonl text
async function gunzipText(u8){
  if(typeof DecompressionStream!=="function") throw new Error("This browser has no DecompressionStream, so it cannot unzip .levyrec files. Use a current Chrome, Edge, Firefox or Safari.");
  const ds=new DecompressionStream("gzip"), w=ds.writable.getWriter(), dec=new TextDecoder("utf-8"), parts=[]; let err=null;
  w.closed.catch(()=>{});
  // read as far as the stream goes: a file cut short (crash, copied while the game still wrote) keeps everything up to its last flush
  const pump=(async()=>{const rd=ds.readable.getReader();try{for(;;){const x=await rd.read();if(x.done)break;parts.push(dec.decode(x.value,{stream:true}));}parts.push(dec.decode());}catch(e){err=e;}})();
  try{await w.write(u8);await w.close();}catch(e){err=err||e;}
  await pump;
  return {text:parts.join(""),err};
}
async function textFromBytes(u8){
  if(u8.length>1&&u8[0]===0x1f&&u8[1]===0x8b){const r=await gunzipText(u8);return {text:r.text,gz:true,gzErr:r.err?(r.err.message||String(r.err)):null};}
  return {text:new TextDecoder("utf-8").decode(u8),gz:false,gzErr:null};
}
function parseChecked(info){
  const R=parseRec(info.text); R.gz=info.gz; R.gzErr=info.gzErr;
  R.cut=!R.end; R.cutWhy=R.cut?(info.gzErr?"the gzip stream ends early: "+info.gzErr:"no end record"):"";
  return R;
}
async function readRecFile(file){
  const u8=new Uint8Array(await file.arrayBuffer());
  const info=await textFromBytes(u8);

// ---- what the file name says: 2026-11-14_20-05_Eye_of_Cthulhu_won.levyrec, rec_20261114_200500_Boss.levyrec, *_crashed.levyrec
function nameInfo(fn){
  let s=String(fn).split(/[\\/]/).pop().replace(/\.(levyrec|jsonl\.gz|jsonl|gz|json|txt)$/i,"");
  const o={crashed:false,result:null,date:null,boss:null}; let d;
  if(/_crashed(_\d+)?$/i.test(s)){o.crashed=true;s=s.replace(/_crashed(_\d+)?$/i,"");}
  s=s.replace(/_\d{1,2}$/,"");
  d=/_(won|lost|fled|ended|interrupted)$/i.exec(s); if(d){o.result=d[1].toLowerCase();s=s.slice(0,d.index);}
  if(d=/^(?:rec_)?(\d{4})-(\d\d)-(\d\d)_(\d\d)-(\d\d)(?:-(\d\d))?_(.+)$/.exec(s)){o.date=new Date(+d[1],+d[2]-1,+d[3],+d[4],+d[5],+(d[6]||0)).getTime();o.boss=d[7];}
  else if(d=/^(?:rec_)?(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)_(.+)$/.exec(s)){o.date=new Date(+d[1],+d[2]-1,+d[3],+d[4],+d[5],+d[6]).getTime();o.boss=d[7];}
  else o.boss=s;
  return o;
}

// ---- the per-fight numbers (summary card, list row, fps strip), from header + events + end record; works on cut files and older formats
function computeCard(R,name,mtime){
  const h=R.hdr||{},m=h.meta||{},e=R.end||null,fi=nameInfo(name||""),nz=R.names||{};
  const c={name:name||"",v:R.v||h.format||1,auto:h.auto|0,cut:!!R.cut,cutWhy:R.cutWhy||"",hasEnd:!!e};
  const bossHdr=h.boss&&h.boss!=="none"?String(h.boss).replace(/_/g," "):null;
  c.boss=(e&&e.bossName)||m.bossName||bossHdr||String(m.label||fi.boss||"Fight").replace(/_/g," ");
  c.when=h.date&&!isNaN(Date.parse(h.date))?Date.parse(h.date):(fi.date!=null?fi.date:(mtime!=null?mtime:null));
  let res=e&&e.result; if(!res&&e) res=e.outcome==="killed"?"won":e.outcome==="despawn"?"fled":"ended";
  if(!res) res=fi.crashed?"crashed":(R.cut?"cut":(fi.result||"unknown"));
  c.result=res;
  const first=R.frames[0].t,last=R.frames[R.frames.length-1].t;
  c.dur=e&&e.durationSec!=null?e.durationSec:(last-first)/TPS;
  const ids=new Set(); for(const f of R.frames) for(const l of (f.l||[])) ids.add(l[0]);
  let cd=0,ld=0,lh=0,all=0,boss=0,hasDmg=false; const cls=new Map(),own=new Map(),src=new Map(),prof=[];
  for(const x of R.events){
    if(x.e==="cdeath")cd++; else if(x.e==="ldeath")ld++; else if(x.e==="lhit")lh++; else if(x.e==="prof")prof.push(x);
    else if(x.e==="dmg"){hasDmg=true;for(const r of (x.d||[])){const [owner,klass,kind,typ,onBoss,dm,hits]=r;
      all+=dm; if(onBoss)boss+=dm;
      let a=cls.get(klass); if(!a)cls.set(klass,a={name:klass,dmg:0,hits:0,boss:0,add:0}); a.dmg+=dm;a.hits+=hits; if(onBoss)a.boss+=dm; else a.add+=dm;
      own.set(owner,(own.get(owner)||0)+dm);
      const k=owner+"|"+kind+"|"+typ+"|"+(onBoss?1:0); let s=src.get(k); if(!s)src.set(k,s={owner,kind,typ,onBoss:!!onBoss,dmg:0,hits:0}); s.dmg+=dm;s.hits+=hits;}}
  }
  c.cmdDeaths=e&&e.cmdDeaths!=null?e.cmdDeaths:cd;
  c.levyDeaths=e&&e.levyDeaths!=null?e.levyDeaths:ld;
  c.levyHits=e&&e.levyHits!=null?e.levyHits:lh;
  c.armyTotal=e&&e.armyTotal!=null?e.armyTotal:(h.army&&h.army.n!=null?h.army.n:ids.size);
  c.armyAlive=e&&e.armyAlive!=null?e.armyAlive:(R.frames[R.frames.length-1].l||[]).length;
  c.dmgAll=e&&e.dmgAll!=null?e.dmgAll:all; c.dmgBoss=e&&e.dmgBoss!=null?e.dmgBoss:boss;
  c.hasDmg=hasDmg;
  c.classes=[...cls.values()].sort((a,b)=>b.dmg-a.dmg);
  c.owners=[...own.entries()].sort((a,b)=>b[1]-a[1]);
  c.weapons=[...src.values()].sort((a,b)=>b.dmg-a.dmg).slice(0,10).map(s=>({...s,label:s.kind==="item"?((nz.items&&nz.items[s.typ])||("item "+s.typ)):((nz.projectiles&&nz.projectiles[s.typ])||("projectile "+s.typ))}));
  // profiler windows (a prof event is written when its window closes, t = the end; win = the window in real seconds)
  prof.sort((a,b)=>a.t-b.t); const P=[]; let prev=null;
  for(const x of prof){
    const ticks=Math.max(30,(x.ups||60)*(x.win||2)); let t0=(prev!=null&&x.t-prev<=ticks*3)?prev:x.t-ticks; t0=Math.max(0,t0);
    P.push({t0,t1:x.t,fps:+x.fps||0,ups:+x.ups||0,upd:+x.upd||0,npc:+x.npc||0,proj:+x.proj||0,draw:+x.draw||0,ai:+x.ai||0,gear:+x.gear||0,top:x.top||"",win:+x.win||0}); prev=x.t;
  }
  c.profWin=P;
  if(P.length){let tw=0,sw=0,mn=P[0],u30=0;for(const w of P){const d=Math.max(1,w.t1-w.t0);tw+=d;sw+=w.fps*d;if(w.fps<mn.fps)mn=w;if(w.fps<30)u30++;}
    c.prof={n:P.length,mean:sw/tw,min:mn.fps,minAt:mn.t0,under30:u30};}
  return c;
}

async function addFiles(items,skipped){

    const ent={id:++libSeq,kind:"file",key,name:file.name,path,size:file.size,file,card:null,err:null,when:null};
    try{const R=await readRecFile(file); ent.card=computeCard(R,file.name,file.lastModified); R.card=ent.card; ent.when=ent.card.when; cacheSet(ent.id,R); ok++; added.push(ent);}
    catch(e){ent.err=e.message||String(e); const fi=nameInfo(file.name); ent.when=fi.date!=null?fi.date:file.lastModified; bad++;}
    lib.push(ent);

  }

  if(!items.length) toast("No .levyrec, .jsonl.gz or .jsonl recordings found there.");

  renderList();

}

  for(const e of D.ldeath){ if(e.t>cur) continue; const [sx,sy]=sc(e.x,e.y),age=(cur-e.t)/TPS,al=age<4?1:0.45,s=9*dpr*(age<0.4?1+(0.4-age)*2:1);
    g.strokeStyle="#ff3030";g.globalAlpha=al;g.lineWidth=3*dpr;g.beginPath();g.moveTo(sx-s,sy-s);g.lineTo(sx+s,sy+s);g.moveTo(sx+s,sy-s);g.lineTo(sx-s,sy+s);g.stroke();
    if(showLabels){g.fillStyle="#ff9a9a";g.font=`${10*dpr}px system-ui`;g.fillText((D.lbl.get(e.id)||"#"+e.id)+" fell",sx+s+2*dpr,sy);} g.globalAlpha=1;}
  // commander
  {const [sx,sy]=sc(P[0],P[1]),r=7*dpr,fl=f0.p[5];
    if(showHit){g.strokeStyle="rgba(79,227,255,.7)";g.lineWidth=1.2*dpr;g.strokeRect(sx-10*cam.z*dpr,sy-21*cam.z*dpr,20*cam.z*dpr,42*cam.z*dpr);}
    g.fillStyle="#4fe3ff";g.strokeStyle="#021";g.lineWidth=1*dpr;g.beginPath();g.moveTo(sx,sy-r);g.lineTo(sx+r*.9,sy+r*.8);g.lineTo(sx-r*.9,sy+r*.8);g.closePath();g.fill();g.stroke();
    g.fillStyle="#a8f0ff";g.font=`${10*dpr}px system-ui`;g.fillText("CMD",sx+r+3*dpr,sy+4*dpr);
    if(fl&2048){g.strokeStyle="#41e0e0";g.lineWidth=2*dpr;g.beginPath();g.arc(sx,sy,14*dpr,0,6.2832);g.stroke();}
    if(fl&8){const [hx,hy]=sc(f0.p[13],f0.p[14]);g.strokeStyle="#f2d94a";g.lineWidth=1.5*dpr;g.beginPath();g.moveTo(sx,sy);g.lineTo(hx,hy);g.stroke();}
    blips.push({x:sx/dpr,y:sy/dpr,r:12,info:`COMMANDER  life ${f0.p[6]}  mana ${f0.p[7]}\nheld ${f0.p[11]?nm("items",f0.p[11]):"-"}`});}
  // scale bar
  g.fillStyle="#7e9a96";g.font=`${11*dpr}px system-ui`;const bw=10*TILE*cam.z;g.fillRect(12*dpr,H-16*dpr,bw,2*dpr);g.fillText("10 tiles",12*dpr,H-22*dpr);
  renderParts(f0);
  // HUD
  const alive=(f0.l||[]).length, bossHp=mb0?`${nm("npcs",mb0[0])}  ${(100*mb0[6]/Math.max(1,mb0[7])).toFixed(0)}%`:"";
  const tcol=tgtText.startsWith("levy")?"#ff7b7b":tgtText==="commander"?"#6fe9ff":"#9bb0ad";
  $("hud").innerHTML=`<div class="l"><div class="tgt" style="color:${tcol}">boss target: ${esc(tgtText)}</div>${mb0?`<div>${esc(bossHp)}</div><div class="bar"><i style="width:${(100*mb0[6]/Math.max(1,mb0[7])).toFixed(1)}%"></i></div>`:""}</div><div style="text-align:right">levies in view ${alive}<br>${((cur-D.tmin)/TPS).toFixed(1)} s</div>`;
}

// ================================================================ timeline strip
function stripRows(){return [["target",16],["hits",30],["deaths",14],["cmd hit",10],["cmd moves",14]];}
function drawStrip(){
  const c=$("strip"); const {w:W,h:H,dpr}=canvasSize(c); const g=c.getContext("2d"); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); if(!D) return;
  const rows=stripRows(), tot=rows.reduce((a,r)=>a+r[1],0), k=H/tot, span=Math.max(1,D.tmax-D.tmin), X=t=>(t-D.tmin)/span*(W-2)+1;
  let y=0; const Y={};
  rows.forEach((r,i)=>{Y[r[0]]=[y,r[1]*k];g.fillStyle=i%2?"#060d10":"#04090b";g.fillRect(0,y,W,r[1]*k);g.fillStyle="#4d6663";g.font=`${9*dpr}px system-ui`;g.fillText(r[0],3*dpr,y+9*dpr);y+=r[1]*k;});
  // boss target band
  {const [y0,h]=Y.target; const col=["#2a3a3e","#2aa7c4","#e0483f"]; if(D.hasTarget) for(const s of D.band){g.fillStyle=col[s[2]];g.fillRect(X(s[0]),y0+h*0.3,Math.max(1,X(s[1])-X(s[0])),h*0.65);} else {g.fillStyle="#2a3a3e";g.fillRect(0,y0+h*.3,W,h*.65);}}
  // levy hits: stem height by damage share of 40% of a levy's life; colour by source
  {const [y0,h]=Y.hits; for(const e of D.lhit){const fr=Math.min(1,0.25+e.dmg/Math.max(60,e.dmg*1.0+e.life)*1.5);g.fillStyle=SRC_COL[e.src]||"#fff";const x=X(e.t);g.fillRect(x-1*dpr,y0+h-fr*h*0.92,2*dpr,fr*h*0.92);}}
  {const [y0,h]=Y.deaths; g.strokeStyle="#ff3030";g.lineWidth=2*dpr;for(const e of D.ldeath){const x=X(e.t),s=Math.min(6*dpr,h*0.4),cy=y0+h/2;g.beginPath();g.moveTo(x-s,cy-s);g.lineTo(x+s,cy+s);g.moveTo(x+s,cy-s);g.lineTo(x-s,cy+s);g.stroke();}}
  {const [y0,h]=Y["cmd hit"]; g.fillStyle="#4fe3ff";for(const e of D.cmdHit)g.fillRect(X(e.t)-1,y0+2,2*dpr,h-3);}
  {const [y0,h]=Y["cmd moves"]; const cl={jump:"#3cff9a",xjump:"#b6ff5a",dash:"#41e0e0",hook:"#f2d94a",fly:"#c77dff"}; for(const e of D.events){const col=cl[e.e];if(!col)continue;if(e.e==="fly"&&!e.on)continue;if(e.e==="hook"&&e.phase!=="launch")continue;g.fillStyle=col;g.fillRect(X(e.t)-1,y0+3,2*dpr,h-5);}}
  const x=X(cur);g.fillStyle="#fff";g.fillRect(x-1*dpr,0,2*dpr,H);
  drawFps();
}
function seekStrip(e){if(!D)return;const r=$("strip").getBoundingClientRect();const u=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));cur=D.tmin+u*(D.tmax-D.tmin);syncUI();draw();drawStrip();}
let stripDrag=false;
$("strip").addEventListener("pointerdown",e=>{stripDrag=true;$("strip").setPointerCapture(e.pointerId);seekStrip(e);});
$("strip").addEventListener("pointermove",e=>{
  if(stripDrag){seekStrip(e);return;}
  if(!D)return;const r=$("strip").getBoundingClientRect();const t=D.tmin+(e.clientX-r.left)/r.width*(D.tmax-D.tmin);
  let best=null,bd=1e9;for(const ev of D.events){if(ev.e!=="lhit"&&ev.e!=="ldeath"&&ev.e!=="hit")continue;const d=Math.abs(ev.t-t);if(d<bd){bd=d;best=ev;}}
  const tip=$("tip");if(best&&bd<(D.tmax-D.tmin)/r.width*8){tip.style.display="block";tip.textContent=describeEvent(best);tip.style.left="10px";tip.style.top="44px";}else tip.style.display="none";});
$("strip").addEventListener("pointerup",()=>stripDrag=false);
$("strip").addEventListener("pointercancel",()=>stripDrag=false);
$("strip").addEventListener("pointerleave",()=>{if(!stripDrag)$("tip").style.display="none";});
function describeEvent(e){
  const s=`${(e.t/TPS).toFixed(1)} s  `;
  if(e.e==="lhit")return s+`${D.lbl.get(e.id)||"#"+e.id} took ${e.dmg} (${e.src}${e.npc>0?" from "+nm("npcs",e.npc):""}${e.proj>0?", "+nm("projectiles",e.proj):""}) -> ${e.life} left${e.kill?"  FATAL":""}`;
  if(e.e==="ldeath")return s+`${D.lbl.get(e.id)||"#"+e.id} died (${e.by}${e.npc>0?" "+nm("npcs",e.npc):""})`;
  if(e.e==="hit")return s+`commander took ${e.dmg} from ${e.npc>=0?nm("npcs",e.npc):e.proj>0?nm("projectiles",e.proj):"other"}`;
  return s+e.e;
}
function jumpEvent(dir){
  if(!D)return; const evs=D.events.filter(e=>e.e==="lhit"||e.e==="ldeath"||e.e==="hit"); if(!evs.length)return;
  let t=null; if(dir>0){for(const e of evs) if(e.t>cur+3){t=e.t;break;}} else {for(let i=evs.length-1;i>=0;i--) if(evs[i].t<cur-3){t=evs[i].t;break;}}
  if(t==null)return; cur=Math.max(D.tmin,t-12); syncUI();draw();drawStrip();
}

// ================================================================ info panel
const f1=v=>v==null||isNaN(v)?"-":v.toFixed(1);
function renderInfo(){
  const s=summary(D),m=(D.hdr&&D.hdr.meta)||{},h=D.hdr||{},e=D.end||{};
  const mb=D.frames.map(mainBoss).filter(Boolean); const hp0=mb.length?mb[0][6]/Math.max(1,mb[0][7]):0, hp1=mb.length?mb[mb.length-1][6]/Math.max(1,mb[mb.length-1][7]):0;
  const t=D.tally,n=Math.max(1,t.none+t.player+t.levy);
  let h1=`<section><h2>Fight</h2><div class="kv"><span>boss</span><span>${esc(s.boss)}</span>`+
    ["harness","arena","seed","mode","target","order","gear","cfg"].filter(k=>m[k]!=null).map(k=>`<span>${k}</span><span>${esc(m[k])}</span>`).join("")+
    `<span>game mode</span><span>${esc(h.mode||"?")}</span><span>duration</span><span>${s.dur.toFixed(1)} s (${D.frames.length} samples, ${(TPS/D.dt).toFixed(0)} Hz)</span>`+
    `<span>boss life</span><span>${(hp0*100).toFixed(0)}% to ${(hp1*100).toFixed(0)}%</span><span>ended</span><span>${esc(e.reason||"?")}</span><span>file format</span><span>${D.v}</span></div></section>`;
  // targeting
  let h2=`<section><h2>Who the boss went for</h2>`;
  if(D.hasTarget){
    h2+=`<div class="tbar"><i style="width:${100*t.levy/n}%;background:#e0483f" title="levy"></i><i style="width:${100*t.player/n}%;background:#2aa7c4" title="commander"></i><i style="width:${100*t.none/n}%;background:#33474b" title="nobody"></i></div>`+
      `<table><tr><td><span style="color:#ff7b7b">levy</span></td><td>${(100*t.levy/n).toFixed(1)}%</td></tr><tr><td><span style="color:#6fe9ff">commander</span></td><td>${(100*t.player/n).toFixed(1)}%</td></tr><tr><td>nobody</td><td>${(100*t.none/n).toFixed(1)}%</td></tr></table>`+
      `<div class="small" style="margin-top:6px">Share of samples where the main boss was aimed at each. Levy = its targeting lock, a native NPC target or a boss-rule spite dash.</div>`;
  } else h2+=`<div class="small warn">This file is format 1: it has no levy targeting data. Only the commander-or-nothing split is visible: commander ${(100*t.player/n).toFixed(0)}%, nobody ${(100*t.none/n).toFixed(0)}%.</div>`;
  h2+="</section>";
  // hits
  const by={body:[0,0],minion:[0,0],proj:[0,0],other:[0,0]}; for(const x of D.lhit){const b=by[x.src]||(by[x.src]=[0,0]);b[0]++;b[1]+=x.dmg;}
  const per=new Map(); for(const id of D.order) per.set(id,{id,hits:0,dmg:0,min:1e9,died:null,by:""});
  for(const x of D.lhit){const p=per.get(x.id)||(per.set(x.id,{id:x.id,hits:0,dmg:0,min:1e9,died:null,by:""}),per.get(x.id));p.hits++;p.dmg+=x.dmg;p.min=Math.min(p.min,x.life);}
  for(const x of D.ldeath){const p=per.get(x.id);if(p){p.died=x.t;p.by=x.npc>0?nm("npcs",x.npc):x.by;}}
  let h3=`<section><h2>Levy hits and deaths</h2><div class="kv"><span>levies seen</span><span>${D.order.length}</span><span>hits taken</span><span>${D.lhit.length} (${D.lhit.reduce((a,x)=>a+x.dmg,0)} damage)</span><span>deaths</span><span>${D.ldeath.length}</span></div>`;
  if(!D.lhit.length&&D.v<2) h3+=`<div class="small warn" style="margin-top:6px">Format 1 files carry no levy hit or death events.</div>`;
  else{
    h3+=`<table style="margin-top:8px"><tr><th>source</th><th>hits</th><th>damage</th></tr>`+Object.entries(by).filter(([k,v])=>v[0]).map(([k,v])=>`<tr><td><span style="color:${SRC_COL[k]}">${{body:"boss body part",minion:"minion contact",proj:"projectile",other:"other"}[k]||k}</span></td><td>${v[0]}</td><td>${v[1]}</td></tr>`).join("")+`</table>`;
    h3+=`<table style="margin-top:8px"><tr><th>levy</th><th>hits</th><th>dmg</th><th>fell</th></tr>`+[...per.values()].map(p=>`<tr><td>${esc(lname(p.id))}</td><td>${p.hits}</td><td>${p.dmg}</td><td>${p.died!=null?(p.died/TPS).toFixed(0)+" s ("+esc(p.by)+")":"-"}</td></tr>`).join("")+`</table>`;
  }
  h3+="</section>";
  // commander movement (the original stats)
  const S=computeStats();
  let h4=`<section><details><summary>Commander and levy movement</summary><table style="margin-top:8px"><tr><th></th><th>commander</th><th>levies</th></tr>`+
    [["airborne %","air"],["standing still %","still"],["avg speed (tiles/s)","avg"],["max speed (tiles/s)","max"],["avg distance to boss (tiles)","dist"],["closest to boss (tiles)","distMin"]].map(([l,k])=>`<tr><td>${l}</td><td>${f1(S.ps&&S.ps[k])}</td><td>${f1(S.ls&&S.ls[k])}</td></tr>`).join("")+`</table>`+
    `<div class="small" style="margin-top:6px">Commander actions: ${["jump","xjump","dash","hook","use","hit"].map(k=>k+" "+S.ev[k]).join(", ")}</div></details></section>`;
  $("info").innerHTML=sumCard()+`<section style="grid-column:1/-1"><h2>Boss parts now (life and ai[0..3] from the game)</h2><div style="max-height:220px;overflow:auto"><table id="parts"></table></div><div class="small" style="margin-top:6px">ai values are the NPC's own ai[] slots: they show which attack or phase each part is in. Hover or tap a part on the radar for the same numbers.</div></section>`+h1+h2+h3+h4; partsAt=-1;
}
function summarizeMove(samples,dt){
  const n=samples.length; if(!n) return null; let air=0,still=0,sp=0,mx=0,dsum=0,dn=0,dmin=1e9;
  for(const s of samples){const v=Math.hypot(s.vx,s.vy);sp+=v;mx=Math.max(mx,v);if(!s.grounded)air++;if(v<0.3)still++;if(s.d!=null){dsum+=s.d;dn++;dmin=Math.min(dmin,s.d);}}
  return {air:100*air/n,still:100*still/n,avg:sp/n*60/16,max:mx*60/16,dist:dn?dsum/dn/16:null,distMin:dn?dmin/16:null};
}
function computeStats(){
  const P=[],L=new Map();
  for(const f of D.frames){const b=mainBoss(f),p=f.p;
    P.push({vx:p[2],vy:p[3],grounded:!!(p[5]&1),d:b?Math.hypot(p[0]-b[2],p[1]-b[3]):null});
    for(const l of (f.l||[])){let a=L.get(l[0]);if(!a)L.set(l[0],a=[]);a.push({vx:l[3],vy:l[4],grounded:!!(l[5]&1),d:b?Math.hypot(l[1]-b[2],l[2]-b[3]):null});}}
  const per=[...L.values()].map(s=>summarizeMove(s)).filter(Boolean); const avg=k=>per.length?per.reduce((a,x)=>a+(x[k]||0),0)/per.length:null;
  const ls=per.length?{air:avg("air"),still:avg("still"),avg:avg("avg"),max:avg("max"),dist:avg("dist"),distMin:avg("distMin")}:null;
  const ev={jump:0,xjump:0,dash:0,hook:0,use:0,hit:0}; for(const e of D.events){if(e.e==="hook"&&e.phase!=="launch")continue;if(e.e in ev)ev[e.e]++;}
  return {ps:summarizeMove(P),ls,ev};
}

// ================================================================ controls
function syncUI(){
  if(!D)return; const span=D.tmax-D.tmin||1; $("scrub").value=Math.round((cur-D.tmin)/span*1000);
  $("time").textContent=`${((cur-D.tmin)/TPS).toFixed(1)} / ${(span/TPS).toFixed(1)} s`;
}
function setPlaying(v){playing=v;$("play").textContent=v?"Pause":"Play";last=performance.now();}
$("play").onclick=()=>{if(D){if(!playing&&cur>=D.tmax)cur=D.tmin;setPlaying(!playing);}};
$("scrub").oninput=e=>{if(!D)return;cur=D.tmin+e.target.value/1000*(D.tmax-D.tmin);draw();drawStrip();syncUI();};
$("fit").onclick=()=>{if(D){camMode="fit";$("followBoss").classList.remove("on");fitView();draw();}};
$("followBoss").onclick=()=>{if(!D)return;camMode=camMode==="boss"?"free":"boss";$("followBoss").classList.toggle("on",camMode==="boss");if(camMode==="boss"&&cam.z<0.25)cam.z=0.3;draw();};
const tog=(id,get,set)=>{$(id).onclick=()=>{set(!get());$(id).classList.toggle("on",get());draw();};};
tog("tBoss",()=>trBoss,v=>trBoss=v);tog("tLevy",()=>trLevy,v=>trLevy=v);tog("tProj",()=>trProj,v=>trProj=v);tog("hitBtn",()=>showHit,v=>showHit=v);
$("labelBtn").onclick=()=>{showLabels=!showLabels;$("labelBtn").classList.toggle("on",showLabels);draw();};
$("prevEv").onclick=()=>jumpEvent(-1); $("nextEv").onclick=()=>jumpEvent(1);
window.addEventListener("keydown",e=>{const tg=e.target.tagName;if(tg==="SELECT"||tg==="INPUT"&&e.target.type!=="range")return;
  if(e.code==="Space"){e.preventDefault();$("play").click();}
  if(D&&e.code==="ArrowRight"){cur=Math.min(D.tmax,cur+D.dt*3);draw();drawStrip();syncUI();} if(D&&e.code==="ArrowLeft"){cur=Math.max(D.tmin,cur-D.dt*3);draw();drawStrip();syncUI();}});
// pan / pinch / wheel on the radar
const view=$("view"); const ptrs=new Map(); let pinch=null;
view.addEventListener("pointerdown",e=>{view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});view.style.cursor="grabbing";
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};}});
view.addEventListener("pointermove",e=>{
  const r=view.getBoundingClientRect();
  if(ptrs.has(e.pointerId)&&D){
    const p=ptrs.get(e.pointerId);
    if(ptrs.size===1){cam.x-=(e.clientX-p.x)/cam.z;cam.y-=(e.clientY-p.y)/cam.z;if(camMode==="boss"){camMode="free";$("followBoss").classList.remove("on");}}
    p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.z=Math.max(0.03,Math.min(6,pinch.z*d/pinch.d));}
    draw();return;
  }
  const mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;
  for(const b of blips){const d=Math.hypot(b.x-mx,b.y-my);if(d<b.r&&d<bd){bd=d;best=b;}}
  const tip=$("tip");if(best&&e.pointerType==="mouse"){tip.style.display="block";tip.textContent=best.info;tip.style.left=Math.min(mx+14,r.width-250)+"px";tip.style.top=Math.min(my+14,r.height-90)+"px";}else tip.style.display="none";
});
let tapStart=null;
view.addEventListener("pointerdown",e=>{tapStart={x:e.clientX,y:e.clientY};});
view.addEventListener("pointerup",e=>{if(!tapStart||e.pointerType==="mouse")return;if(Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>6)return;
  const r=view.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;for(const b of blips){const d=Math.hypot(b.x-mx,b.y-my);if(d<b.r+8&&d<bd){bd=d;best=b;}}
  const tip=$("tip");if(best){tip.style.display="block";tip.textContent=best.info;tip.style.left=Math.max(4,Math.min(mx+10,r.width-230))+"px";tip.style.top=Math.max(4,Math.min(my+10,r.height-110))+"px";}else tip.style.display="none";});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)view.style.cursor="grab";};
view.addEventListener("pointerup",endPtr);view.addEventListener("pointercancel",endPtr);
view.addEventListener("pointerleave",()=>{$("tip").style.display="none";});
view.addEventListener("wheel",e=>{if(!D)return;e.preventDefault();const r=view.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const mx=(e.clientX-r.left)*dpr-view.width/2,my=(e.clientY-r.top)*dpr-view.height/2;const wx=cam.x+mx/cam.z,wy=cam.y+my/cam.z;
  cam.z*=e.deltaY<0?1.15:1/1.15;cam.z=Math.max(0.03,Math.min(6,cam.z));cam.x=wx-mx/cam.z;cam.y=wy-my/cam.z;draw();},{passive:false});
let rsz=null;window.addEventListener("resize",()=>{if(!D)return;clearTimeout(rsz);rsz=setTimeout(()=>{if(camMode==="fit")fitView();draw();drawStrip();},60);});
function frameLoop(now){
  if(playing&&D){const dt=Math.min(0.1,(now-last)/1000);last=now;cur+=dt*TPS*parseFloat($("speed").value);if(cur>=D.tmax){cur=D.tmax;setPlaying(false);}syncUI();draw();drawStrip();}
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
window.__loadText=load; window.__state=()=>({D,cur,gallery,galleryIdx,lib,FP,FPW}); window.__idle=()=>busy; window.__walk=walkEntry;
window.__seek=t=>{cur=t;syncUI();draw();drawStrip();};
initGallery();
</script>
