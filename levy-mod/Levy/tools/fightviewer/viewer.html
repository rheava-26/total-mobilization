<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Levy Fight Replay</title>
<style>
:root{--bg:#05090b;--panel:#0b1317;--panel2:#0f1a1f;--line:#1c2e33;--ink:#cfe3df;--dim:#7e9a96;--grn:#3cff9a;--cyan:#4fe3ff;--red:#ff4d4d;--amb:#ffb020;--vio:#c77dff;--proj:#ff9f2e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.02em;white-space:nowrap;color:var(--grn)}
header .meta{color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
button,select,label.btn{background:#12222a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer;min-height:34px}
button:hover,label.btn:hover{background:#18313b}
button:active{background:#1d3b47}
button.on{background:#16403a;border-color:#2c7a64}
input[type=file]{display:none}
#body{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;align-items:start}
body.solo #body{grid-template-columns:minmax(0,1fr)}
body.solo #list,body.solo #listBtn{display:none}
#list{position:sticky;top:51px;max-height:calc(100vh - 51px);overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px}
#list h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:6px 4px 8px}
.card{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;color:var(--ink)}
.card.sel{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn) inset}
.card b{display:block;font-size:14px}
.card .sub{color:var(--dim);font-size:12px;margin-top:1px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bd{font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:#0a1418;font-variant-numeric:tabular-nums}
.bd.l{color:#ff9a9a;border-color:#5a2a2a}.bd.p{color:#8eeaff;border-color:#1f5560}.bd.h{color:#ffd37a;border-color:#5a4513}.bd.d{color:#ff6b6b;border-color:#6a2626}
main{min-width:0}
#stage{position:relative;height:clamp(300px,60vh,700px);background:#03070a;border-bottom:1px solid var(--line);overflow:hidden}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:8px;right:10px;pointer-events:none;font-size:12.5px;text-shadow:0 0 4px #000,0 0 2px #000;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
#hud .l{display:flex;flex-direction:column;gap:3px}
#hud .tgt{font-weight:650}
#hud .bar{width:150px;height:6px;background:#1a2a2e;border-radius:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;background:var(--red)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:16px;padding:20px}
#tip{position:absolute;pointer-events:none;background:#06100fee;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;white-space:pre;display:none;z-index:5}
#controls{padding:8px 12px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#scrub{flex:1;min-width:140px;accent-color:var(--grn);height:28px}
#time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:104px;text-align:right}
canvas#strip{width:100%;height:92px;display:block;background:#04090b;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:pointer}
.legend{display:flex;gap:12px;color:var(--dim);flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.sq{border-radius:1px}
#info{padding:12px 14px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
#info section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
#info h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
table{border-collapse:collapse;width:100%}
td,th{padding:3px 5px;text-align:right;border-bottom:1px solid #15252a;font-variant-numeric:tabular-nums;font-size:13px}
td:first-child,th:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
.small{color:var(--dim);font-size:12px}
.tbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:#1a2a2e;margin:6px 0}
.tbar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim)}
details summary{cursor:pointer;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.warn{color:#ffd37a}
@media (max-width:820px){
  #body{grid-template-columns:minmax(0,1fr)}
  #list{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:none}
  body.showlist #list{display:block}
  #list .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .card{margin:0}
  #stage{height:clamp(260px,64vw,460px)}
  header{padding:7px 10px}
  header .meta{display:none}
  #time{min-width:90px}
  canvas#strip{height:84px}
}
@media (min-width:821px){#listBtn{display:none}}
</style>
</head>
<body class="solo">
<header>
  <h1>LEVY FIGHT REPLAY</h1>
  <span class="meta" id="meta">no recording loaded</span>
  <button id="listBtn">Fights</button>
  <label class="btn" id="openLbl">Open file<input id="file" type="file" accept=".jsonl,.json,.txt"></label>
</header>
<div id="body">
  <nav id="list"><h2>Recorded fights</h2><div class="cards" id="cards"></div></nav>
  <main>
    <div id="stage"><canvas id="view"></canvas><div id="hud"></div><div id="empty">Drop a Levy fight recording (.jsonl) here,<br>or use Open file.</div><div id="tip"></div></div>
    <div id="controls">
      <div class="row">
        <button id="play" style="min-width:76px">Play</button>
        <button id="prevEv" title="previous hit or death">&#9664; hit</button>
        <button id="nextEv" title="next hit or death">hit &#9654;</button>
        <label class="small">speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option><option value="8">8x</option></select></label>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="seek">
        <span id="time">0.00 / 0.00 s</span>
      </div>
      <canvas id="strip" aria-label="timeline"></canvas>
      <div class="row">
        <button id="fit" title="show the whole arena">Fit</button>
        <button id="followBoss" title="camera follows the boss">Follow boss</button>
        <button id="tBoss" class="on" title="fading trails behind boss parts">Boss trails</button><button id="tLevy" class="on" title="fading trails behind levies">Levy trails</button><button id="tProj" class="on" title="streaks behind projectiles">Proj trails</button><button id="hitBtn" class="on" title="draw the real hitbox rectangles">Hitboxes</button>
        <button id="labelBtn" title="levy numbers">Labels</button>
        <div class="legend"><span><i style="background:var(--grn)"></i>levy (colour = HP)</span><span><i style="background:var(--red)"></i>boss / part</span><span><i style="background:var(--cyan)"></i>commander</span><span><i style="background:var(--proj)"></i>projectile</span><span><i class="sq" style="background:var(--red)"></i>boxes = real hitboxes</span><span>flash = hit &middot; X = death</span></div>
      </div>
    </div>
    <div id="info"></div>
  </main>
</div>
<script id="gallery-data" type="application/json">/*__GALLERY__*/null</script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const TPS=60, TILE=16;
const SRC_COL={body:"#ff4d4d",minion:"#ffb020",proj:"#c77dff",other:"#8a97a8"};
let D=null, playing=false, cur=0, last=0, camMode="fit", trBoss=true, trLevy=true, trProj=true, showHit=true, showLabels=false;
const cam={x:0,y:0,z:0.2};
let blips=[], arenaCanvas=null, gallery=null, galleryIdx=-1;

// ================================================================ parsing
function parseRec(text){
  const R={hdr:null,arena:null,frames:[],events:[],names:{items:{},npcs:{},projectiles:{},buffs:{},soldiers:{}},end:null};
  for(const line of text.split("\n")){
    const s=line.trim(); if(!s) continue;
    let o; try{o=JSON.parse(s);}catch(e){continue;}
    switch(o.k){case "hdr":R.hdr=o;break;case "arena":R.arena=o;break;case "f":R.frames.push(o);break;case "e":R.events.push(o);break;case "names":R.names=o;break;case "end":R.end=o;break;}
  }
  if(!R.frames.length) throw new Error("no frames in file");
  return R;
}
const tkOf=b=>b.length>14?b[14]:((b[12]>=0&&b[12]<255)?1:0);
function mainBoss(f){const bs=f.b||[];for(const b of bs) if(!b[13]) return b; return bs[0]||null;}
function build(R){
  R.v=(R.hdr&&R.hdr.format)||1;
  R.hasTarget=R.frames.some(f=>(f.b||[]).some(b=>b.length>14));
  R.tmin=R.frames[0].t; R.tmax=R.frames[R.frames.length-1].t;
  R.dt=R.frames.length>1?R.frames[1].t-R.frames[0].t:2;
  R.events.sort((a,b)=>a.t-b.t);
  // per-entity tracks (trails) and max life per levy
  R.trL=new Map(); R.trB=new Map(); R.maxL=new Map(); R.trP=[];
  for(const f of R.frames){
    R.trP.push([f.t,f.p[0],f.p[1]]);
    for(const l of (f.l||[])){let a=R.trL.get(l[0]);if(!a)R.trL.set(l[0],a=[]);a.push([f.t,l[1],l[2]]);R.maxL.set(l[0],Math.max(R.maxL.get(l[0])||0,l[10]||l[6]));}
    for(const b of (f.b||[])){const k=b[1];let a=R.trB.get(k);if(!a)R.trB.set(k,a=[]);a.push([f.t,b[2],b[3]]);}
  }
  R.lhit=R.events.filter(e=>e.e==="lhit"); R.ldeath=R.events.filter(e=>e.e==="ldeath");
  R.cmdHit=R.events.filter(e=>e.e==="hit");
  // levy display order: by first appearance, so labels are stable (L1, L2 ...)
  R.order=[...R.trL.keys()]; R.lbl=new Map(R.order.map((id,i)=>[id,"L"+(i+1)]));
  // target tally of the main boss
  const tl={none:0,player:0,levy:0}; R.band=[]; let pk=-1,ps=0;
  for(const f of R.frames){const b=mainBoss(f); if(!b) continue; const k=tkOf(b); tl[k===2?"levy":k===1?"player":"none"]++;
    if(k!==pk){if(pk>=0)R.band.push([ps,f.t,pk]);pk=k;ps=f.t;}}
  if(pk>=0)R.band.push([ps,R.tmax+R.dt,pk]); R.tally=tl;
  // arena image
  const A=R.arena; R.arenaImg=null;
  if(A){
    const c=document.createElement("canvas"); c.width=A.w; c.height=A.h; const g=c.getContext("2d"); const im=g.createImageData(A.w,A.h);
    const grid=A.rows.map(row=>{const o=[];for(let i=0;i+1<row.length;i+=2)for(let k=0;k<row[i+1];k++)o.push(row[i]);return o;});
    const put=(x,y,r,gg,b,a)=>{const o=(y*A.w+x)*4;im.data[o]=r;im.data[o+1]=gg;im.data[o+2]=b;im.data[o+3]=a;};
    for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++){
      const c0=grid[y][x]||0; if(!c0) continue;
      if(c0===1){const top=y===0||!grid[y-1][x]||grid[y-1][x]===3; if(top)put(x,y,52,150,110,255); else put(x,y,13,36,31,255);}
      else if(c0===2) put(x,y,60,130,110,255);
      else put(x,y,16,60,95,170);
    }
    g.putImageData(im,0,0); R.arenaImg=c;
  }
  return R;
}
function summary(R){
  const t=R.tally,n=Math.max(1,t.none+t.player+t.levy);
  const dmg=R.lhit.reduce((a,e)=>a+e.dmg,0);
  const h=R.hdr||{},m=h.meta||{};
  return {boss:m.bossName||(h.boss||"?").replace(/_/g," "),dur:(R.tmax-R.tmin)/TPS,pl:100*t.levy/n,pp:100*t.player/n,pn:100*t.none/n,hits:R.lhit.length,dmg,deaths:R.ldeath.length,meta:m,v:R.v,hasT:R.hasTarget};
}

// ================================================================ loading
function setRec(R,name){
  D=build(R);
  const h=D.hdr||{},m=h.meta||{},s=summary(D);
  $("meta").textContent=[name,s.boss,m.arena,m.target,h.mode,"format "+D.v].filter(Boolean).join("  |  ");
  $("empty").style.display="none"; playing=false; $("play").textContent="Play";
  cur=D.tmin; camMode="fit"; $("followBoss").classList.remove("on"); fitView(); renderInfo(); drawStrip(); draw(); syncUI();
}
function load(text,name){ setRec(parseRec(text),name); }
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(t=>{document.body.classList.add("solo");load(t,f.name);}).catch(err=>alert(err.message));});
const stage=$("stage");
stage.addEventListener("dragover",e=>e.preventDefault());
stage.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)f.text().then(t=>load(t,f.name)).catch(err=>alert(err.message));});
window.addEventListener("dragover",e=>e.preventDefault()); window.addEventListener("drop",e=>e.preventDefault());

// ---- gallery (one page, several recordings embedded as base64 gzip)
function b64bytes(s){const bin=atob(s),n=bin.length,u=new Uint8Array(n);for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);return u;}
let pakoP=null;
function loadPako(){return pakoP||(pakoP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js";s.onload=()=>res(window.pako);s.onerror=()=>rej(new Error("this browser cannot decompress the embedded recordings"));document.head.appendChild(s);}));}
async function gunzip(u8){
  if(typeof DecompressionStream==="function"){
    const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(st).text();
  }
  const p=await loadPako(); return p.ungzip(u8,{to:"string"});
}
const cache=new Map();
async function openGallery(i){
  const g=gallery[i]; galleryIdx=i; location.hash="fight="+i;
  document.querySelectorAll(".card").forEach((c,k)=>c.classList.toggle("sel",k===i));
  $("empty").style.display="flex"; $("empty").textContent="Loading "+g.title+" ...";
  try{
    let R=cache.get(i);
    if(!R){ const text=g.raw!=null?g.raw:await gunzip(b64bytes(g.z)); R=parseRec(text); cache.set(i,R); }
    setRec(R,g.title); document.body.classList.remove("showlist");
  }catch(e){$("empty").textContent="Could not load: "+e.message;}
}
function initGallery(){
  let data=null; try{data=JSON.parse($("gallery-data").textContent.replace(/^\/\*__GALLERY__\*\//,""));}catch(e){}
  if(!data||!data.length) return;
  gallery=data; document.body.classList.remove("solo");
  const box=$("cards");
  gallery.forEach((g,i)=>{
    const s=g.sum||{}, m=s.meta||{};
    const b=document.createElement("button"); b.className="card";
    const sub=[m.arena,m.target?("target "+m.target):null,m.harness].filter(Boolean).join(" · ");
    b.innerHTML=`<b>${esc(g.title)}</b><div class="sub">${esc(sub)} · ${s.dur!=null?s.dur.toFixed(0)+" s":""}</div>`+
      `<div class="badges">${s.hasT?`<span class="bd l" title="share of the fight the boss was aimed at a levy">levy ${s.pl.toFixed(0)}%</span><span class="bd p" title="aimed at the commander">cmd ${s.pp.toFixed(0)}%</span>`:`<span class="bd">no target data</span>`}<span class="bd h">${s.hits} hits</span><span class="bd d">${s.deaths} deaths</span></div>`;
    b.onclick=()=>openGallery(i); box.appendChild(b);
  });
  $("listBtn").onclick=()=>document.body.classList.toggle("showlist");
  document.body.classList.add("showlist");
  const m=/fight=(\d+)/.exec(location.hash); const i0=m?Math.min(gallery.length-1,+m[1]):0;
  openGallery(i0);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ================================================================ helpers
function frameIndex(t){let lo=0,hi=D.frames.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(D.frames[m].t<=t)lo=m;else hi=m-1;}return lo;}
function trackStart(tr,t){let lo=0,hi=tr.length;while(lo<hi){const m=(lo+hi)>>1;if(tr[m][0]<t)lo=m+1;else hi=m;}return lo;}
const nm=(tbl,id)=>(D.names[tbl]&&D.names[tbl][id])||("#"+id);
const lname=id=>(D.lbl.get(id)||("#"+id))+" "+((D.names.soldiers&&D.names.soldiers[id])||"");
function canvasSize(c){const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*dpr)),h=Math.max(10,Math.round(r.height*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}return {w,h,dpr};}
function fitView(){
  const {w,h}=canvasSize($("view")); let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
  const ext=(x,y)=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);};
  // frame the action: the 3rd to 97th percentile of where the levies, the commander and the main boss were (a worm that swings far away must not shrink the picture)
  const xs=[],ys=[]; const add=(x,y)=>{xs.push(x);ys.push(y);};
  for(const t of D.trP) add(t[1],t[2]);
  for(const tr of D.trL.values()) for(const t of tr) add(t[0]>=0?t[1]:0,t[2]);
  for(const f of D.frames){const mb=mainBoss(f); if(mb) add(mb[2],mb[3]);}
  const pc=(a,q)=>{a.sort((m,n)=>m-n);return a[Math.max(0,Math.min(a.length-1,Math.floor(q*(a.length-1))))];};
  if(xs.length){x0=pc(xs,.03);x1=pc(xs,.97);y0=pc(ys,.03);y1=pc(ys,.97);} else ext(0,0);
  const pad=380; x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  const A=D.arena; if(A){x0=Math.max(x0,A.x0*TILE);x1=Math.min(x1,(A.x0+A.w)*TILE);y0=Math.max(y0,A.y0*TILE);y1=Math.min(y1,(A.y0+A.h)*TILE);}
  if(x1-x0<400){const c=(x0+x1)/2;x0=c-200;x1=c+200;} if(y1-y0<300){const c=(y0+y1)/2;y0=c-150;y1=c+150;}
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2; cam.z=Math.min(w/(x1-x0),h/(y1-y0))*0.97;
}
const w2s=(x,y,W,H)=>[(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2];
const lerp=(a,b,u)=>a+(b-a)*u;
function hpColor(fr){fr=Math.max(0,Math.min(1,fr));const r=fr<.5?255:Math.round(255*(1-fr)*2),g=fr>.5?255:Math.round(255*fr*2);return `rgb(${r},${Math.round(g*0.95)},70)`;}

// ================================================================ boss part readout
function bossInfo(b){
  const k=tkOf(b);
  return `${nm("npcs",b[0])}${b[13]?" (part)":" (boss)"}  slot ${b[1]}\nlife ${b[6]}/${b[7]}  (${(100*b[6]/Math.max(1,b[7])).toFixed(0)}%)\nai[0..3] ${b[8].toFixed(1)}, ${b[9].toFixed(1)}, ${b[10].toFixed(1)}, ${b[11].toFixed(1)}\ntarget ${D.hasTarget?(k===2?"levy "+(D.lbl.get(b[15])||b[15]):k===1?"commander":"none"):"slot "+b[12]}${b[16]?"\nhitbox "+b[16]+" x "+b[17]+" px":""}\nspeed ${(Math.hypot(b[4],b[5])*60/16).toFixed(1)} tiles/s`;
}
let partsAt=-1;
function renderParts(f){
  const el=$("parts"); if(!el) return; if(performance.now()-partsAt<120) return; partsAt=performance.now();
  const rows=(f.b||[]).slice().sort((a,b)=>a[13]-b[13]||a[1]-b[1]);

  const by={body:[0,0],minion:[0,0],proj:[0,0],other:[0,0]}; for(const x of D.lhit){const b=by[x.src]||(by[x.src]=[0,0]);b[0]++;b[1]+=x.dmg;}
  const per=new Map(); for(const id of D.order) per.set(id,{id,hits:0,dmg:0,min:1e9,died:null,by:""});
  for(const x of D.lhit){const p=per.get(x.id)||(per.set(x.id,{id:x.id,hits:0,dmg:0,min:1e9,died:null,by:""}),per.get(x.id));p.hits++;p.dmg+=x.dmg;p.min=Math.min(p.min,x.life);}
  for(const x of D.ldeath){const p=per.get(x.id);if(p){p.died=x.t;p.by=x.npc>0?nm("npcs",x.npc):x.by;}}
  let h3=`<section><h2>Levy hits and deaths</h2><div class="kv"><span>levies seen</span><span>${D.order.length}</span><span>hits taken</span><span>${D.lhit.length} (${D.lhit.reduce((a,x)=>a+x.dmg,0)} damage)</span><span>deaths</span><span>${D.ldeath.length}</span></div>`;
  if(!D.lhit.length&&D.v<2) h3+=`<div class="small warn" style="margin-top:6px">Format 1 files carry no levy hit or death events.</div>`;
  else{
    h3+=`<table style="margin-top:8px"><tr><th>source</th><th>hits</th><th>damage</th></tr>`+Object.entries(by).filter(([k,v])=>v[0]).map(([k,v])=>`<tr><td><span style="color:${SRC_COL[k]}">${{body:"boss body part",minion:"minion contact",proj:"projectile",other:"other"}[k]||k}</span></td><td>${v[0]}</td><td>${v[1]}</td></tr>`).join("")+`</table>`;
    h3+=`<table style="margin-top:8px"><tr><th>levy</th><th>hits</th><th>dmg</th><th>fell</th></tr>`+[...per.values()].map(p=>`<tr><td>${esc(lname(p.id))}</td><td>${p.hits}</td><td>${p.dmg}</td><td>${p.died!=null?(p.died/TPS).toFixed(0)+" s ("+esc(p.by)+")":"-"}</td></tr>`).join("")+`</table>`;
  }
  h3+="</section>";
  // commander movement (the original stats)
  const S=computeStats();
  let h4=`<section><details><summary>Commander and levy movement</summary><table style="margin-top:8px"><tr><th></th><th>commander</th><th>levies</th></tr>`+
    [["airborne %","air"],["standing still %","still"],["avg speed (tiles/s)","avg"],["max speed (tiles/s)","max"],["avg distance to boss (tiles)","dist"],["closest to boss (tiles)","distMin"]].map(([l,k])=>`<tr><td>${l}</td><td>${f1(S.ps&&S.ps[k])}</td><td>${f1(S.ls&&S.ls[k])}</td></tr>`).join("")+`</table>`+
    `<div class="small" style="margin-top:6px">Commander actions: ${["jump","xjump","dash","hook","use","hit"].map(k=>k+" "+S.ev[k]).join(", ")}</div></details></section>`;
  $("info").innerHTML=`<section style="grid-column:1/-1"><h2>Boss parts now (life and ai[0..3] from the game)</h2><div style="max-height:220px;overflow:auto"><table id="parts"></table></div><div class="small" style="margin-top:6px">ai values are the NPC's own ai[] slots: they show which attack or phase each part is in. Hover or tap a part on the radar for the same numbers.</div></section>`+h1+h2+h3+h4; partsAt=-1;
}
function summarizeMove(samples,dt){
  const n=samples.length; if(!n) return null; let air=0,still=0,sp=0,mx=0,dsum=0,dn=0,dmin=1e9;
  for(const s of samples){const v=Math.hypot(s.vx,s.vy);sp+=v;mx=Math.max(mx,v);if(!s.grounded)air++;if(v<0.3)still++;if(s.d!=null){dsum+=s.d;dn++;dmin=Math.min(dmin,s.d);}}
  return {air:100*air/n,still:100*still/n,avg:sp/n*60/16,max:mx*60/16,dist:dn?dsum/dn/16:null,distMin:dn?dmin/16:null};
}
function computeStats(){
  const P=[],L=new Map();
  for(const f of D.frames){const b=mainBoss(f),p=f.p;
    P.push({vx:p[2],vy:p[3],grounded:!!(p[5]&1),d:b?Math.hypot(p[0]-b[2],p[1]-b[3]):null});
    for(const l of (f.l||[])){let a=L.get(l[0]);if(!a)L.set(l[0],a=[]);a.push({vx:l[3],vy:l[4],grounded:!!(l[5]&1),d:b?Math.hypot(l[1]-b[2],l[2]-b[3]):null});}}
  const per=[...L.values()].map(s=>summarizeMove(s)).filter(Boolean); const avg=k=>per.length?per.reduce((a,x)=>a+(x[k]||0),0)/per.length:null;
  const ls=per.length?{air:avg("air"),still:avg("still"),avg:avg("avg"),max:avg("max"),dist:avg("dist"),distMin:avg("distMin")}:null;
  const ev={jump:0,xjump:0,dash:0,hook:0,use:0,hit:0}; for(const e of D.events){if(e.e==="hook"&&e.phase!=="launch")continue;if(e.e in ev)ev[e.e]++;}
  return {ps:summarizeMove(P),ls,ev};
}

// ================================================================ controls
function syncUI(){
  if(!D)return; const span=D.tmax-D.tmin||1; $("scrub").value=Math.round((cur-D.tmin)/span*1000);
  $("time").textContent=`${((cur-D.tmin)/TPS).toFixed(1)} / ${(span/TPS).toFixed(1)} s`;
}
function setPlaying(v){playing=v;$("play").textContent=v?"Pause":"Play";last=performance.now();}
$("play").onclick=()=>{if(D){if(!playing&&cur>=D.tmax)cur=D.tmin;setPlaying(!playing);}};
$("scrub").oninput=e=>{if(!D)return;cur=D.tmin+e.target.value/1000*(D.tmax-D.tmin);draw();drawStrip();syncUI();};
$("fit").onclick=()=>{if(D){camMode="fit";$("followBoss").classList.remove("on");fitView();draw();}};
$("followBoss").onclick=()=>{if(!D)return;camMode=camMode==="boss"?"free":"boss";$("followBoss").classList.toggle("on",camMode==="boss");if(camMode==="boss"&&cam.z<0.25)cam.z=0.3;draw();};
const tog=(id,get,set)=>{$(id).onclick=()=>{set(!get());$(id).classList.toggle("on",get());draw();};};
tog("tBoss",()=>trBoss,v=>trBoss=v);tog("tLevy",()=>trLevy,v=>trLevy=v);tog("tProj",()=>trProj,v=>trProj=v);tog("hitBtn",()=>showHit,v=>showHit=v);
$("labelBtn").onclick=()=>{showLabels=!showLabels;$("labelBtn").classList.toggle("on",showLabels);draw();};
$("prevEv").onclick=()=>jumpEvent(-1); $("nextEv").onclick=()=>jumpEvent(1);
window.addEventListener("keydown",e=>{const tg=e.target.tagName;if(tg==="SELECT"||tg==="INPUT"&&e.target.type!=="range")return;
  if(e.code==="Space"){e.preventDefault();$("play").click();}
  if(D&&e.code==="ArrowRight"){cur=Math.min(D.tmax,cur+D.dt*3);draw();drawStrip();syncUI();} if(D&&e.code==="ArrowLeft"){cur=Math.max(D.tmin,cur-D.dt*3);draw();drawStrip();syncUI();}});
// pan / pinch / wheel on the radar
const view=$("view"); const ptrs=new Map(); let pinch=null;
view.addEventListener("pointerdown",e=>{view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});view.style.cursor="grabbing";
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};}});
view.addEventListener("pointermove",e=>{
  const r=view.getBoundingClientRect();
  if(ptrs.has(e.pointerId)&&D){
    const p=ptrs.get(e.pointerId);
    if(ptrs.size===1){cam.x-=(e.clientX-p.x)/cam.z;cam.y-=(e.clientY-p.y)/cam.z;if(camMode==="boss"){camMode="free";$("followBoss").classList.remove("on");}}
    p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.z=Math.max(0.03,Math.min(6,pinch.z*d/pinch.d));}
    draw();return;
  }
  const mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;
  for(const b of blips){const d=Math.hypot(b.x-mx,b.y-my);if(d<b.r&&d<bd){bd=d;best=b;}}
  const tip=$("tip");if(best&&e.pointerType==="mouse"){tip.style.display="block";tip.textContent=best.info;tip.style.left=Math.min(mx+14,r.width-250)+"px";tip.style.top=Math.min(my+14,r.height-90)+"px";}else tip.style.display="none";
});
let tapStart=null;
view.addEventListener("pointerdown",e=>{tapStart={x:e.clientX,y:e.clientY};});
view.addEventListener("pointerup",e=>{if(!tapStart||e.pointerType==="mouse")return;if(Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>6)return;
  const r=view.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;for(const b of blips){const d=Math.hypot(b.x-mx,b.y-my);if(d<b.r+8&&d<bd){bd=d;best=b;}}
  const tip=$("tip");if(best){tip.style.display="block";tip.textContent=best.info;tip.style.left=Math.max(4,Math.min(mx+10,r.width-230))+"px";tip.style.top=Math.max(4,Math.min(my+10,r.height-110))+"px";}else tip.style.display="none";});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)view.style.cursor="grab";};
view.addEventListener("pointerup",endPtr);view.addEventListener("pointercancel",endPtr);
view.addEventListener("pointerleave",()=>{$("tip").style.display="none";});
view.addEventListener("wheel",e=>{if(!D)return;e.preventDefault();const r=view.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const mx=(e.clientX-r.left)*dpr-view.width/2,my=(e.clientY-r.top)*dpr-view.height/2;const wx=cam.x+mx/cam.z,wy=cam.y+my/cam.z;
  cam.z*=e.deltaY<0?1.15:1/1.15;cam.z=Math.max(0.03,Math.min(6,cam.z));cam.x=wx-mx/cam.z;cam.y=wy-my/cam.z;draw();},{passive:false});
let rsz=null;window.addEventListener("resize",()=>{if(!D)return;clearTimeout(rsz);rsz=setTimeout(()=>{if(camMode==="fit")fitView();draw();drawStrip();},60);});
function frameLoop(now){
  if(playing&&D){const dt=Math.min(0.1,(now-last)/1000);last=now;cur+=dt*TPS*parseFloat($("speed").value);if(cur>=D.tmax){cur=D.tmax;setPlaying(false);}syncUI();draw();drawStrip();}
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
window.__loadText=load; window.__state=()=>({D,cur,gallery,galleryIdx});
window.__seek=t=>{cur=t;syncUI();draw();drawStrip();};
initGallery();
</script>
