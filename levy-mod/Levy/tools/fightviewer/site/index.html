<title>Levy Fight Replays</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){

:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef3f1;--panel:#ffffff;--panel2:#f3f7f6;--line:#c9d8d4;--ink:#14282a;--dim:#4f6a66;

  --win:#0a8f50;--loss:#c01f1f;--timeout:#a86400;--fled:#7b3fc4;
  --stage:#f5faf8;--strip-a:#f1f6f5;--strip-b:#e8efed;--strip-label:#6a817d;--bar-bg:#d3e0dd;--tip-bg:#ffffff;--row-line:#dde8e5;--warn:#8a5a00;
  --t-levy:#c03030;--t-cmd:#0a7f9c;--t-none:#55706c;--tb-none:#c3d0cd;--tb-cmd:#1f9ab8;--tb-levy:#d0443a;--tbar-none:#b8c8c5;

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;min-width:0}
#top{display:flex;gap:10px;align-items:center;min-width:0}
#top h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.04em;white-space:nowrap;color:var(--grn)}
#meta{color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
button,select,label.btn{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;min-height:38px}
button:hover,label.btn:hover{background:var(--btn-hover)}
button:active{background:var(--btn-active)}
button.on{background:var(--on-bg);border-color:var(--on-line)}
button:focus-visible,select:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--cyan);outline-offset:1px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn{position:relative;display:inline-flex;align-items:center;justify-content:center}
#listBtn{display:none;width:100%;text-align:left;min-height:48px;font-weight:600}
#listBtn span{font-weight:400;color:var(--dim)}
#body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px}
#list{min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
#main{min-height:0;min-width:0;overflow:auto;border-radius:10px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.filters select{flex:1;min-width:0;padding:4px 8px}
details.grp{margin:0 0 8px}
details.grp>summary{cursor:pointer;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;padding:8px 4px;list-style:revert;min-height:36px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink)}
.card.sel{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn) inset}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card b{font-size:14px}
.card .sub{color:var(--dim);font-size:12px;margin-top:1px}
.card .note{color:var(--ink);font-size:12px;margin-top:6px;opacity:.92;overflow-wrap:anywhere}
.res{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:0 8px;white-space:nowrap}
.res.win{color:var(--win)}.res.loss{color:var(--loss)}.res.timeout{color:var(--timeout)}.res.fled{color:var(--fled)}.res.ended{color:var(--dim)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bd{font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:var(--bd-bg);font-variant-numeric:tabular-nums}
.bd.l{color:var(--l-ink);border-color:var(--l-line)}.bd.p{color:var(--p-ink);border-color:var(--p-line)}.bd.h{color:var(--h-ink);border-color:var(--h-line)}.bd.d{color:var(--d-ink);border-color:var(--d-line)}
.listfoot{margin-top:10px;display:flex;flex-direction:column;gap:6px}
#fightHead{display:flex;flex-direction:column;gap:4px;padding:2px 2px 8px}
#fightHead .ht{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#fightHead b{font-size:16px}
#fightHead .hs{color:var(--dim);font-size:13px}
#fightHead .hn{font-size:13px;overflow-wrap:anywhere}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-height:640px;min-height:260px;background:var(--stage);border:1px solid var(--line);border-radius:10px 10px 0 0;overflow:hidden}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:8px;right:10px;pointer-events:none;font-size:12.5px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
#hud .l{display:flex;flex-direction:column;gap:3px}
#hud .tgt{font-weight:650;color:var(--t-none)}
#hud .tgt.levy{color:var(--t-levy)}#hud .tgt.cmd{color:var(--t-cmd)}
#hud .bar{width:150px;height:6px;background:var(--bar-bg);border-radius:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;background:var(--red)}
#hud .r{text-align:right}
#msg{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:16px;padding:20px;background:var(--stage)}
#msg.show{display:flex}
#msg.err{color:var(--warn)}
#msg button{min-height:44px;padding:8px 20px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--grn);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
#tip{position:absolute;pointer-events:none;background:var(--tip-bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;white-space:pre;display:none;z-index:5;max-width:90%}
#controls{padding:8px 10px 10px;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#scrub{flex:1;min-width:140px;accent-color:var(--grn);height:32px}
#time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:104px;text-align:right}
canvas#strip{width:100%;height:92px;display:block;background:var(--strip-a);border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:pointer}
.legend{display:flex;gap:12px;color:var(--dim);flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.sq{border-radius:1px}
#info{padding:12px 0 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
#info section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;overflow-x:auto}
#info h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
table{border-collapse:collapse;width:100%}
td,th{padding:3px 5px;text-align:right;border-bottom:1px solid var(--row-line);font-variant-numeric:tabular-nums;font-size:13px}
td:first-child,th:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
.small{color:var(--dim);font-size:12px}
.tbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bar-bg);margin:6px 0}
.tbar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv span{overflow-wrap:anywhere}
.kv span:nth-child(odd){color:var(--dim)}
details summary{cursor:pointer;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.warn{color:var(--warn)}
@media (max-width:820px){
  #app{height:auto;min-height:100%}
  #body{display:block}
  #list{display:none;max-height:min(70vh,560px);margin-bottom:10px}
  #app.showlist #list{display:block}
  #main{overflow:visible}
  #listBtn{display:block}
  #top #meta{display:none}
  #stage{aspect-ratio:4/3;max-height:none;min-height:240px}
  button,select,label.btn{min-height:46px}
  #play{min-width:96px}
  #time{min-width:90px}
  #scrub{flex:1 1 100%;order:5;height:36px}
  #time{order:6;flex:1 1 100%;text-align:left}
  canvas#strip{height:84px}
  .legend{display:none}
  .filters select{min-height:42px}
}
</style>
<div id="app">
  <div id="top" role="banner">
    <h1>LEVY FIGHT REPLAYS</h1>
    <span id="meta"></span>
  </div>
  <button id="listBtn" aria-expanded="false">Fights <span id="listBtnSub"></span></button>
  <noscript><p class="warn">This page needs JavaScript to draw the replays.</p></noscript>
  <div id="body">
    <nav id="list" aria-label="Recorded fights">
      <div class="filters"><select id="fBoss" aria-label="filter by boss"><option value="">All bosses</option></select><select id="fRes" aria-label="filter by result"><option value="">Any result</option><option value="win">Win</option><option value="loss">Loss</option><option value="timeout">Timeout</option><option value="fled">Fled</option></select></div>
      <div id="groups"><p class="small">Loading the fight list ...</p></div>
      <div class="listfoot"><label class="btn">Open a local recording (.jsonl)<input id="file" type="file" accept=".jsonl,.json,.txt"></label><span class="small">Or drop a recording on the radar.</span></div>
    </nav>
    <main id="main">
      <div id="fightHead"></div>
      <div id="stage"><canvas id="view"></canvas><div id="hud"></div><div id="msg" class="show"><div class="spin"></div><div id="msgText">Loading ...</div></div><div id="tip"></div></div>
      <div id="controls">
        <div class="row">
          <button id="play" style="min-width:76px">Play</button>
          <button id="prevEv" title="previous hit or death">&#9664; hit</button>
          <button id="nextEv" title="next hit or death">hit &#9654;</button>
          <label class="small">speed <select id="speed"><option value="0.5">0.5x</option><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option></select></label>
          <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="seek">
          <span id="time">0.00 / 0.00 s</span>
        </div>
        <canvas id="strip" aria-label="timeline"></canvas>
        <div class="row">
          <button id="fit" title="show the whole arena">Fit</button>
          <button id="followBoss" title="camera follows the boss">Follow boss</button>
          <button id="tBoss" class="on" title="fading trails behind boss parts">Boss trails</button><button id="tLevy" class="on" title="fading trails behind levies">Levy trails</button><button id="tProj" class="on" title="streaks behind projectiles">Proj trails</button><button id="hitBtn" class="on" title="draw the real hitbox rectangles">Hitboxes</button>
          <button id="labelBtn" title="levy numbers">Labels</button>
          <div class="legend"><span><i style="background:var(--grn)"></i>levy (colour = HP)</span><span><i style="background:var(--red)"></i>boss / part</span><span><i style="background:var(--cyan)"></i>commander</span><span><i style="background:var(--proj)"></i>projectile</span><span><i class="sq" style="background:var(--red)"></i>boxes = real hitboxes</span><span>flash = hit &middot; X = death</span></div>
        </div>
      </div>
      <div id="info"></div>
    </main>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const TPS=60, TILE=16;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
let D=null, playing=false, cur=0, last=0, camMode="fit", trBoss=true, trLevy=true, trProj=true, showHit=true, showLabels=false;
const cam={x:0,y:0,z:0.2};
let blips=[], manifest=null, fights=[], curFight=null, curId=null, loadSeq=0;

// ================================================================ colour tokens (canvas reads the CSS custom properties)
const TOKS=["stage","grn","cyan","red","amb","vio","proj","ink","dim","tNone","tbNone","tbCmd","tbLevy","srcBody","srcMinion","srcProj","srcOther","bossLabel","cmdLabel","flash","death","dash","hook","xjump","scale","fire","terrTop","terrFill","terrFill2","water","hpLo","hpMid","hpHi","stripA","stripB","stripLabel","dLabelInk"];
const T={}; const cssName=k=>"--"+k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase());
function loadTokens(){
  const cs=getComputedStyle(document.documentElement);
  for(const k of TOKS){let v=cs.getPropertyValue(cssName(k)).trim(); if(k==="dLabelInk")v=cs.getPropertyValue("--d-ink").trim(); if(k==="stripA")v=cs.getPropertyValue("--strip-a").trim(); if(k==="stripB")v=cs.getPropertyValue("--strip-b").trim(); if(k==="stripLabel")v=cs.getPropertyValue("--strip-label").trim(); T[k]=v||"#888888";}
  T.src={body:T.srcBody,minion:T.srcMinion,proj:T.srcProj,other:T.srcOther};
}
const rgbCache={};
function rgb(hex){let c=rgbCache[hex];if(c)return c;const m=/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex||"");let h=m?m[1]:"888888";if(h.length===3)h=h.split("").map(x=>x+x).join("");c=rgbCache[hex]=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];return c;}
const al=(hex,a)=>{const c=rgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;};
function mix(a,b,u){const x=rgb(a),y=rgb(b);return `rgb(${Math.round(x[0]+(y[0]-x[0])*u)},${Math.round(x[1]+(y[1]-x[1])*u)},${Math.round(x[2]+(y[2]-x[2])*u)})`;}
function hpColor(fr){fr=Math.max(0,Math.min(1,fr));return fr<.5?mix(T.hpLo,T.hpMid,fr*2):mix(T.hpMid,T.hpHi,(fr-.5)*2);}
function retheme(){loadTokens(); if(D){makeArena(D);draw();drawStrip();}}
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",retheme);}catch(e){}
try{new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}

// ================================================================ parsing
function parseRec(text){   // a raw FightRecorder .jsonl (local file)
  const R={hdr:null,arena:null,frames:[],events:[],names:{items:{},npcs:{},projectiles:{},buffs:{},soldiers:{}},end:null};
  for(const line of text.split("\n")){
    const s=line.trim(); if(!s) continue;
    let o; try{o=JSON.parse(s);}catch(e){continue;}
    switch(o.k){case "hdr":R.hdr=o;break;case "arena":R.arena=o;break;case "f":R.frames.push(o);break;case "e":R.events.push(o);break;case "names":R.names=o;break;case "end":R.end=o;break;}
  }
  if(!R.frames.length) throw new Error("no frames in file");
  return R;
}
// inverse of make_site.py's enc_rows: a bare number = same row as last time, [-key-1,mask,values...] = only the masked fields changed
// (positions in ipos are differences), anything else = the full row.
function decRows(rows,last,idx,ipos){
  const out=new Array(rows.length);
  for(let n=0;n<rows.length;n++){
    const r=rows[n]; let row;
    if(typeof r==="number") row=last.get(r).slice();
    else if(r[0]<0){const prev=last.get(-r[0]-1);row=prev.slice();let m=r[1],k=2;for(let i=0;m;i++,m=Math.floor(m/2))if(m%2){row[i]=ipos.has(i)?prev[i]+r[k]:r[k];k++;}}
    else row=r;
    last.set(row[idx],row); out[n]=row;
  }
  return out;
}
function fromData(o){      // a data/<fight>.json file written by make_site.py
  if(!o||!o.frames||!o.frames.length) throw new Error("the data file has no frames");
  if(o.v>=2){const L=new Map(),B=new Map(),pl=new Set([1,2]),pb=new Set([2,3]);for(const f of o.frames){if(f.l)f.l=decRows(f.l,L,0,pl);if(f.b)f.b=decRows(f.b,B,1,pb);}}
  return {hdr:o.hdr||null,arena:o.arena||null,frames:o.frames,events:o.events||[],names:o.names||{items:{},npcs:{},projectiles:{},buffs:{},soldiers:{}},end:o.end||null};
}
const tkOf=b=>b.length>14?b[14]:((b[12]>=0&&b[12]<255)?1:0);
function mainBoss(f){const bs=f.b||[];for(const b of bs) if(!b[13]) return b; return bs[0]||null;}
function makeArena(R){
  const A=R.arena; R.arenaImg=null; if(!A||!R.arenaGrid) return;
  const c=document.createElement("canvas"); c.width=A.w; c.height=A.h; const g=c.getContext("2d"); const im=g.createImageData(A.w,A.h);
  const grid=R.arenaGrid, top=rgb(T.terrTop), fill=rgb(T.terrFill), f2=rgb(T.terrFill2), wat=rgb(T.water);
  const put=(x,y,k,a)=>{const o=(y*A.w+x)*4;im.data[o]=k[0];im.data[o+1]=k[1];im.data[o+2]=k[2];im.data[o+3]=a;};
  for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++){
    const c0=grid[y][x]||0; if(!c0) continue;
    if(c0===1){const tp=y===0||!grid[y-1][x]||grid[y-1][x]===3; if(tp)put(x,y,top,255); else put(x,y,fill,255);}
    else if(c0===2) put(x,y,f2,255);
    else put(x,y,wat,170);

  g.putImageData(im,0,0); R.arenaImg=c;
}
function build(R){
  R.v=(R.hdr&&R.hdr.format)||1;
  R.hasTarget=R.frames.some(f=>(f.b||[]).some(b=>b.length>14));
  R.tmin=R.frames[0].t; R.tmax=R.frames[R.frames.length-1].t;
  R.dt=R.frames.length>1?R.frames[1].t-R.frames[0].t:2;
  R.events.sort((a,b)=>a.t-b.t);
  R.trL=new Map(); R.trB=new Map(); R.maxL=new Map(); R.trP=[];
  for(const f of R.frames){
    R.trP.push([f.t,f.p[0],f.p[1]]);
    for(const l of (f.l||[])){let a=R.trL.get(l[0]);if(!a)R.trL.set(l[0],a=[]);a.push([f.t,l[1],l[2]]);R.maxL.set(l[0],Math.max(R.maxL.get(l[0])||0,l[10]||l[6]));}
    for(const b of (f.b||[])){const k=b[1];let a=R.trB.get(k);if(!a)R.trB.set(k,a=[]);a.push([f.t,b[2],b[3]]);}
  }
  R.lhit=R.events.filter(e=>e.e==="lhit"); R.ldeath=R.events.filter(e=>e.e==="ldeath");
  R.cmdHit=R.events.filter(e=>e.e==="hit");
  R.order=[...R.trL.keys()]; R.lbl=new Map(R.order.map((id,i)=>[id,"L"+(i+1)]));
  const tl={none:0,player:0,levy:0}; R.band=[]; let pk=-1,ps=0;
  for(const f of R.frames){const b=mainBoss(f); if(!b) continue; const k=tkOf(b); tl[k===2?"levy":k===1?"player":"none"]++;
    if(k!==pk){if(pk>=0)R.band.push([ps,f.t,pk]);pk=k;ps=f.t;}}
  if(pk>=0)R.band.push([ps,R.tmax+R.dt,pk]); R.tally=tl;
  const A=R.arena; R.arenaGrid=null;
  if(A) R.arenaGrid=A.rows.map(row=>{const o=[];for(let i=0;i+1<row.length;i+=2)for(let k=0;k<row[i+1];k++)o.push(row[i]);return o;});
  makeArena(R);
  return R;
}
function summary(R){
  const t=R.tally,n=Math.max(1,t.none+t.player+t.levy);
  const dmg=R.lhit.reduce((a,e)=>a+e.dmg,0);
  const h=R.hdr||{},m=h.meta||{};
  return {boss:m.bossName||(h.boss||"?").replace(/_/g," "),dur:(R.tmax-R.tmin)/TPS,pl:100*t.levy/n,pp:100*t.player/n,pn:100*t.none/n,hits:R.lhit.length,dmg,deaths:R.ldeath.length,meta:m,v:R.v,hasT:R.hasTarget};
}

// ================================================================ messages (loading / errors)
function showMsg(text,kind,retry){
  const m=$("msg"); m.className="show"+(kind==="err"?" err":""); m.innerHTML="";
  if(kind!=="err"){const s=document.createElement("div");s.className="spin";m.appendChild(s);}
  const t=document.createElement("div");t.id="msgText";t.textContent=text;m.appendChild(t);
  if(retry){const b=document.createElement("button");b.textContent="Try again";b.onclick=retry;m.appendChild(b);}
}
function hideMsg(){$("msg").className="";}

// ================================================================ loading
const resLabel={win:"win",loss:"loss",timeout:"timeout",fled:"fled",ended:"ended"};
function setRec(R,name,f){
  D=build(R); D.fight=f||null;
  const h=D.hdr||{},m=h.meta||{},s=summary(D);
  $("meta").textContent=[name,s.boss,m.arena,h.mode].filter(Boolean).join("  |  ");
  head(f,name,s);
  hideMsg(); setPlaying(false);
  cur=D.tmin; camMode="fit"; $("followBoss").classList.remove("on"); fitView(); renderInfo(); drawStrip(); draw(); syncUI();

function head(f,name,s){

  el.innerHTML=`<div class="ht"><b>${esc(f.boss)}</b><span class="res ${f.result}">${resLabel[f.result]||f.result}</span><span class="hs">${esc(f.mode)} &middot; ${f.levies} levies &middot; ${esc(f.arena)} &middot; ${f.dur.toFixed(0)} s &middot; ${esc(setTitleOf(f))}</span></div>`+(f.note?`<div class="hn">${esc(f.note)}</div>`:"");

function loadLocal(file){
  file.text().then(t=>{curId=null;document.querySelectorAll(".card").forEach(c=>c.classList.remove("sel"));setRec(parseRec(t),file.name,null);$("app").classList.remove("showlist");}).catch(err=>showMsg("Could not read that file: "+err.message,"err"));

// ---- hosted fights: manifest + one lazily fetched JSON per fight
const cache=new Map();   // id -> built recording (small LRU)
function remember(id,R){cache.delete(id);cache.set(id,R);while(cache.size>4)cache.delete(cache.keys().next().value);}
function setTitleOf(f){for(const s of manifest.sets)if(s.id===f.set)return s.title;return "";}
async function openFight(id){
  const f=fights.find(x=>x.id===id); if(!f) return;
  const seq=++loadSeq; curId=id; curFight=f;
  try{history.replaceState(null,"","#f="+encodeURIComponent(id));}catch(e){}
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",c.dataset.id===id));
  $("listBtnSub").textContent="· "+f.boss+" · "+f.mode;
  $("app").classList.remove("showlist"); $("listBtn").setAttribute("aria-expanded","false");
  setPlaying(false);
  showMsg("Loading "+f.boss+" ("+f.mode+") ... "+(f.bytes/1048576).toFixed(1)+" MB");
  try{
    let R=cache.get(id);
    if(!R){
      const r=await fetch(f.file); if(!r.ok) throw new Error("the server answered "+r.status+" for "+f.file);
      R=fromData(await r.json());
    }
    if(seq!==loadSeq) return;
    remember(id,R); setRec(R,f.boss,f);
    if(window.innerWidth<=820) window.scrollTo(0,0);
  }catch(e){
    if(seq!==loadSeq) return;
    showMsg("Could not load this fight: "+e.message+".","err",()=>openFight(id));
  }
}
function renderList(){
  const bs=$("fBoss").value, rs=$("fRes").value, box=$("groups"); box.innerHTML="";
  let shown=0;
  for(const s of manifest.sets){
    const list=s.fights.filter(f=>(!bs||f.boss===bs)&&(!rs||f.result===rs)); if(!list.length) continue; shown+=list.length;
    const d=document.createElement("details"); d.className="grp"; d.open=true;
    d.innerHTML=`<summary>${esc(s.title)} (${list.length})</summary><div class="cards"></div>`;
    const cards=d.querySelector(".cards");
    for(const f of list){
      const b=document.createElement("button"); b.className="card"+(f.id===curId?" sel":""); b.dataset.id=f.id;
      b.innerHTML=`<div class="ct"><b>${esc(f.boss)}</b><span class="res ${f.result}">${resLabel[f.result]||f.result}</span></div>`+
        `<div class="sub">${esc(f.mode)} &middot; ${f.levies} levies &middot; ${esc(f.arena)} &middot; ${f.dur.toFixed(0)} s</div>`+
        `<div class="badges">${f.hasT?`<span class="bd l" title="share of the fight the boss was aimed at a levy">boss on levies ${f.pl.toFixed(0)}%</span>`:`<span class="bd">no target data</span>`}<span class="bd h">${f.hits} hits</span><span class="bd d">${f.deaths} deaths</span></div>`+
        (f.note?`<div class="note">${esc(f.note)}</div>`:"");
      b.onclick=()=>openFight(f.id); cards.appendChild(b);
    }
    box.appendChild(d);

  if(!shown) box.innerHTML='<p class="small">No fights match these filters.</p>';
}
async function init(){
  showMsg("Loading the fight list ...");
  try{
    const r=await fetch("data/manifest.json"); if(!r.ok) throw new Error("the server answered "+r.status+" for data/manifest.json");
    manifest=await r.json();
  }catch(e){
    $("groups").innerHTML='<p class="warn">Could not load the fight list.</p>';
    showMsg("Could not load the fight list: "+e.message+".","err",init); return;
  }
  fights=[]; for(const s of manifest.sets) for(const f of s.fights){f.set=s.id;fights.push(f);}
  if(!fights.length){showMsg("The fight list is empty.","err");return;}
  const bosses=[...new Set(fights.map(f=>f.boss))].sort(); const sel=$("fBoss");
  sel.innerHTML='<option value="">All bosses</option>'+bosses.map(b=>`<option>${esc(b)}</option>`).join("");
  sel.onchange=renderList; $("fRes").onchange=renderList;
  $("listBtn").onclick=()=>{const on=$("app").classList.toggle("showlist");$("listBtn").setAttribute("aria-expanded",on?"true":"false");};
  $("listBtnSub").textContent="· "+fights.length+" recorded";
  const m=/[#&]f=([^&]+)/.exec(location.hash); let id=m?decodeURIComponent(m[1]):null;
  if(!fights.some(f=>f.id===id)) id=manifest.default&&fights.some(f=>f.id===manifest.default)?manifest.default:fights[0].id;
  curId=id; renderList();
  const c=document.querySelector(".card.sel"); if(c&&window.innerWidth>820) c.scrollIntoView({block:"nearest"});
  openFight(id);
}

// ================================================================ helpers
function frameIndex(t){let lo=0,hi=D.frames.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(D.frames[m].t<=t)lo=m;else hi=m-1;}return lo;}

const nm=(tbl,id)=>(D.names[tbl]&&D.names[tbl][id])||("#"+id);
const lname=id=>(D.lbl.get(id)||("#"+id))+" "+((D.names.soldiers&&D.names.soldiers[id])||"");
function canvasSize(c){const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*dpr)),h=Math.max(10,Math.round(r.height*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}return {w,h,dpr};}
function fitView(){
  const {w,h}=canvasSize($("view")); let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
  const ext=(x,y)=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);};
  const xs=[],ys=[]; const add=(x,y)=>{xs.push(x);ys.push(y);};
  for(const t of D.trP) add(t[1],t[2]);
  for(const tr of D.trL.values()) for(const t of tr) add(t[0]>=0?t[1]:0,t[2]);
  for(const f of D.frames){const mb=mainBoss(f); if(mb) add(mb[2],mb[3]);}
  const pc=(a,q)=>{a.sort((m,n)=>m-n);return a[Math.max(0,Math.min(a.length-1,Math.floor(q*(a.length-1))))];};
  if(xs.length){x0=pc(xs,.03);x1=pc(xs,.97);y0=pc(ys,.03);y1=pc(ys,.97);} else ext(0,0);
  const pad=380; x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  const A=D.arena; if(A){x0=Math.max(x0,A.x0*TILE);x1=Math.min(x1,(A.x0+A.w)*TILE);y0=Math.max(y0,A.y0*TILE);y1=Math.min(y1,(A.y0+A.h)*TILE);}
  if(x1-x0<400){const c=(x0+x1)/2;x0=c-200;x1=c+200;} if(y1-y0<300){const c=(y0+y1)/2;y0=c-150;y1=c+150;}
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2; cam.z=Math.min(w/(x1-x0),h/(y1-y0))*0.97;
}
const w2s=(x,y,W,H)=>[(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2];
const lerp=(a,b,u)=>a+(b-a)*u;

function hbox(g,sc,dpr,x,y,w,h,fill,stroke,lw,minPx){

function interp(){

view.addEventListener("pointerdown",e=>{tapStart={x:e.clientX,y:e.clientY};});

  const r=view.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;for(const b of blips){const d=Math.hypot(b.x-mx,b.y-my);if(d<b.r+8&&d<bd){bd=d;best=b;}}
  const tip=$("tip");if(best){tip.style.display="block";tip.textContent=best.info;tip.style.left=Math.max(4,Math.min(mx+10,r.width-230))+"px";tip.style.top=Math.max(4,Math.min(my+10,r.height-110))+"px";}else tip.style.display="none";});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)view.style.cursor="grab";};
view.addEventListener("pointerup",endPtr);view.addEventListener("pointercancel",endPtr);
view.addEventListener("pointerleave",()=>{$("tip").style.display="none";});
view.addEventListener("dblclick",()=>$("fit").click());
view.addEventListener("wheel",e=>{if(!D)return;e.preventDefault();free();const r=view.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const mx=(e.clientX-r.left)*dpr-view.width/2,my=(e.clientY-r.top)*dpr-view.height/2;const wx=cam.x+mx/cam.z,wy=cam.y+my/cam.z;
  cam.z*=e.deltaY<0?1.15:1/1.15;cam.z=Math.max(0.03,Math.min(6,cam.z));cam.x=wx-mx/cam.z;cam.y=wy-my/cam.z;draw();},{passive:false});
let rsz=null;window.addEventListener("resize",()=>{if(!D)return;clearTimeout(rsz);rsz=setTimeout(()=>{if(camMode==="fit")fitView();draw();drawStrip();},60);});
function frameLoop(now){
  if(playing&&D){const dt=Math.min(0.1,(now-last)/1000);last=now;cur+=dt*TPS*parseFloat($("speed").value);if(cur>=D.tmax){cur=D.tmax;setPlaying(false);}syncUI();draw();drawStrip();}
  requestAnimationFrame(frameLoop);
}
loadTokens();
requestAnimationFrame(frameLoop);
window.__seek=t=>{cur=t;syncUI();draw();drawStrip();};
window.__state=()=>({D,cur,playing,curId});
init();
</script>
